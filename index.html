<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FBFCFE">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Kopfsache">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Playpen+Sans:wght@500;700&display=swap" rel="stylesheet">
<title>Kopfsache</title>
<style>
/* Kopfsache – Karoheft & Rotstift
   Papier, Füllertinte, Rotstift, Textmarker. Schrift: Playpen Sans (Handschrift-Überschriften), Atkinson Hyperlegible (Text). */
:root{
 --bg:#FBFCFE;--grid:#DFE8F3;--margin:#EBA9A3;
 --card:#FFFFFF;--card2:#EEF3F9;--line:#CBD6E4;
 --text:#2E333B;--muted:#5F6876;--faint:#A3AEBE;
 --acc:#1F3FA8;--acc2:#172F80;--accd:#E4EAF8;
 --hl:#F7E36A;--warn:#8A5A00;
 --bad:#C7332A;--badd:#FBE4E2;--good:#2F7D4F;--goodd:#E3F1E8;
 --hand:"Playpen Sans","Segoe Print","Comic Sans MS",cursive;
 --body:"Atkinson Hyperlegible",-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;color:var(--text);font:17px/1.5 var(--body);background-color:var(--bg);
 background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:20px 20px}
#app{position:relative;max-width:600px;min-height:100vh;margin:0 auto;padding:22px 18px calc(30px + env(safe-area-inset-bottom)) 32px}
#app::before{content:"";position:absolute;left:16px;top:0;bottom:0;width:2px;background:var(--margin)}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;-webkit-user-select:none;user-select:none}
button:focus-visible,.opt:focus-visible,.field:focus-visible,.tin:focus-visible,[role=button]:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.small{font-size:13px;color:var(--muted)}
.muted{color:var(--muted)}
h1{font:700 32px/1.1 var(--hand);color:var(--acc);margin:4px 0 0}
h2{font:500 18px/1.3 var(--hand);color:var(--text);margin:30px 0 10px}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.pts{text-align:right}.pts b{font:700 24px/1.2 var(--hand);color:var(--acc);display:block}

/* Umschalter */
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:4px}
.seg button{flex:1;padding:10px 6px;border-radius:6px;color:var(--muted);font-size:15px}
.seg button.on{background:var(--accd);color:var(--acc);font-weight:700;box-shadow:inset 0 0 0 1.5px var(--acc)}
/* Fächer als Hefte mit farbigem Umschlag */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{--sc:var(--acc);background:var(--card);border:1px solid var(--line);border-top:7px solid var(--sc);border-radius:0;padding:14px;text-align:left;min-height:108px;display:flex;flex-direction:column;justify-content:flex-start}
.tile:active{background:var(--card2)}
.mono{width:34px;height:34px;border-radius:6px;display:grid;place-items:center;font:700 15px/1 var(--hand);background:var(--accd);background:color-mix(in srgb,var(--sc,var(--acc)) 13%,#fff);color:var(--sc,var(--acc));flex:none}
.tile .t{font-weight:700;margin-top:10px;line-height:1.25}
.tile .s{font-size:13px;color:var(--muted)}
.tile.wide{grid-column:1/-1;flex-direction:row;align-items:center;justify-content:flex-start;min-height:auto;gap:14px}
.tile.wide .t{margin:0}
.tbar{height:4px;background:var(--card2);border-radius:2px;margin-top:8px;overflow:hidden}
.tbar i{display:block;height:100%;background:var(--sc,var(--acc))}

.foot{margin-top:34px;display:flex;justify-content:center}
.hold{position:relative;overflow:hidden;padding:9px 16px;border-radius:8px;color:var(--muted);font-size:13px;border:1px solid var(--line);background:var(--card)}
.hold i{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--accd);z-index:0}
.hold span{position:relative}

/* Kopfzeile in Runden */
.bar{display:flex;align-items:center;gap:14px;margin-bottom:18px}
.x{width:36px;height:36px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--muted);font-size:15px;flex:none}
.prog{flex:1;height:6px;background:var(--card2);border-radius:3px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--acc);transition:width .4s ease}

.card{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:20px}
.qt{font-size:21px;line-height:1.5;margin:10px 0 4px}

/* Entscheidendes Wort: mit Textmarker angestrichen */
mark.kw{color:var(--text);padding:0 3px;margin:0 -1px;border-radius:2px;background:linear-gradient(100deg,transparent 2%,var(--hl) 4%,var(--hl) 96%,transparent 98%) no-repeat 0 55%/100% 78%;animation:hl .5s ease-out both}
@keyframes hl{from{background-size:0% 78%}to{background-size:100% 78%}}
.hint{font-size:14px;color:var(--warn);margin-top:10px}
.read{height:3px;background:var(--card2);border-radius:2px;margin-top:16px;overflow:hidden}
.read i{display:block;height:100%;width:0;background:var(--faint)}
.readlbl{font-size:12px;color:var(--muted);margin-top:6px}

/* Antworten */
#ans{margin-top:14px}
.opt{display:block;width:100%;text-align:left;padding:14px 16px;background:var(--card);border:1.5px solid var(--line);border-radius:8px;margin-bottom:8px;font-size:17px;line-height:1.35}
.opt.on{border-color:var(--acc);background:var(--accd)}
.fade{animation:fi .35s ease both}
@keyframes fi{from{opacity:0}to{opacity:1}}
.conf{margin-top:14px}
.conf .small{margin-bottom:8px}
.cgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.cbtn{background:var(--card);border:1.5px solid var(--line);border-radius:8px;padding:12px 6px;text-align:center;font-weight:700;font-size:15px;line-height:1.25}
.cbtn small{display:block;font-weight:400;color:var(--muted);font-size:12px;margin-top:3px}
.cbtn:active{border-color:var(--acc);background:var(--accd)}
.pad .small{margin-bottom:8px}
.disp{background:var(--card);border:1.5px solid var(--line);border-radius:8px;padding:12px 16px;font-size:26px;font-weight:700;min-height:62px;display:flex;align-items:center;gap:8px;font-variant-numeric:tabular-nums;color:var(--acc)}
.disp .ph{color:var(--faint)}.disp .unit{font-size:17px;color:var(--muted);font-weight:400}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.key{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:14px 0;font-size:22px}
.key:active{background:var(--card2)}
.key.kü{font-size:15px}
.tin{width:100%;background:var(--card);border:1.5px solid var(--line);border-radius:8px;padding:14px 16px;color:var(--acc);font:700 24px/1.3 var(--body)}
.tin:focus{outline:none;border-color:var(--acc)}

/* Knöpfe */
.btn{display:block;width:100%;padding:15px;border-radius:8px;font-weight:700;text-align:center;margin-top:14px;font-size:17px}
.btn.primary{background:var(--acc);color:#fff}
.btn.primary:hover{background:var(--acc2)}
.btn.ghost{border:1px solid var(--line);background:var(--card);color:var(--text)}
.btn:disabled{opacity:.5}
.btn.timed{position:relative;overflow:hidden;background:var(--card2);color:var(--muted);opacity:1}
.btn.timed .fill{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--accd)}
.btn.timed .lbl{position:relative}
.btn.timed.ready{background:var(--acc);color:#fff}

/* Wissenskarte und Feedback wie Randnotizen */
.infot{font:700 19px/1.2 var(--hand);color:var(--acc)}
.infotext{font-size:19px;line-height:1.6;margin-top:10px}
.fb{}

.fbh{font:700 23px/1.2 var(--hand);color:var(--acc)}
.fb.bad .fbh{color:var(--bad)}
.fb .rows{margin:10px 0 4px;font-size:15px;color:var(--muted)}
.fb .rows b{color:var(--text);font-weight:700}
.fb p{margin:12px 0 0;font-size:17px;line-height:1.55}
.note{margin-top:12px;font-size:14px;color:var(--warn)}
.delta{text-align:center;margin-top:14px;font:500 16px var(--hand);color:var(--muted)}

/* Rundenende, Eltern */
.big{font:700 46px/1.1 var(--hand);color:var(--acc)}
.kv{display:grid;grid-template-columns:1fr auto;gap:10px 16px;margin-top:16px;font-size:15px}
.kv span:nth-child(odd){color:var(--muted)}
.kv span:nth-child(even){text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.list{margin:8px 0 0;padding:0;list-style:none;font-size:15px}
.list li{padding:8px 0;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:10px}
.list li:first-child{border-top:0}
.offer{margin-top:14px;border:1.5px solid var(--acc)}
.field{width:100%;background:var(--card);border:1px solid var(--line);border-radius:6px;padding:11px 12px;color:var(--text);font:inherit}
textarea.field{min-height:130px;resize:vertical;font-size:15px;line-height:1.5}
.lbl2{font-size:14px;color:var(--muted);margin:14px 0 6px}
.days{display:flex;gap:6px;align-items:flex-end;height:70px;margin-top:10px}
.days div{flex:1;text-align:center;font-size:11px;color:var(--muted)}
.days i{display:block;background:#B9C6EA;border-radius:2px;margin-bottom:4px;min-height:2px}
.lnk{font-size:13px;color:var(--acc);padding:4px 2px;font-weight:700}.lnk.dang{color:var(--bad)}
.vl li{align-items:center;flex-wrap:wrap;gap:4px 10px}.vl li>span:first-child{white-space:nowrap}
p.expl{font-size:14px;color:var(--muted);line-height:1.55;margin:8px 0 0}

/* Schriftliches Rechnen */
.col{display:grid;gap:4px;justify-content:center;margin:10px 0 4px;font-variant-numeric:tabular-nums}
.col .c{height:44px;display:grid;place-items:center;font-size:24px}
.col .op{color:var(--muted)}
.col .ü{font-size:11px;color:var(--muted)}
.col .cell{border:1px solid var(--line);border-radius:4px;background:var(--card);cursor:pointer;color:var(--acc);font-weight:700}
.col .cell.act{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc)}
.col .car{height:30px;font-size:15px;color:var(--warn);background:transparent;border-style:dashed}
.col .line{grid-column:1/-1;height:2px;background:var(--text);opacity:.6;margin:2px 0}
.col .bad{color:var(--bad)}.col .good{color:var(--good)}
.col.sm .c{height:30px;font-size:18px}
.rtab{display:grid;grid-template-columns:auto auto 1fr;gap:6px 12px;font-variant-numeric:tabular-nums}
.rtab span:nth-child(3n+1){text-align:right}.rtab span:nth-child(3n+2){color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--card);border:1.5px solid var(--warn);color:var(--text);padding:12px 18px;border-radius:8px;font-size:15px;max-width:90vw;opacity:0;transition:opacity .4s;pointer-events:none;z-index:9}
.toast.show{opacity:1}

/* Abzeichen als Lehrer-Stempel */
.ico{--rot:-6deg;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;border:2px solid currentColor;color:var(--acc);flex:none;transform:rotate(var(--rot));opacity:.92}
.ico svg{width:18px;height:18px}
.ico.fl{color:var(--bad)}
.ico.off{color:var(--faint);border-style:dashed;transform:none;opacity:1}
.stamp{width:76px;height:76px;border-radius:50%;border:4px double var(--bad);color:var(--bad);display:grid;place-content:center;text-align:center;transform:rotate(-8deg);flex:none;background:rgba(255,255,255,.6)}
.stamp b{font:700 28px/1 var(--hand)}
.stamp span{font:500 11px/1.2 var(--hand)}
.stamp.off{border-color:var(--faint);color:var(--faint);border-style:dashed;border-width:2px;transform:none}
.badge{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line)}
.badge:first-child{border-top:0;padding-top:0}.badge:last-child{padding-bottom:0}
.badge.off .pmain>div:first-child{color:var(--muted)}
.newb{display:flex;gap:12px;align-items:center;margin-top:10px}
.newb .ico{animation:stamp .55s cubic-bezier(.3,1.5,.5,1) both}
.newb:nth-child(2) .ico{animation-delay:.25s}.newb:nth-child(3) .ico{animation-delay:.5s}
@keyframes stamp{from{transform:scale(1.8) rotate(-24deg);opacity:0}to{transform:rotate(var(--rot));opacity:.92}}

/* Fortschritts-Karte */
.pcard{margin-top:18px;cursor:pointer;padding:16px}
.prow{display:flex;gap:14px;align-items:center}
.pmain{flex:1;min-width:0}
.pbig{font:700 20px/1.25 var(--hand);color:var(--text)}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin:14px 0 8px;text-align:center;font-size:11px;color:var(--muted)}
.week i{display:block;width:16px;height:16px;border-radius:50%;margin:0 auto 4px;border:1.5px solid var(--line)}
.week i.on{background:var(--acc);border-color:var(--acc)}
.week i.jk{background:linear-gradient(90deg,var(--acc) 50%,transparent 50%);border-color:var(--acc)}
.week i.open{border-style:dashed;border-color:var(--muted)}
.pbar{height:6px;background:var(--card2);border-radius:3px;overflow:hidden;margin:6px 0 4px}
.pbar i{display:block;height:100%;background:var(--acc)}
.psep{height:0;border-top:1.5px dashed var(--line);margin:14px 0 12px}
.prow2{display:flex;justify-content:space-between;align-items:baseline}
.bicons{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}

/* Belohnungsspiele: Sternsplitter und Nachtgarten */
.gchoice{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.gbtn{display:block;text-align:left;background:var(--card);border:1.5px solid var(--acc);border-radius:8px;padding:12px}
.gbtn b{display:block;font:700 18px/1.2 var(--hand);color:var(--acc)}
.gbtn span{display:block;font-size:13px;color:var(--muted);margin-top:3px}
.gbtn:active{background:var(--accd)}
.rew{margin-top:14px}
.rew .rh{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.rew .rt{font:700 20px/1.25 var(--hand);color:var(--text)}
.rew .pbar{margin-top:10px}
#ssov{position:fixed;inset:0;z-index:50;background:#07061a;display:flex;flex-direction:column}
#ssov[hidden]{display:none}
#ssov .sbar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:calc(8px + env(safe-area-inset-top)) 12px 8px;color:#d8d4ff;font-size:15px;border-bottom:1px solid #2a2560}
#ssov .sbar button{padding:10px 14px;border-radius:8px;border:1px solid #3b3480;color:#d8d4ff;font-weight:700;font-size:15px}
#ssov .sbar button.done{background:#5ef2ff;color:#07061a;border-color:#5ef2ff}
#ssov iframe{flex:1;width:100%;min-height:0;border:0;display:block}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast"></div>
<div id="ssov" hidden></div>
<!-- Sternsplitter (aus weltraum.html), startet als Belohnung in einem eigenen Rahmen -->
<script type="text/plain" id="ss-src"><!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Sternsplitter</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root{
  /* Ein Arcade-Gehäuse im Hochformat, mittig im Fenster, Rest bleibt schwarzer Raum */
  --void:#07061a;
  --hull:#5ef2ff;
  --hostile:#ff4fa8;
  --credit:#ffc23d;
  --warn:#ff7a3d;
  --ink:#d8d4ff;
  --display:"Press Start 2P",ui-monospace,"Courier New",monospace;
  color-scheme:dark;
}
html,body{height:100%;margin:0;background:var(--void);color:var(--ink);overflow:hidden;
  touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
#wrap{position:relative;height:100%;display:flex;align-items:center;justify-content:center}
#stage{position:relative}
canvas{display:block;background:#000;touch-action:none;outline:none;
  box-shadow:0 0 0 1px #2a2560,0 0 48px #19134d}
#scan{position:absolute;inset:0;pointer-events:none;
  background:repeating-linear-gradient(to bottom,rgba(0,0,0,.22) 0 1px,transparent 1px 3px);
  mix-blend-mode:multiply}
#mute{position:absolute;right:6px;bottom:8px;font:11px/1 var(--display);color:var(--ink);
  background:rgba(7,6,26,.7);border:1px solid #3b3480;padding:7px 8px;cursor:pointer;letter-spacing:.05em}
#mute:focus-visible{outline:2px solid var(--hull);outline-offset:2px}
</style>
</head>
<body>
<div id="wrap">
  <div id="stage">
    <canvas id="c" tabindex="0" aria-label="Sternsplitter Spielfeld"></canvas>
    <div id="scan"></div>
    <button id="mute" type="button" aria-label="Ton an oder aus">TON AN</button>
  </div>
</div>
<script>
(() => {
'use strict';
const COL = {hull:'#5ef2ff', hostile:'#ff4fa8', credit:'#ffc23d', warn:'#ff7a3d', ink:'#d8d4ff',
             dim:'#6a63b8', violet:'#a68bff', red:'#ff3b5c', white:'#ffffff'};
const FONT = '"Press Start 2P", ui-monospace, monospace';
const W = 360, H = 640;
const TOP = 34, BOTTOM = H - 40;
// Belohnungsmodus: eingebettet in Kopfsache, ein Spiel pro Belohnung, kein Neustart
const REWARD = !!window.SS_REWARD;
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;

const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const stage = document.getElementById('stage');
const muteBtn = document.getElementById('mute');
let S = 1;

function resize(){
  S = Math.min(innerWidth / W, innerHeight / H);
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const cw = Math.floor(W * S), ch = Math.floor(H * S);
  cv.style.width = cw + 'px'; cv.style.height = ch + 'px';
  stage.style.width = cw + 'px'; stage.style.height = ch + 'px';
  cv.width = Math.round(cw * dpr); cv.height = Math.round(ch * dpr);
  ctx.setTransform(cv.width / W, 0, 0, cv.height / H, 0, 0);
  muteBtn.style.fontSize = Math.max(11, 10 * S) + "px"; muteBtn.style.bottom = Math.round(6 * S) + "px";
}
addEventListener('resize', resize);
resize();

/* ---------- Speicher ---------- */
let hi = 0, muted = false;
try { hi = +localStorage.getItem('sternsplitter.hi') || 0; muted = localStorage.getItem('sternsplitter.mute') === '1'; } catch(e){}
function saveHi(){ try { localStorage.setItem('sternsplitter.hi', String(hi)); } catch(e){} }

/* ---------- Ton ---------- */
let ac = null, master = null, nbuf = null;
function audioInit(){
  if (!ac){
    const A = window.AudioContext || window.webkitAudioContext;
    if (!A) return;
    try { ac = new A(); master = ac.createGain(); master.gain.value = muted ? 0 : .55; master.connect(ac.destination); }
    catch(e){ ac = null; return; }
  }
  if (ac.state === 'suspended') ac.resume().catch(()=>{});
}
function tone(f, d, type, vol, f2, at){
  if (!ac || muted) return;
  const t = ac.currentTime + (at || 0);
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = type || 'square';
  o.frequency.setValueAtTime(f, t);
  if (f2) o.frequency.exponentialRampToValueAtTime(Math.max(20, f2), t + d);
  g.gain.setValueAtTime(vol || .1, t);
  g.gain.exponentialRampToValueAtTime(.0001, t + d);
  o.connect(g); g.connect(master); o.start(t); o.stop(t + d + .02);
}
function noise(d, vol, fc){
  if (!ac || muted) return;
  if (!nbuf){
    nbuf = ac.createBuffer(1, ac.sampleRate, ac.sampleRate);
    const a = nbuf.getChannelData(0);
    for (let i = 0; i < a.length; i++) a[i] = Math.random() * 2 - 1;
  }
  const t = ac.currentTime, s = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
  s.buffer = nbuf; f.type = 'lowpass';
  f.frequency.setValueAtTime(fc || 2000, t); f.frequency.exponentialRampToValueAtTime(60, t + d);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0001, t + d);
  s.connect(f); f.connect(g); g.connect(master); s.start(t); s.stop(t + d);
}
const SFX = {
  shoot: l => tone(1500 - l * 60, .05, 'square', .018, 500),
  hit:   () => tone(260, .04, 'square', .035, 140),
  boom:  () => noise(.32, .22, 2200),
  bigBoom: () => { noise(.9, .4, 1400); tone(140, .7, 'sawtooth', .1, 35); },
  credit: () => tone(1180, .08, 'triangle', .07, 1900),
  level: () => [523, 659, 784, 1046].forEach((f, i) => tone(f, .12, 'square', .05, 0, i * .07)),
  eshot: () => tone(520, .09, 'sawtooth', .02, 260),
  hurt:  () => { noise(.6, .35, 900); tone(400, .5, 'square', .07, 60); },
  life:  () => [784, 988, 1175, 1568].forEach((f, i) => tone(f, .1, 'triangle', .08, 0, i * .08)),
  over:  () => [392, 330, 262, 196].forEach((f, i) => tone(f, .25, 'square', .06, 0, i * .22)),
  sector:() => [330, 440].forEach((f, i) => tone(f, .15, 'triangle', .06, 0, i * .12)),
};
function setMuted(m){
  muted = m;
  if (master) master.gain.value = m ? 0 : .55;
  muteBtn.textContent = m ? 'TON AUS' : 'TON AN';
  try { localStorage.setItem('sternsplitter.mute', m ? '1' : '0'); } catch(e){}
}
setMuted(muted);
muteBtn.addEventListener('click', e => { e.stopPropagation(); audioInit(); setMuted(!muted); cv.focus(); });
muteBtn.addEventListener('pointerdown', e => e.stopPropagation());

/* ---------- Waffenstufen ---------- */
const NEED  = [0, 10, 22, 40];               // Credits bis zur nächsten Stufe
const MAXLVL = 4;                             // Obergrenze: höchstens 5 Schüsse pro Salve (FÄCHER)
const RATE  = [0, .22, .2, .19, .17, .13];   // Sekunden zwischen Salven
const LNAME = ['', 'EINZEL', 'DOPPEL', 'DREIER', 'FÄCHER', 'STERN'];
const PAT = [null,
  [[0, 0]],
  [[-7, 0], [7, 0]],
  [[-8, -.12], [0, 0], [8, .12]],
  [[-10, -.26], [-6, -.12], [0, 0], [6, .12], [10, .26]],
  [[-12, -.39], [-9, -.26], [-5, -.13], [0, 0], [5, .13], [9, .26], [12, .39]],
];

/* ---------- Zustand ---------- */
let state = 'title';           // title | play | pause | over
let sinceTriple = 0, tripleCool = 0;        // tripleCool: Sperrzeit bis zur nächsten Kapsel
const TRIPLE_TIME = 15;                       // Sekunden, die eine Kapsel die Salve um eine Stufe hebt
const LIMIT = 180;                            // Belohnungsspiel: höchstens 3 Minuten
// Tempo der Gegner: Sektor 1 und 2 langsamer, danach volle Geschwindigkeit
// ab Sektor 3 je Sektor 8 % schneller, höchstens 2,2-fach
const pace = () => sector === 1 ? .6 : sector === 2 ? .78 : Math.min(2.2, 1 + (sector - 3) * .08);
let P, enemies, pb, eb, items, parts, floats, banner, time, sector, spawnT, shake, nextLife, overT, newRecord, kills, timeUp = false;
const stars = [];
for (let i = 0; i < 90; i++) stars.push({x: Math.random() * W, y: Math.random() * H, z: 1 + (i % 3)});

function reset(){
  P = {x: W / 2, y: BOTTOM - 70, inv: 2, cd: 0, lives: 3, lvl: 1, meter: 0, credits: 0, score: 0, tilt: 0, triple: 0};
  enemies = []; pb = []; eb = []; items = []; parts = []; floats = [];
  time = 0; sector = 1; spawnT = 1.2; shake = 0; nextLife = 25000; kills = 0; newRecord = false; timeUp = false; sinceTriple = 0; tripleCool = 20;
  banner = {text: 'SEKTOR 1', sub: REWARD ? '3 MINUTEN, LOS!' : 'CREDITS SAMMELN!', t: 2.2};
}
reset();

function start(){ audioInit(); reset(); state = 'play'; SFX.sector(); }

/* ---------- Eingabe ---------- */
const keys = {};
const GAMEKEYS = ['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight','KeyW','KeyA','KeyS','KeyD','Enter'];
addEventListener('keydown', e => {
  if (GAMEKEYS.includes(e.code)) e.preventDefault();
  audioInit();
  keys[e.code] = true;
  if (e.repeat) return;
  if (e.code === 'Space' || e.code === 'Enter'){
    if (state === 'title') start();
    else if (state === 'over' && overT > 1 && !REWARD) start();
    else if (state === 'pause') state = 'play';
  }
  if (e.code === 'KeyP' || e.code === 'Escape'){
    if (state === 'play') state = 'pause'; else if (state === 'pause') state = 'play';
  }
  if (e.code === 'KeyM') setMuted(!muted);
});
addEventListener('keyup', e => { keys[e.code] = false; });
addEventListener('blur', () => { for (const k in keys) keys[k] = false; if (state === 'play') state = 'pause'; });
document.addEventListener('visibilitychange', () => { if (document.hidden && state === 'play') state = 'pause'; });

let touch = null;
// Das ganze Fenster ist Touchfläche, auch die dunklen Ränder neben dem Spielfeld (Tablet quer)
const pad = document.getElementById("wrap");
function toLocal(e){ const r = cv.getBoundingClientRect(); return {x: (e.clientX - r.left) / r.width * W, y: (e.clientY - r.top) / r.height * H}; }
pad.addEventListener('pointerdown', e => {
  e.preventDefault(); audioInit(); cv.focus();
  if (state === 'title'){ start(); }
  else if (state === 'over'){ if (overT > 1 && !REWARD) start(); return; }
  else if (state === 'pause'){ state = 'play'; }
  const p = toLocal(e);
  touch = {id: e.pointerId, sx: p.x, sy: p.y, px: P.x, py: P.y};
  try { pad.setPointerCapture(e.pointerId); } catch(_){}
});
pad.addEventListener('pointermove', e => {
  if (!touch || e.pointerId !== touch.id || state !== 'play') return;
  const p = toLocal(e);
  P.x = clamp(touch.px + (p.x - touch.sx) * 1.25, 12, W - 12);
  P.y = clamp(touch.py + (p.y - touch.sy) * 1.25, TOP + 60, BOTTOM - 18);
});
const endTouch = e => { if (touch && e.pointerId === touch.id) touch = null; };
pad.addEventListener('pointerup', endTouch);
pad.addEventListener('pointercancel', endTouch);

/* ---------- Hilfen ---------- */
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const rnd = (a, b) => a + Math.random() * (b - a);
const pick = a => a[(Math.random() * a.length) | 0];

function burst(x, y, color, n, spd, life){
  for (let i = 0; i < n; i++){
    const a = Math.random() * Math.PI * 2, v = rnd(spd * .3, spd);
    parts.push({x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: rnd(life * .5, life), max: life, color});
  }
}
function float(x, y, text, color, size){ floats.push({x, y, text, color, size: size || 8, life: 1}); }
function addScore(n){
  P.score += n;
  if (P.score >= nextLife){ nextLife += 25000; if (P.lives < 4){ P.lives++; SFX.life(); float(P.x, P.y - 30, '+1 LEBEN', COL.hull, 10); } }
}

/* ---------- Feinde ---------- */
function rockShape(r){ const n = 9, pts = []; for (let i = 0; i < n; i++){ const a = i / n * Math.PI * 2, rr = r * rnd(.72, 1.08); pts.push([Math.cos(a) * rr, Math.sin(a) * rr]); } return pts; }
function eSpeed(){ return Math.min(300, 140 + sector * 9); }

function spawn(type, x, y, o){
  const e = Object.assign({type, x, y, t: 0, hit: 0, rot: 0, vx: 0, vy: 0, cool: rnd(.8, 1.6)}, o || {});
  switch (type){
    case 'brocken': e.r = rnd(12, 18); e.hp = 2 + (sector / 3 | 0); e.vy = rnd(55, 85) + sector * 4; e.vx = rnd(-20, 20); e.spin = rnd(-1.5, 1.5); e.shape = rockShape(e.r); e.pts = 50; e.drop = [.45, 1]; e.color = COL.violet; break;
    case 'pfeil':   e.r = 10; e.hp = 1; e.vy = 150 + sector * 6; e.amp = rnd(30, 60); e.freq = rnd(2, 3.2); e.x0 = x; e.pts = 80; e.drop = [.35, 1]; e.color = COL.hostile; break;
    case 'jaeger':  e.r = 11; e.hp = 2; e.vy = 110 + sector * 6; e.pts = 120; e.drop = [.6, 1]; e.color = COL.red; break;
    case 'waechter':e.r = 16; e.hp = 4 + sector; e.ty = rnd(90, 210); e.dir = Math.random() < .5 ? -1 : 1; e.pts = 200; e.drop = [1, 3]; e.color = COL.warn; e.cool = rnd(.6, 1.2); break;
    case 'faecher': e.r = 21; e.hp = 12 + sector * 2; e.ty = rnd(110, 170); e.pts = 450; e.drop = [1, 6]; e.color = COL.hostile; e.cool = 1.4; break;
  }
  e.maxhp = e.hp;
  enemies.push(e);
  return e;
}

function director(dt){
  spawnT -= dt;
  if (spawnT > 0) return;
  const big = enemies.filter(e => e.type === 'faecher').length;
  const table = [['brocken', 3], ['pfeilV', 1.1], ['waechter', .7 + sector * .25]];
  if (sector >= 2) table.push(['jaeger', 1 + sector * .1]);
  if (sector >= 3 && big < (sector >= 6 ? 2 : 1)) table.push(['faecher', .35 + sector * .08]);
  let sum = 0; table.forEach(t => sum += t[1]);
  let r = Math.random() * sum, kind = table[0][0];
  for (const t of table){ r -= t[1]; if (r <= 0){ kind = t[0]; break; } }
  const base = Math.max(.24, 1.25 - sector * .1) * (sector <= 2 ? 1.2 : 1);
  if (kind === 'pfeilV'){
    const cx = rnd(70, W - 70), n = sector >= 4 ? 7 : 5;
    for (let i = 0; i < n; i++){ const k = i - (n - 1) / 2; spawn('pfeil', cx + k * 22, -20 - Math.abs(k) * 22); }
    spawnT = base * 2.2;
  } else {
    spawn(kind, rnd(28, W - 28), -30);
    spawnT = base * (kind === 'faecher' ? 2.4 : kind === 'waechter' ? 1.5 : 1);
  }
}

function enemyShot(x, y, a, sp){ eb.push({x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, r: 4, t: 0}); }

function updateEnemy(e, dt){
  e.t += dt; e.hit -= dt;
  switch (e.type){
    case 'brocken':
      e.x += e.vx * dt; e.y += e.vy * dt; e.rot += e.spin * dt;
      if (e.x < e.r || e.x > W - e.r) e.vx *= -1;
      break;
    case 'pfeil':
      e.y += e.vy * dt; e.x = e.x0 + Math.sin(e.t * e.freq) * e.amp; e.rot = Math.cos(e.t * e.freq) * .5;
      break;
    case 'jaeger': {
      const dx = P.x - e.x;
      e.vx += clamp(dx, -1, 1) * 260 * dt; e.vx = clamp(e.vx, -150, 150);
      e.vy += 40 * dt;
      e.x += e.vx * dt; e.y += e.vy * dt; e.rot += 6 * dt;
      break; }
    case 'waechter':
      if (e.t < 14){
        e.y += (e.ty - e.y) * Math.min(1, 2 * dt) + 6 * dt;
        e.x += e.dir * 55 * dt;
        if (e.x < 24 || e.x > W - 24){ e.dir *= -1; e.x = clamp(e.x, 24, W - 24); }
      } else e.y += 120 * dt;
      e.cool -= dt;
      if (e.cool <= 0 && e.y > 20 && e.y < P.y - 60){
        const a = Math.atan2(P.y - e.y, P.x - e.x);
        enemyShot(e.x, e.y + 8, a, eSpeed());
        if (sector >= 5){ enemyShot(e.x, e.y + 8, a - .22, eSpeed()); enemyShot(e.x, e.y + 8, a + .22, eSpeed()); }
        e.cool = Math.max(.9, 2.1 - sector * .12) * rnd(.85, 1.15);
        SFX.eshot();
      }
      break;
    case 'faecher':
      e.rot += .8 * dt;
      if (e.t < 16){ e.y += (e.ty - e.y) * Math.min(1, 1.5 * dt); e.x += Math.sin(e.t * .7) * 30 * dt; }
      else e.y += 90 * dt;
      e.cool -= dt;
      if (e.cool <= 0 && e.y > 30){
        const n = sector >= 6 ? 12 : 9, off = e.rot;
        for (let i = 0; i < n; i++) enemyShot(e.x, e.y, off + i / n * Math.PI * 2, eSpeed() * .75);
        e.cool = Math.max(1.6, 2.8 - sector * .1);
        SFX.eshot();
      }
      break;
  }
}

function kill(e){
  kills++;
  addScore(e.pts);
  burst(e.x, e.y, e.color, e.r * 1.6 | 0, 170, .7);
  burst(e.x, e.y, COL.white, 6, 90, .35);
  if (e.r > 15){ SFX.bigBoom(); shake = Math.max(shake, .25); } else SFX.boom();
  if (Math.random() < e.drop[0]){
    for (let i = 0; i < e.drop[1]; i++) items.push({x: e.x + rnd(-8, 8), y: e.y + rnd(-8, 8), vx: rnd(-60, 60), vy: rnd(-90, -20), spin: Math.random() * 6, t: 0});
  }
  if (e.pts >= 200) float(e.x, e.y, String(e.pts), COL.ink, 8);
  // Seltene Kapsel für die Dreifach-Spur: nicht während einer laufenden Spur, danach 35 s Sperre,
  // spätestens nach 60 Abschüssen ohne Kapsel
  sinceTriple++;
  const big = e.type === 'waechter' || e.type === 'faecher';
  if (tripleCool <= 0 && P.triple <= 0 && !items.some(it => it.kind === 'triple') && (Math.random() < (big ? .1 : .02) || sinceTriple >= 60)){
    sinceTriple = 0; tripleCool = 35;
    items.push({kind: 'triple', x: e.x, y: e.y, vx: rnd(-30, 30), vy: -60, spin: 0, t: 0});
  }
}

// Spielende – durch das letzte Leben oder (nur im Belohnungsspiel) durch das Zeitlimit
function endGame(byTime){
  timeUp = byTime; state = 'over'; overT = 0; touch = null;
  if (P.score > hi){ hi = P.score; newRecord = true; saveHi(); }
  SFX.over();
  if (REWARD) try { parent.postMessage({sternsplitter: 'over', score: P.score}, '*'); } catch(_){}
}
function hurt(){
  if (P.inv > 0) return;
  P.lives--;
  burst(P.x, P.y, COL.hull, 40, 220, 1);
  burst(P.x, P.y, COL.white, 14, 120, .5);
  SFX.hurt();
  shake = .5;
  eb.length = 0;
  if (P.lvl > 1){ P.lvl--; float(P.x, P.y - 30, 'SALVE -1', COL.warn, 9); }
  P.meter = 0;
  P.inv = 2.4;
  if (P.lives <= 0){
    endGame(false);
  }
}

function collect(it){
  if (it.kind === 'triple'){
    if (P.lvl >= MAXLVL){ addScore(500); SFX.level(); burst(it.x, it.y, COL.hull, 16, 120, .5); float(it.x, it.y - 10, 'BONUS +500', COL.hull, 9); return; }
    P.triple = TRIPLE_TIME;
    SFX.level(); burst(it.x, it.y, COL.hull, 16, 120, .5);
    banner = {text: 'SALVE +1', sub: LNAME[Math.min(MAXLVL, P.lvl + 1)] + ' FÜR ' + TRIPLE_TIME + ' SEKUNDEN', t: 1.8};
    return;
  }
  P.credits++;
  addScore(10);
  SFX.credit();
  burst(it.x, it.y, COL.credit, 5, 70, .3);
  if (P.lvl < MAXLVL){
    P.meter++;
    if (P.meter >= NEED[P.lvl]){
      P.meter = 0; P.lvl++;
      SFX.level();
      banner = {text: 'SALVE ' + LNAME[P.lvl], sub: 'WAFFENSTUFE ' + P.lvl + ' / ' + MAXLVL, t: 1.6};
    }
  } else addScore(40);
}

// Die Kapsel hebt die Salve vorübergehend um eine Stufe – nie über MAXLVL, und sie vervielfacht nicht mehr.
const shotLvl = () => Math.min(MAXLVL, P.lvl + (P.triple > 0 ? 1 : 0));
function fire(){
  const sp = 560;
  const lv = shotLvl();
  for (const [ox, a] of PAT[lv]) pb.push({x: P.x + ox, y: P.y - 14, vx: Math.sin(a) * sp, vy: -Math.cos(a) * sp});
  SFX.shoot(lv);
}

/* ---------- Aktualisieren ---------- */
function update(dt){
  const starSpeed = state === 'play' ? 1 : .35;
  for (const s of stars){ s.y += s.z * s.z * 14 * starSpeed * dt * (state === 'pause' ? 0 : 1); if (s.y > H){ s.y = 0; s.x = Math.random() * W; } }

  if (state === 'pause') return;
  for (let i = parts.length - 1; i >= 0; i--){ const p = parts[i]; p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= .96; p.vy *= .96; p.life -= dt; if (p.life <= 0) parts.splice(i, 1); }
  for (let i = floats.length - 1; i >= 0; i--){ const f = floats[i]; f.y -= 28 * dt; f.life -= dt * .8; if (f.life <= 0) floats.splice(i, 1); }
  shake = Math.max(0, shake - dt);
  if (state === 'over'){ overT += dt; for (const b of eb){ b.x += b.vx * dt; b.y += b.vy * dt; } for (const e of enemies) updateEnemy(e, dt); return; }
  if (state !== 'play') return;

  time += dt;
  if (REWARD && time >= LIMIT){ endGame(true); return; }
  const ns = 1 + (time / 40 | 0);
  if (ns !== sector){ sector = ns; banner = {text: 'SEKTOR ' + sector, sub: 'MEHR GEGNER', t: 2}; SFX.sector(); addScore(500 * (sector - 1)); }
  if (banner) { banner.t -= dt; if (banner.t <= 0) banner = null; }

  // Spieler
  let mx = (keys.ArrowRight || keys.KeyD ? 1 : 0) - (keys.ArrowLeft || keys.KeyA ? 1 : 0);
  let my = (keys.ArrowDown || keys.KeyS ? 1 : 0) - (keys.ArrowUp || keys.KeyW ? 1 : 0);
  if (mx && my){ mx *= .7071; my *= .7071; }
  P.x = clamp(P.x + mx * 250 * dt, 12, W - 12);
  P.y = clamp(P.y + my * 250 * dt, TOP + 60, BOTTOM - 18);
  P.tilt += ((mx || (touch ? 0 : 0)) - P.tilt) * Math.min(1, 10 * dt);
  P.inv -= dt; P.cd -= dt;
  if (P.triple <= 0) tripleCool -= dt;
  if (P.triple > 0){ P.triple -= dt; if (P.triple <= 0){ P.triple = 0; float(P.x, P.y - 30, 'SALVE +1 VORBEI', COL.dim, 8); tone(600, .2, 'triangle', .05, 300); } }
  if ((keys.Space || touch) && P.cd <= 0){ fire(); P.cd = RATE[shotLvl()]; }

  director(dt);

  for (let i = pb.length - 1; i >= 0; i--){ const b = pb[i]; b.x += b.vx * dt; b.y += b.vy * dt; if (b.y < -10 || b.x < -10 || b.x > W + 10) pb.splice(i, 1); }
  const edt = dt * pace();
  for (let i = eb.length - 1; i >= 0; i--){ const b = eb[i]; b.t += edt; b.x += b.vx * edt; b.y += b.vy * edt; if (b.y > H + 10 || b.y < -20 || b.x < -10 || b.x > W + 10) eb.splice(i, 1); }
  for (const e of enemies) updateEnemy(e, edt);

  // Treffer Spieler -> Feinde
  for (let i = enemies.length - 1; i >= 0; i--){
    const e = enemies[i];
    for (let j = pb.length - 1; j >= 0; j--){
      const b = pb[j], dx = b.x - e.x, dy = b.y - e.y, rr = e.r + 3;
      if (dx * dx + dy * dy < rr * rr){
        pb.splice(j, 1); e.hp--; e.hit = .06; SFX.hit();
        parts.push({x: b.x, y: b.y, vx: rnd(-40, 40), vy: rnd(-80, -20), life: .2, max: .2, color: COL.white});
        if (e.hp <= 0){ kill(e); enemies.splice(i, 1); break; }
      }
    }
  }
  // Feinde raus / Kollision mit Spieler
  for (let i = enemies.length - 1; i >= 0; i--){
    const e = enemies[i];
    if (e.y > H + 40){ enemies.splice(i, 1); continue; }
    const dx = e.x - P.x, dy = e.y - P.y, rr = e.r + 8;
    if (P.inv <= 0 && dx * dx + dy * dy < rr * rr){
      if (e.type !== 'faecher'){ burst(e.x, e.y, e.color, 20, 160, .6); enemies.splice(i, 1); }
      hurt(); if (state !== 'play') return;
    }
  }
  // Feindschüsse -> Spieler (kleine Trefferzone)
  for (let i = eb.length - 1; i >= 0; i--){
    const b = eb[i], dx = b.x - P.x, dy = b.y - P.y;
    if (P.inv <= 0 && dx * dx + dy * dy < 49){ eb.splice(i, 1); hurt(); break; }
  }
  // Credits
  for (let i = items.length - 1; i >= 0; i--){
    const it = items[i]; it.t += dt;
    const dx = P.x - it.x, dy = P.y - it.y, d = Math.hypot(dx, dy) || 1;
    if (d < 80 && it.t > .3){ it.vx += dx / d * 900 * dt; it.vy += dy / d * 900 * dt; it.vx *= .9; it.vy *= .9; }
    else { it.vx *= .97; it.vy = Math.min(it.vy + 120 * dt, 70); }
    it.x += it.vx * dt; it.y += it.vy * dt; it.spin += dt * 5;
    if (d < 18){ items.splice(i, 1); collect(it); }
    else if (it.y > H + 20) items.splice(i, 1);
  }
}

/* ---------- Zeichnen ---------- */
function poly(pts, x, y, rot, color, fill, lw){
  ctx.save(); ctx.translate(x, y); if (rot) ctx.rotate(rot);
  ctx.beginPath();
  pts.forEach((p, i) => i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1]));
  ctx.closePath();
  if (fill){ ctx.fillStyle = fill; ctx.fill(); }
  ctx.strokeStyle = color; ctx.lineWidth = lw || 1.6; ctx.lineJoin = 'round';
  ctx.shadowColor = color; ctx.shadowBlur = 8; ctx.stroke();
  ctx.restore();
}
function text(s, x, y, size, color, align, glow){
  ctx.font = size + 'px ' + FONT; ctx.textAlign = align || 'center'; ctx.textBaseline = 'middle';
  ctx.fillStyle = color;
  if (glow){ ctx.shadowColor = color; ctx.shadowBlur = glow; }
  ctx.fillText(s, x, y);
  ctx.shadowBlur = 0;
}

const SHIP = [[0,-16],[4,-6],[6,-2],[13,8],[6,7],[3,11],[-3,11],[-6,7],[-13,8],[-6,-2],[-4,-6]];
const DART = [[0,12],[9,-9],[0,-3],[-9,-9]];
const SAUCER = [[-17,0],[-9,-7],[9,-7],[17,0],[9,7],[-9,7]];
const HUNTER = [[0,12],[5,3],[12,0],[5,-3],[0,-12],[-5,-3],[-12,0],[-5,3]];
const STAR = []; for (let i = 0; i < 16; i++){ const a = i / 16 * Math.PI * 2, r = i % 2 ? 12 : 22; STAR.push([Math.cos(a) * r, Math.sin(a) * r]); }

function drawShip(x, y, tilt, t){
  const sx = 1 - Math.abs(tilt) * .25;
  ctx.save(); ctx.translate(x, y); ctx.scale(sx, 1);
  // Triebwerk
  const fl = 8 + Math.sin(t * 40) * 3 + Math.random() * 3;
  ctx.globalCompositeOperation = 'lighter';
  ctx.beginPath(); ctx.moveTo(-3, 11); ctx.lineTo(0, 11 + fl); ctx.lineTo(3, 11); ctx.closePath();
  ctx.fillStyle = COL.credit; ctx.shadowColor = COL.warn; ctx.shadowBlur = 10; ctx.fill();
  ctx.globalCompositeOperation = 'source-over';
  ctx.restore();
  ctx.save(); ctx.translate(x, y); ctx.scale(sx, 1);
  poly(SHIP, 0, 0, 0, COL.hull, 'rgba(10,40,60,.85)', 1.8);
  ctx.beginPath(); ctx.moveTo(0, -9); ctx.lineTo(2.5, -2); ctx.lineTo(-2.5, -2); ctx.closePath();
  ctx.fillStyle = COL.white; ctx.fill();
  ctx.restore();
}

function drawEnemy(e){
  const c = e.hit > 0 ? COL.white : e.color;
  switch (e.type){
    case 'brocken': poly(e.shape, e.x, e.y, e.rot, c, 'rgba(30,20,60,.8)'); break;
    case 'pfeil':   poly(DART, e.x, e.y, e.rot, c, 'rgba(60,10,40,.8)'); break;
    case 'jaeger':  poly(HUNTER, e.x, e.y, e.rot, c, 'rgba(60,10,20,.8)');
                    poly([[0,4],[4,0],[0,-4],[-4,0]], e.x, e.y, -e.rot, c); break;
    case 'waechter': {
      poly(SAUCER, e.x, e.y, 0, c, 'rgba(60,25,10,.85)');
      poly([[-6,-7],[-4,-12],[4,-12],[6,-7]], e.x, e.y, 0, c);
      const a = Math.atan2(P.y - e.y, P.x - e.x);
      ctx.save(); ctx.strokeStyle = c; ctx.lineWidth = 2.5; ctx.shadowColor = c; ctx.shadowBlur = 6;
      ctx.beginPath(); ctx.moveTo(e.x, e.y); ctx.lineTo(e.x + Math.cos(a) * 13, e.y + Math.sin(a) * 13); ctx.stroke(); ctx.restore();
      break; }
    case 'faecher': {
      poly(STAR, e.x, e.y, e.rot, c, 'rgba(50,10,45,.85)');
      ctx.save(); ctx.strokeStyle = e.hit > 0 ? COL.white : COL.violet; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.arc(e.x, e.y, 7 + Math.sin(e.t * 6), 0, Math.PI * 2); ctx.stroke();
      // Lebensbalken
      const w = 34, f = e.hp / e.maxhp;
      ctx.fillStyle = 'rgba(255,255,255,.15)'; ctx.fillRect(e.x - w / 2, e.y - 32, w, 3);
      ctx.fillStyle = COL.hostile; ctx.fillRect(e.x - w / 2, e.y - 32, w * f, 3);
      ctx.restore();
      break; }
  }
}

function drawCredit(x, y, spin, r){
  const sx = Math.abs(Math.cos(spin));
  ctx.save(); ctx.translate(x, y); ctx.scale(Math.max(.2, sx), 1);
  const hex = []; for (let i = 0; i < 6; i++){ const a = i / 6 * Math.PI * 2 + Math.PI / 6; hex.push([Math.cos(a) * r, Math.sin(a) * r]); }
  poly(hex, 0, 0, 0, COL.credit, 'rgba(70,45,0,.85)', 1.5);
  if (sx > .45) text('C', 0, 1, r > 7 ? 8 : 6, COL.credit);
  ctx.restore();
}

function drawCapsule(x, y, t){
  const pulse = 1 + Math.sin(t * 8) * .08;
  ctx.save(); ctx.translate(x, y); ctx.scale(pulse, pulse);
  poly([[-13,-7],[13,-7],[16,0],[13,7],[-13,7],[-16,0]], 0, 0, 0, COL.hull, 'rgba(5,45,60,.9)', 1.8);
  ctx.restore();
  text('3X', x, y + 1, 8, COL.white);
}

function drawHUD(){
  ctx.fillStyle = 'rgba(7,6,26,.82)';
  ctx.fillRect(0, 0, W, TOP); ctx.fillRect(0, BOTTOM, W, H - BOTTOM);
  ctx.fillStyle = '#2a2560'; ctx.fillRect(0, TOP, W, 1); ctx.fillRect(0, BOTTOM, W, 1);
  text('PUNKTE', 8, 11, 6, COL.dim, 'left');
  text(String(P.score).padStart(7, '0'), 8, 24, 8, COL.ink, 'left');
  text('REKORD', W / 2, 11, 6, COL.dim);
  text(String(Math.max(hi, P.score)).padStart(7, '0'), W / 2, 24, 8, COL.credit);
  text('S' + sector, W - 8, 11, 6, COL.dim, 'right');
  if (REWARD){ const left = Math.max(0, Math.ceil(LIMIT - time)), warn = left <= 15 && ((time * 2) | 0) % 2 === 0;
    text((left / 60 | 0) + ':' + String(left % 60).padStart(2, '0'), 8, TOP + 16, 9, warn ? COL.white : COL.credit, 'left'); }
  if (P.triple > 0){
    const blink = P.triple < 4 && ((P.triple * 6) | 0) % 2 === 0;
    const bw = 120, bx = (W - bw) / 2, by = TOP + 8;
    ctx.fillStyle = 'rgba(7,6,26,.7)'; ctx.fillRect(bx - 4, by - 5, bw + 8, 22);
    text('SALVE +1  ' + Math.ceil(P.triple) + 'S', W / 2, by + 2, 7, blink ? COL.white : COL.hull);
    ctx.fillStyle = '#123b48'; ctx.fillRect(bx, by + 10, bw, 3);
    ctx.fillStyle = COL.hull; ctx.fillRect(bx, by + 10, bw * P.triple / TRIPLE_TIME, 3);
  }
  for (let i = 0; i < P.lives; i++){
    ctx.save(); ctx.translate(W - 14 - i * 16, 24); ctx.scale(.5, .5);
    poly(SHIP, 0, 0, 0, COL.hull, 'rgba(10,40,60,.85)', 2.5); ctx.restore();
  }
  // Waffe und Credits
  const y0 = BOTTOM + 13;
  text('SALVE', 8, y0, 6, COL.dim, 'left');
  text(LNAME[shotLvl()], 8, y0 + 13, 8, COL.hull, 'left');
  for (let i = 1; i <= MAXLVL; i++){
    const x = 104 + (i - 1) * 13, on = i <= P.lvl;
    ctx.fillStyle = on ? COL.hull : '#221d52';
    if (on){ ctx.shadowColor = COL.hull; ctx.shadowBlur = 6; }
    ctx.fillRect(x, y0 + 6, 9, 9); ctx.shadowBlur = 0;
  }
  drawCredit(186, y0 + 10, 0, 6);
  text(String(P.credits), 196, y0 + 11, 8, COL.credit, 'left');
  // Fortschritt bis zur nächsten Stufe (Platz rechts lässt der Ton-Knopf frei)
  const bx = 104, by = y0 - 4, bw = 132;
  ctx.fillStyle = '#221d52'; ctx.fillRect(bx, by, bw, 4);
  if (P.lvl < MAXLVL){ ctx.fillStyle = COL.credit; ctx.fillRect(bx, by, bw * P.meter / NEED[P.lvl], 4); }
  else { ctx.fillStyle = COL.hull; ctx.fillRect(bx, by, bw, 4); }
}

function draw(now){
  const t = now / 1000;
  ctx.save();
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
  if (shake > 0 && !REDUCED) ctx.translate(rnd(-1, 1) * shake * 10, rnd(-1, 1) * shake * 10);

  for (const s of stars){
    ctx.fillStyle = s.z === 3 ? '#ffffff' : s.z === 2 ? '#8f88d8' : '#3f3a7a';
    ctx.fillRect(s.x | 0, s.y | 0, s.z === 3 ? 2 : 1, s.z === 3 ? 2 + (state === 'play' ? 2 : 0) : 1);
  }

  if (state === 'title'){ drawTitle(t); ctx.restore(); return; }

  for (const it of items) it.kind === 'triple' ? drawCapsule(it.x, it.y, it.t) : drawCredit(it.x, it.y, it.spin, 7);
  for (const e of enemies) drawEnemy(e);

  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  ctx.strokeStyle = COL.credit; ctx.lineWidth = 2; ctx.shadowColor = COL.credit; ctx.shadowBlur = 6;
  ctx.beginPath();
  for (const b of pb){ const k = 0.018; ctx.moveTo(b.x, b.y); ctx.lineTo(b.x - b.vx * k, b.y - b.vy * k); }
  ctx.stroke();
  ctx.shadowBlur = 0;
  for (const p of parts){
    const a = Math.max(0, p.life / p.max);
    ctx.globalAlpha = a; ctx.strokeStyle = p.color; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p.x - p.vx * .04, p.y - p.vy * .04); ctx.stroke();
  }
  ctx.globalAlpha = 1;
  for (const b of eb){
    ctx.fillStyle = COL.hostile; ctx.shadowColor = COL.hostile; ctx.shadowBlur = 10;
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r + 1, 0, Math.PI * 2); ctx.fill();
    ctx.shadowBlur = 0; ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(b.x, b.y, 1.8, 0, Math.PI * 2); ctx.fill();
  }
  ctx.restore();

  if (state !== 'over' && (P.inv <= 0 || ((t * 12) | 0) % 2 === 0)) drawShip(P.x, P.y, P.tilt, t);

  for (const f of floats){ ctx.globalAlpha = Math.max(0, Math.min(1, f.life * 1.5)); text(f.text, f.x, f.y, f.size, f.color, 'center'); }
  ctx.globalAlpha = 1;

  if (banner && state === 'play'){
    const a = Math.min(1, banner.t * 2);
    ctx.globalAlpha = a;
    text(banner.text, W / 2, 230, 14, COL.hull, 'center', 12);
    text(banner.sub, W / 2, 256, 7, COL.ink, 'center');
    ctx.globalAlpha = 1;
  }

  ctx.restore();
  drawHUD();

  if (state === 'pause'){
    ctx.fillStyle = 'rgba(0,0,0,.6)'; ctx.fillRect(0, TOP + 1, W, BOTTOM - TOP - 1);
    text('PAUSE', W / 2, 280, 18, COL.hull, 'center', 14);
    text('P ODER TIPPEN: WEITER', W / 2, 320, 7, COL.ink);
  }
  if (state === 'over'){
    ctx.fillStyle = 'rgba(0,0,0,.55)'; ctx.fillRect(0, TOP + 1, W, BOTTOM - TOP - 1);
    text(timeUp ? 'ZEIT' : 'SPIEL', W / 2, 200, 24, timeUp ? COL.credit : COL.hostile, 'center', 16);
    text(timeUp ? 'UM' : 'VORBEI', W / 2, 236, 24, timeUp ? COL.credit : COL.hostile, 'center', 16);
    text('PUNKTE  ' + P.score, W / 2, 292, 9, COL.ink);
    text('SEKTOR ' + sector + '   ABSCHÜSSE ' + kills, W / 2, 316, 7, COL.dim);
    text('CREDITS ' + P.credits, W / 2, 336, 7, COL.credit);
    if (newRecord) text('NEUER REKORD!', W / 2, 372, 10, COL.credit, 'center', 10);
    if (REWARD){ text('GUT GESPIELT!', W / 2, 430, 9, COL.hull); text('WEITER LERNEN FÜR DAS NÄCHSTE SPIEL', W / 2, 452, 6, COL.ink); }
    else {
      if (overT > 1 && ((t * 2) | 0) % 2 === 0) text('LEERTASTE / TIPPEN', W / 2, 430, 8, COL.hull);
      if (overT > 1) text('FÜR NEUSTART', W / 2, 448, 8, COL.hull);
    }
  }
}

function drawTitle(t){
  text('STERN', W / 2, 92, 30, COL.hull, 'center', 18);
  text('SPLITTER', W / 2, 132, 30, COL.hostile, 'center', 18);
  text(REWARD ? 'DEINE BELOHNUNG' : 'EIN VEKTOR-SHOOTER', W / 2, 166, 7, REWARD ? COL.credit : COL.dim);

  drawShip(W / 2, 220 + Math.sin(t * 2) * 5, Math.sin(t * 1.3) * .6, t);

  // Waffenstufen zeigen, was Credits bewirken
  drawCredit(56, 278, t * 3, 7);
  text('CREDITS SAMMELN', 72, 272, 7, COL.credit, 'left');
  text('= BREITERE SALVE', 72, 286, 7, COL.ink, 'left');
  const lv = 1 + ((t / 1.1) | 0) % MAXLVL;
  ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.strokeStyle = COL.credit; ctx.lineWidth = 2; ctx.shadowColor = COL.credit; ctx.shadowBlur = 6;
  ctx.beginPath();
  for (const [ox, a] of PAT[lv]){ const x = 290 + ox, y = 300; ctx.moveTo(x, y); ctx.lineTo(x + Math.sin(a) * 34, y - Math.cos(a) * 34); }
  ctx.stroke(); ctx.restore();
  text(LNAME[lv], 290, 310, 6, COL.hull);

  // Gegner
  const y = 352;
  poly(rockShape.cache || (rockShape.cache = rockShape(11)), 50, y, t * .6, COL.violet, 'rgba(30,20,60,.8)');
  poly(DART, 110, y, 0, COL.hostile, 'rgba(60,10,40,.8)');
  poly(HUNTER, 170, y, t * 3, COL.red, 'rgba(60,10,20,.8)');
  poly(SAUCER, 235, y, 0, COL.warn, 'rgba(60,25,10,.85)');
  poly(STAR, 305, y, t * .8, COL.hostile, 'rgba(50,10,45,.85)');
  text('AUSWEICHEN! MANCHE SCHIESSEN ZURÜCK', W / 2, y + 36, 6, COL.ink);
  text('BERÜHRUNG KOSTET EIN LEBEN', W / 2, y + 50, 6, COL.dim);
  drawCapsule(70, y + 74, t);
  text('KAPSEL = ' + TRIPLE_TIME + ' S SALVE +1', 94, y + 75, 6, COL.hull, 'left');

  const cy = 458;
  const rows = [['FLIEGEN', 'PFEILE / WASD'], ['FEUER', 'LEERTASTE'], ['HANDY', 'ZIEHEN + AUTOFEUER'], ['PAUSE / TON', 'P / M']];
  rows.forEach((r, i) => { text(r[0], 40, cy + i * 18, 7, COL.dim, 'left'); text(r[1], 320, cy + i * 18, 7, COL.ink, 'right'); });

  text('REKORD ' + String(hi).padStart(7, '0'), W / 2, 540, 8, COL.credit);
  if (((t * 2) | 0) % 2 === 0) text('LEERTASTE ODER TIPPEN', W / 2, 580, 8, COL.hull, 'center', 8);
}

let last = performance.now();
function frame(now){
  requestAnimationFrame(frame);              // zuerst neu planen: ein Fehler darf die Schleife nie anhalten
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  try { update(dt); draw(now); }
  catch (err){ console.error(err); ctx.setTransform(cv.width / W, 0, 0, cv.height / H, 0, 0); }
}
requestAnimationFrame(frame);
cv.focus();
})();
<\/script>

</script>

<div class="wrap">

  <div class="hud">

  <div class="stage" id="stage">
    <canvas id="cv" aria-label="Spielfeld: Heckenlabyrinth im Nachtgarten"></canvas>
    <div class="overlay" id="ov">
      <h2 id="ovTitle">Nachtgarten</h2>
      <p id="ovText">Friss alle Leuchtsporen im Heckenlabyrinth. Eine Laterne blendet die Eulen für ein paar Sekunden, dann kannst du sie zurück ins Nest scheuchen.</p>
      <button class="btn" id="startBtn">Spiel starten</button>
      <p class="small">Pfeiltasten oder WASD zum Laufen, Leertaste zum Rollen. Auf Handy und iPad: übers Spielfeld wischen oder das Steuerkreuz nutzen, Doppeltippen rollt.</p>
    </div>
  </div>

  <div class="pad" id="pad" aria-label="Steuerung">
    <button class="up" data-d="0" aria-label="Hoch">▲</button>
    <button class="lt" data-d="3" aria-label="Links">◀</button>
    <button class="dn" data-d="2" aria-label="Runter">▼</button>
    <button class="rt" data-d="1" aria-label="Rechts">▶</button>
    <button class="rl" id="rollBtn" aria-label="Rollen">ROLLEN</button>
  </div>

  <div class="tools">
    <button class="ghost" id="pauseBtn">Pause (P)</button>
    <button class="ghost" id="soundBtn">Ton: an</button>
  </div>

  <section class="guide">
    <h3>Bestimmungsbuch: die vier Eulen</h3>
    <div class="owl"><i style="background:var(--owl-1)"></i><b>Grimm, der Uhu</b><small>Nimmt immer den kürzesten Weg zu dir. Etwas langsamer als die anderen.</small></div>
    <div class="owl"><i style="background:var(--owl-2)"></i><b>Flink, der Kauz</b><small>Fliegt dorthin, wo du in vier Schritten sein wirst.</small></div>
    <div class="owl"><i style="background:var(--owl-3)"></i><b>Lumi, die Schleiereule</b><small>Bewacht die Spore, die dir gerade am nächsten liegt.</small></div>
    <div class="owl"><i style="background:var(--owl-4)"></i><b>Moos, die Waldohreule</b><small>Streift launisch umher und wird alle paar Sekunden plötzlich wütend.</small></div>
    <h3>Punkte</h3>
    <p class="keys">Spore 10 · Laterne 50 · geblendete Eule 200, 400, 800, 1600 · Waldfrucht ab 100 · Extraleben bei 10&nbsp;000.<br>
      Alle 22 Sekunden <em>lauschen</em> die Eulen kurz und fliegen ziellos. Mit <kbd>Leertaste</kbd> rollt Pieks sich ein und ist kurz fast doppelt so schnell (danach 5&nbsp;s Pause). <kbd>P</kbd> pausiert.</p>
  </section>
</div>

<script>
(() => {
  const root = getComputedStyle(document.documentElement);
  const v = n => root.getPropertyValue(n).trim();
  const C = {
    night: v('--night'), hedge: v('--hedge'), hedgeHi: v('--hedge-hi'), spore: v('--spore'), lantern: v('--lantern'),
    bark: v('--bark'), ink: v('--ink'), hog: v('--hog'), hogFace: v('--hog-face'), hogSpike: v('--hog-spike'),
    owls: [v('--owl-1'), v('--owl-2'), v('--owl-3'), v('--owl-4')], daze: v('--daze'),
    fDisplay: v('--f-display'), fMono: v('--f-mono')
  };
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  // Belohnungsmodus: eingebettet in Kopfsache – ein Spiel, höchstens 3 Minuten, kein Neustart
  const REWARD = !!window.NG_REWARD, LIMIT = 180;

  // ---------- Labyrinth (linke Hälfte, wird gespiegelt) ----------
  const LEFT = [
    '##########',
    '#........#',
    '#.##.###.#',
    '#o#.......',
    '#.#.##.###',
    '#....#....',
    '####.##.##',
    '####.#....',
    '####.#.##-',
    '.......#HH',
    '####.#.###',
    '####.#....',
    '####.#.###',
    '#........#',
    '#.##.###.#',
    '#o.#......',
    '##.#.#.###',
    '#....#...#',
    '#.######.#',
    '#.........',
    '##########'
  ];
  const GRID = LEFT.map(r => (r + [...r.slice(0, 9)].reverse().join('')).split(''));
  const W = GRID[0].length, H = GRID.length;
  const START = { x: 9, y: 15 }, OUT = { x: 9, y: 7 }, NEST = { x: 9, y: 9 }, FRUIT = { x: 9, y: 11 };
  const DX = [0, 1, 0, -1], DY = [-1, 0, 1, 0]; // hoch, rechts, runter, links
  const OPP = [2, 3, 0, 1];
  const wrap = x => (x + W) % W;
  const cell = (x, y) => (y < 0 || y >= H) ? '#' : GRID[y][wrap(x)];
  const open = (x, y, nestOK) => { const c = cell(x, y); if (c === '#') return false; if (c === '-' || c === 'H') return nestOK; return true; };
  const canGo = (x, y, d, nestOK) => open(x + DX[d], y + DY[d], nestOK);

  // Kürzeste Wege (Breitensuche), pro Frame zwischengespeichert
  let bfsMemo = new Map();
  function bfs(tx, ty, nestOK) {
    const key = tx + ',' + ty + ',' + (nestOK ? 1 : 0);
    if (bfsMemo.has(key)) return bfsMemo.get(key);
    const d = new Int16Array(W * H).fill(-1);
    const q = [tx, ty]; d[ty * W + tx] = 0;
    for (let h = 0; h < q.length; h += 2) {
      const x = q[h], y = q[h + 1], base = d[y * W + x];
      for (let k = 0; k < 4; k++) {
        const nx = wrap(x + DX[k]), ny = y + DY[k];
        if (!open(nx, ny, nestOK)) continue;
        const i = ny * W + nx;
        if (d[i] >= 0) continue;
        d[i] = base + 1; q.push(nx, ny);
      }
    }
    bfsMemo.set(key, d);
    return d;
  }

  // ---------- Zustand ----------
  let dots, dotsLeft, eaten;
  function resetDots() {
    dots = new Uint8Array(W * H); dotsLeft = 0;
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
      const c = GRID[y][x];
      if (c === '.') dots[y * W + x] = 1; else if (c === 'o') dots[y * W + x] = 2;
    }
    dots[START.y * W + START.x] = 0;
    for (const n of dots) if (n) dotsLeft++;
    eaten = 0;
  }

  const G = { state: 'title', score: 0, hi: 0, level: 1, lives: 3, stateT: 0, dazzleT: 0, chain: 0,
    clock: 0, nextRest: 22, restT: 0, fruit: null, extraGiven: false, popups: [], freezeT: 0, time: 0, playT: 0 };
  try { G.hi = +localStorage.getItem('nachtgarten-hi') || 0; } catch (e) {}

  const P = { x: 0, y: 0, dir: 3, face: 3, t: 0, moving: false, rollT: 0, rollCd: 0, anim: 0 };
  let want = -1;

  const OWLS = [
    { name: 'Grimm', kind: 'chase', home: OUT, release: 0 },
    { name: 'Flink', kind: 'ahead', home: { x: 8, y: 9 }, release: 2.5 },
    { name: 'Lumi', kind: 'guard', home: { x: 9, y: 9 }, release: 6 },
    { name: 'Moos', kind: 'moody', home: { x: 10, y: 9 }, release: 10 }
  ].map((o, i) => Object.assign(o, { idx: i, x: 0, y: 0, dir: 0, t: 0, mode: 'nest', nestT: 0, dazzled: false, reverse: false, moodT: 0, caught: false }));

  const FRUITS = [
    { n: 'Brombeere', c: '#6a2f86', p: 100 }, { n: 'Holzapfel', c: '#c8443a', p: 300 },
    { n: 'Birne', c: '#c9c24a', p: 500 }, { n: 'Pflaume', c: '#6b4fa8', p: 700 },
    { n: 'Haselnuss', c: '#a87440', p: 1000 }, { n: 'Walderdbeere', c: '#e04a5a', p: 2000 }
  ];

  function resetActors() {
    P.x = START.x; P.y = START.y; P.dir = 3; P.face = 3; P.t = 0; P.moving = false; P.rollT = 0; P.rollCd = 0;
    want = -1;
    const f = Math.max(0.35, 1 - 0.12 * (G.level - 1));
    for (const o of OWLS) {
      o.x = o.home.x; o.y = o.home.y; o.t = 0; o.dazzled = false; o.reverse = false; o.moodT = 0; o.caught = false;
      if (o.idx === 0) { o.mode = 'hunt'; o.dir = 3; } else { o.mode = 'nest'; o.dir = 0; o.nestT = o.release * f; }
    }
    G.dazzleT = 0; G.restT = 0; G.freezeT = 0;
    G.nextRest = G.clock + 22;
  }

  function newGame() {
    G.score = 0; G.level = 1; G.lives = 3; G.playT = 0; G.extraGiven = false; G.fruit = null; G.clock = 0; G.popups = [];
    resetDots(); resetActors();
    G.state = 'ready'; G.stateT = 1.8;
    ov.hidden = true;
    sfx.start();
  }

  // ---------- Bewegung ----------
  const pSpeed = () => (5.2 + Math.min(G.level - 1, 6) * 0.25) * (P.rollT > 0 ? 1.7 : 1);
  function oSpeed(o) {
    if (o.mode === 'feather') return 11;
    if (o.mode === 'leave') return 3.5;
    let s = 4.7 + Math.min(G.level - 1, 6) * 0.3;
    if (o.kind === 'chase') s *= 0.93;
    if (o.dazzled) s = 2.9;
    if (o.y === 9 && (o.x < 5 || o.x > 13)) s *= 0.6; // Tunnel durch die Hecke bremst
    return s;
  }

  function stepPlayer(dt) {
    let move = pSpeed() * dt;
    if (P.t > 0 && want >= 0 && want === OPP[P.dir]) {
      P.x = wrap(P.x + DX[P.dir]); P.y += DY[P.dir]; P.t = 1 - P.t; P.dir = want;
    }
    let guard = 0;
    while (move > 1e-6 && guard++ < 10) {
      if (P.t === 0) {
        if (want >= 0 && canGo(P.x, P.y, want, false)) P.dir = want;
        if (!canGo(P.x, P.y, P.dir, false)) { P.moving = false; return; }
      }
      P.moving = true; P.face = P.dir;
      const step = Math.min(move, 1 - P.t);
      P.t += step; move -= step; P.anim += step;
      if (P.t >= 1 - 1e-6) {
        P.x = wrap(P.x + DX[P.dir]); P.y += DY[P.dir]; P.t = 0;
        eat(P.x, P.y);
        if (G.state !== 'play') return;
      }
    }
  }

  const nestOK = o => o.mode === 'leave' || o.mode === 'feather';

  function target(o) {
    if (o.mode === 'leave') return OUT;
    if (o.mode === 'feather') return NEST;
    if (o.kind === 'ahead') {
      let x = P.x, y = P.y;
      for (let i = 0; i < 4 && open(x + DX[P.face], y + DY[P.face], false); i++) { x = wrap(x + DX[P.face]); y += DY[P.face]; }
      return { x, y };
    }
    if (o.kind === 'guard') {
      const dm = bfs(P.x, P.y, false);
      let best = null, bd = 1e9;
      for (let i = 0; i < dots.length; i++) if (dots[i] && dm[i] >= 0 && dm[i] < bd) { bd = dm[i]; best = i; }
      if (best !== null) return { x: best % W, y: (best / W) | 0 };
    }
    return { x: P.x, y: P.y };
  }

  const angry = o => (o.moodT % 9) > 5.5;

  function decide(o) {
    const nk = nestOK(o);
    const opts = [];
    for (let d = 0; d < 4; d++) if (d !== OPP[o.dir] && canGo(o.x, o.y, d, nk)) opts.push(d);
    if (!opts.length) { if (canGo(o.x, o.y, OPP[o.dir], nk)) o.dir = OPP[o.dir]; return; }
    if (opts.length === 1) { o.dir = opts[0]; return; }
    const nb = d => (o.y + DY[d]) * W + wrap(o.x + DX[d]);
    if (o.mode === 'hunt' && o.dazzled) {
      const dm = bfs(P.x, P.y, false);
      let best = -1, bd = -1;
      for (const d of opts) { const s = dm[nb(d)] + Math.random() * 0.5; if (s > bd) { bd = s; best = d; } }
      o.dir = best; return;
    }
    if (o.mode === 'hunt' && (G.restT > 0 || (o.kind === 'moody' && !angry(o)))) {
      o.dir = opts[(Math.random() * opts.length) | 0]; return;
    }
    const T = target(o);
    const dm = bfs(T.x, T.y, nk);
    let best = opts[0], bd = 1e9;
    for (const d of opts) { const s = dm[nb(d)] < 0 ? 9999 : dm[nb(d)]; if (s < bd) { bd = s; best = d; } }
    o.dir = best;
  }

  function stepOwl(o, dt) {
    if (o.mode === 'nest') { o.nestT -= dt; if (o.nestT <= 0) o.mode = 'leave'; return; }
    if (o.reverse) {
      o.reverse = false;
      if (o.t > 0) { o.x = wrap(o.x + DX[o.dir]); o.y += DY[o.dir]; o.t = 1 - o.t; }
      o.dir = OPP[o.dir];
    }
    let move = oSpeed(o) * dt, guard = 0;
    while (move > 1e-6 && guard++ < 14) {
      if (o.t === 0) {
        if (o.mode === 'leave' && o.x === OUT.x && o.y === OUT.y) o.mode = 'hunt';
        if (o.mode === 'feather' && o.x === NEST.x && o.y === NEST.y) { o.mode = 'nest'; o.nestT = 1.2; o.dir = 0; return; }
        decide(o);
        if (!canGo(o.x, o.y, o.dir, nestOK(o))) return;
      }
      const step = Math.min(move, 1 - o.t);
      o.t += step; move -= step;
      if (o.t >= 1 - 1e-6) { o.x = wrap(o.x + DX[o.dir]); o.y += DY[o.dir]; o.t = 0; }
    }
  }

  // ---------- Regeln ----------
  function add(n) {
    G.score += n;
    if (!G.extraGiven && G.score >= 10000) { G.extraGiven = true; G.lives++; sfx.life(); }
    if (G.score > G.hi) { G.hi = G.score; try { localStorage.setItem('nachtgarten-hi', String(G.hi)); } catch (e) {} }
  }
  function popup(x, y, text) { G.popups.push({ x, y, text, t: 0 }); }

  function eat(x, y) {
    const i = y * W + x, val = dots[i];
    if (val) {
      dots[i] = 0; dotsLeft--; eaten++;
      if (val === 1) { add(10); sfx.eat(); }
      else {
        add(50); sfx.lantern();
        G.dazzleT = Math.max(2, 7 - (G.level - 1) * 0.7); G.chain = 0;
        for (const o of OWLS) if (o.mode === 'hunt') { o.dazzled = true; o.reverse = true; }
      }
      if (eaten === 50 || eaten === 120) {
        const f = FRUITS[Math.min(G.level - 1, FRUITS.length - 1)];
        G.fruit = Object.assign({ t: 9 }, f);
      }
      if (dotsLeft === 0) { G.state = 'clear'; G.stateT = 2.4; sfx.clear(); return; }
    }
    if (G.fruit && x === FRUIT.x && y === FRUIT.y) {
      add(G.fruit.p); popup(x, y, String(G.fruit.p)); G.fruit = null; sfx.fruit();
    }
  }

  function renderPos(e) { return { x: e.x + DX[e.dir] * e.t, y: e.y + DY[e.dir] * e.t }; }

  function collide() {
    const pr = renderPos(P);
    for (const o of OWLS) {
      if (o.mode === 'nest' || o.mode === 'feather') continue;
      const r = renderPos(o);
      let dx = Math.abs(r.x - pr.x); dx = Math.min(dx, W - dx);
      if (dx < 0.55 && Math.abs(r.y - pr.y) < 0.55) {
        if (o.dazzled) {
          o.dazzled = false; o.mode = 'feather'; o.caught = true;
          G.chain++;
          const pts = 200 * 2 ** Math.min(G.chain - 1, 3);
          add(pts); popup(r.x, r.y, String(pts)); sfx.catch();
          G.freezeT = 0.45;
          return;
        }
        G.state = 'dying'; G.stateT = 1.5; sfx.die();
        return;
      }
    }
  }

  // Spielende im Belohnungsmodus: Zeit abgelaufen oder letztes Leben verloren
  function endReward(timeUp) {
    G.state = 'over';
    if (timeUp) sfx.clear();
    ovTitle.textContent = timeUp ? 'Zeit um!' : 'Der Morgen graut';
    ovText.textContent = `Pieks hat ${G.score.toLocaleString('de-DE')} Punkte gesammelt und bis Nacht ${G.level} durchgehalten.` +
      (G.score >= G.hi && G.score > 0 ? ' Neuer Rekord!' : '') + ' Weiter lernen für das nächste Spiel!';
    startBtn.hidden = true; ov.hidden = false;
    try { parent.postMessage({ nachtgarten: 'over', score: G.score }, '*'); } catch (e) {}
  }

  function afterDeath() {
    G.lives--;
    if (G.lives <= 0) {
      if (REWARD) { endReward(false); return; }
      G.state = 'over';
      ovTitle.textContent = 'Der Morgen graut';
      ovText.textContent = `Pieks hat ${G.score.toLocaleString('de-DE')} Punkte gesammelt und bis Nacht ${G.level} durchgehalten.` +
        (G.score >= G.hi && G.score > 0 ? ' Neuer Rekord!' : '');
      startBtn.textContent = 'Noch eine Nacht';
      ov.hidden = false; startBtn.focus();
      return;
    }
    resetActors(); G.state = 'ready'; G.stateT = 1.5;
  }

  function nextLevel() {
    G.level++; G.fruit = null;
    resetDots(); resetActors();
    G.state = 'ready'; G.stateT = 1.8;
  }

  function togglePause() {
    if (G.state === 'paused') { G.state = G.prev; pauseBtn.textContent = 'Pause (P)'; }
    else if (G.state === 'play' || G.state === 'ready') { G.prev = G.state; G.state = 'paused'; pauseBtn.textContent = 'Weiter (P)'; }
  }

  // ---------- Schleife ----------
  function update(dt) {
    G.time += dt;
    if (REWARD && G.state !== 'title' && G.state !== 'paused' && G.state !== 'over') {
      G.playT += dt;
      if (G.playT >= LIMIT) { endReward(true); return; }
    }
    for (const p of G.popups) p.t += dt;
    G.popups = G.popups.filter(p => p.t < 1.1);
    if (G.state === 'ready') { G.stateT -= dt; if (G.stateT <= 0) G.state = 'play'; return; }
    if (G.state === 'dying') { G.stateT -= dt; if (G.stateT <= 0) afterDeath(); return; }
    if (G.state === 'clear') { G.stateT -= dt; if (G.stateT <= 0) nextLevel(); return; }
    if (G.state !== 'play') return;
    if (G.freezeT > 0) { G.freezeT -= dt; if (G.freezeT <= 0) for (const o of OWLS) o.caught = false; return; }
    let rem = dt;
    while (rem > 1e-6 && G.state === 'play' && G.freezeT <= 0) { const h = Math.min(rem, 1 / 120); tick(h); rem -= h; }
  }

  function tick(h) {
    bfsMemo = new Map();
    G.clock += h;
    if (G.restT > 0) G.restT -= h;
    else if (G.clock >= G.nextRest) { G.restT = 4; G.nextRest = G.clock + 22; }
    if (G.dazzleT > 0) { G.dazzleT -= h; if (G.dazzleT <= 0) for (const o of OWLS) o.dazzled = false; }
    if (G.fruit) { G.fruit.t -= h; if (G.fruit.t <= 0) G.fruit = null; }
    P.rollT = Math.max(0, P.rollT - h); P.rollCd = Math.max(0, P.rollCd - h);
    stepPlayer(h);
    if (G.state !== 'play') return;
    for (const o of OWLS) { o.moodT += h; stepOwl(o, h); }
    collide();
  }

  function roll() {
    if (G.state !== 'play' || P.rollCd > 0) return;
    P.rollT = 0.7; P.rollCd = 5; sfx.roll();
  }

  // ---------- Zeichnen ----------
  const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
  const stage = document.getElementById('stage');
  const landscape = matchMedia('(orientation: landscape) and (max-height: 560px)');
  let ts = 28, dpr = 1, bg = null;

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    const land = landscape.matches;
    const avail = land ? window.innerWidth - 370 : Math.min(stage.parentElement.clientWidth - 14, 600);
    const byH = land ? (window.innerHeight - 34) / H : Math.max((window.innerHeight - 120) / H, 15);
    ts = Math.max(12, Math.floor(Math.min(avail / W, 30, byH)));
    cv.width = W * ts * dpr; cv.height = H * ts * dpr;
    cv.style.width = W * ts + 'px'; cv.style.height = H * ts + 'px';
    buildBg();
  }

  function buildBg() {
    bg = document.createElement('canvas');
    bg.width = cv.width; bg.height = cv.height;
    const g = bg.getContext('2d');
    g.setTransform(dpr, 0, 0, dpr, 0, 0);
    g.fillStyle = C.night; g.fillRect(0, 0, W * ts, H * ts);
    // feiner Moosboden
    let seed = 7;
    const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
    g.fillStyle = 'rgba(155, 199, 164, 0.05)';
    for (let i = 0; i < W * H * 1.2; i++) g.fillRect(rnd() * W * ts, rnd() * H * ts, 1.5, 1.5);
    // Nest
    g.fillStyle = 'rgba(122, 82, 50, 0.28)';
    g.beginPath(); g.roundRect(8 * ts + 2, 9 * ts + 2, 3 * ts - 4, ts - 4, ts * 0.4); g.fill();
    const ins = ts * 0.14;
    const isWall = (x, y) => x >= 0 && x < W && y >= 0 && y < H && GRID[y][x] === '#';
    g.fillStyle = C.hedge;
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
      if (!isWall(x, y)) continue;
      g.beginPath(); g.roundRect(x * ts + ins, y * ts + ins, ts - 2 * ins, ts - 2 * ins, ts * 0.32); g.fill();
      if (isWall(x + 1, y)) g.fillRect(x * ts + ts / 2, y * ts + ins, ts, ts - 2 * ins);
      if (isWall(x, y + 1)) g.fillRect(x * ts + ins, y * ts + ts / 2, ts - 2 * ins, ts);
      if (isWall(x + 1, y) && isWall(x, y + 1) && isWall(x + 1, y + 1)) g.fillRect(x * ts + ts / 2, y * ts + ts / 2, ts, ts);
    }
    g.fillStyle = C.hedgeHi;
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
      if (!isWall(x, y)) continue;
      for (let k = 0; k < 3; k++) {
        g.beginPath();
        g.arc(x * ts + ins * 1.6 + rnd() * (ts - ins * 3.2), y * ts + ins * 1.6 + rnd() * (ts - ins * 3.2), ts * (0.05 + rnd() * 0.06), 0, 7);
        g.fill();
      }
    }
    // Nesttür aus Zweigen
    g.strokeStyle = C.bark; g.lineWidth = Math.max(2, ts * 0.1); g.lineCap = 'round';

  }

  function drawHog(cx, cy, face, phase, rolling, scale = 1) {
    const r = ts * 0.42 * scale;
    ctx.save(); ctx.translate(cx, cy);
    if (rolling) {
      ctx.rotate(phase * 8);
      ctx.fillStyle = C.hogSpike;
      for (let k = 0; k < 12; k++) {
        const a = k / 12 * Math.PI * 2;
        ctx.beginPath();
        ctx.moveTo(Math.cos(a - 0.25) * r * 0.75, Math.sin(a - 0.25) * r * 0.75);
        ctx.lineTo(Math.cos(a) * r * 1.12, Math.sin(a) * r * 1.12);
        ctx.lineTo(Math.cos(a + 0.25) * r * 0.75, Math.sin(a + 0.25) * r * 0.75);
        ctx.fill();
      }
      ctx.fillStyle = C.hog; ctx.beginPath(); ctx.arc(0, 0, r * 0.78, 0, 7); ctx.fill();
      ctx.fillStyle = C.hogFace; ctx.beginPath(); ctx.arc(r * 0.25, 0, r * 0.28, 0, 7); ctx.fill();
      ctx.restore(); return;
    }
    ctx.rotate([-Math.PI / 2, 0, Math.PI / 2, Math.PI][face]);
    if (face === 3) ctx.scale(1, -1);
    const step = Math.sin(phase * Math.PI * 2) * r * 0.12;
    // Füßchen
    ctx.fillStyle = C.hogSpike;
    for (const [fx, fy] of [[r * 0.35 + step, -r * 0.62], [r * 0.35 - step, r * 0.62], [-r * 0.4 - step, -r * 0.6], [-r * 0.4 + step, r * 0.6]]) {
      ctx.beginPath(); ctx.arc(fx, fy, r * 0.13, 0, 7); ctx.fill();
    }
    // Stacheln
    for (let k = 0; k < 11; k++) {
      const a = Math.PI * 0.55 + k / 10 * Math.PI * 0.9;
      ctx.beginPath();
      ctx.moveTo(Math.cos(a - 0.2) * r * 0.6, Math.sin(a - 0.2) * r * 0.55);
      ctx.lineTo(Math.cos(a) * r * 1.18, Math.sin(a) * r * 1.0);
      ctx.lineTo(Math.cos(a + 0.2) * r * 0.6, Math.sin(a + 0.2) * r * 0.55);
      ctx.fill();
    }
    ctx.fillStyle = C.hog;
    ctx.beginPath(); ctx.ellipse(-r * 0.05, 0, r * 0.82, r * 0.68, 0, 0, 7); ctx.fill();
    // Gesicht
    ctx.fillStyle = C.hogFace;
    ctx.beginPath();
    ctx.moveTo(r * 0.12, -r * 0.55);
    ctx.quadraticCurveTo(r * 0.95, -r * 0.35, r * 1.12, 0);
    ctx.quadraticCurveTo(r * 0.95, r * 0.35, r * 0.12, r * 0.55);
    ctx.quadraticCurveTo(r * 0.32, 0, r * 0.12, -r * 0.55);
    ctx.fill();
    ctx.fillStyle = '#20140c';
    ctx.beginPath(); ctx.arc(r * 1.1, 0, r * 0.11, 0, 7); ctx.fill();
    ctx.beginPath(); ctx.arc(r * 0.6, -r * 0.2, r * 0.08, 0, 7); ctx.fill();
    ctx.restore();
  }

  function drawOwl(o, cx, cy) {
    const r = ts * 0.44;
    ctx.save(); ctx.translate(cx, cy);
    if (o.mode === 'feather') {
      ctx.rotate(Math.sin(G.time * 6 + o.idx) * 0.5);

      ctx.beginPath(); ctx.ellipse(0, 0, r * 0.22, r * 0.6, 0.4, 0, 7); ctx.fill();
      ctx.strokeStyle = C.owls[o.idx]; ctx.lineWidth = 1.5;

    }
    if (o.mode === 'nest') ctx.translate(0, Math.sin(G.time * 4 + o.idx) * ts * 0.06);
    const flash = o.dazzled && G.dazzleT < 2 && Math.floor(G.time * 5) % 2 === 0;
    const body = o.dazzled ? (flash ? '#f3f1ff' : C.daze) : C.owls[o.idx];
    ctx.fillStyle = body;
    // Federohren
    ctx.beginPath(); ctx.moveTo(-r * 0.75, -r * 0.35); ctx.lineTo(-r * 0.6, -r * 0.98); ctx.lineTo(-r * 0.25, -r * 0.62); ctx.fill();
    ctx.beginPath(); ctx.moveTo(r * 0.75, -r * 0.35); ctx.lineTo(r * 0.6, -r * 0.98); ctx.lineTo(r * 0.25, -r * 0.62); ctx.fill();
    // Körper mit gewelltem Saum
    ctx.beginPath();

      const x0 = r * 0.85 - k * r * 0.567;

    }
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = 'rgba(255, 255, 255, 0.18)';
    ctx.beginPath(); ctx.ellipse(0, r * 0.38, r * 0.45, r * 0.38, 0, 0, 7); ctx.fill();
    // Augen
    const ex = r * 0.34, ey = -r * 0.12, er = r * 0.3;
    ctx.fillStyle = '#fbfaf2';
    ctx.beginPath(); ctx.arc(-ex, ey, er, 0, 7); ctx.arc(ex, ey, er, 0, 7); ctx.fill();
    ctx.strokeStyle = ctx.fillStyle = '#1b1410';
    if (o.dazzled) {
      ctx.lineWidth = Math.max(1.5, ts * 0.06); ctx.lineCap = 'round';
      for (const sx of [-ex, ex]) {
        ctx.beginPath(); ctx.arc(sx, ey, er * 0.55, G.time * 8, G.time * 8 + 4.2); ctx.stroke();
      }
    } else {
      const px = DX[o.dir] * er * 0.4, py = DY[o.dir] * er * 0.4;
      ctx.beginPath(); ctx.arc(-ex + px, ey + py, er * 0.45, 0, 7); ctx.arc(ex + px, ey + py, er * 0.45, 0, 7); ctx.fill();
      if (o.mode === 'hunt' && (G.restT > 0 || (o.kind === 'moody' && !angry(o)))) {
        ctx.fillStyle = body; // halb geschlossene Lider: die Eule lauscht
        ctx.fillRect(-ex - er, ey - er, er * 2, er); ctx.fillRect(ex - er, ey - er, er * 2, er);
      } else if (o.kind === 'moody' && o.mode === 'hunt') {
        ctx.lineWidth = Math.max(1.5, ts * 0.06);
        ctx.beginPath(); ctx.moveTo(-ex - er, ey - er * 1.1); ctx.lineTo(-ex + er * 0.6, ey - er * 0.5);
        ctx.moveTo(ex + er, ey - er * 1.1); ctx.lineTo(ex - er * 0.6, ey - er * 0.5); ctx.stroke();

    ctx.beginPath(); ctx.moveTo(-r * 0.1, r * 0.12); ctx.lineTo(r * 0.1, r * 0.12); ctx.lineTo(0, r * 0.34); ctx.fill();

  }

  function draw() {
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

        ctx.fillStyle = C.lantern; ctx.beginPath(); ctx.roundRect(x - ts * 0.16, y - ts * 0.24, ts * 0.32, ts * 0.42, ts * 0.1); ctx.fill();
        ctx.fillStyle = '#fff3d6'; ctx.beginPath(); ctx.arc(x, y - ts * 0.03, ts * 0.07, 0, 7); ctx.fill();

    }
    // Waldfrucht
    if (G.fruit) {
      const x = c(FRUIT.x), y = c(FRUIT.y);
      if (G.fruit.t > 2 || Math.floor(G.time * 6) % 2) {
        ctx.fillStyle = G.fruit.c; ctx.beginPath(); ctx.arc(x, y + ts * 0.04, ts * 0.27, 0, 7); ctx.fill();
        ctx.fillStyle = 'rgba(255,255,255,0.35)'; ctx.beginPath(); ctx.arc(x - ts * 0.09, y - ts * 0.04, ts * 0.07, 0, 7); ctx.fill();
        ctx.fillStyle = C.hedgeHi; ctx.beginPath(); ctx.ellipse(x + ts * 0.1, y - ts * 0.27, ts * 0.13, ts * 0.06, -0.5, 0, 7); ctx.fill();

    }

    if (G.state !== 'title') {
      for (const o of OWLS) {
        if (o.caught) continue;
        if (G.state === 'dying' && G.stateT < 1.0) continue;
        const r = renderPos(o);
        drawOwl(o, c(r.x), c(r.y));
      }

  }

  // ---------- Anzeige ----------

  const ov = $('ov'), ovTitle = $('ovTitle'), ovText = $('ovText'), startBtn = $('startBtn'), pauseBtn = $('pauseBtn'), soundBtn = $('soundBtn');
  const last = {};
  if (REWARD) {

  }

  function hud() {

    let m = '';

    else if (G.state === 'over') m = 'Spiel vorbei.';
    else if (G.state === 'paused') m = 'Pausiert. P drücken zum Weiterspielen.';
    else if (G.state === 'dying') m = 'Erwischt!';
    else if (G.dazzleT > 0) m = `Laterne! Die Eulen sind noch ${Math.ceil(G.dazzleT)} s geblendet.`;
    else if (G.restT > 0) m = 'Die Eulen lauschen und fliegen ziellos …';
    else if (G.fruit) m = `Eine ${G.fruit.n} liegt unter dem Nest (${G.fruit.p} Punkte).`;
    else m = `Noch ${dotsLeft} Sporen im Garten.`;
    if (REWARD && G.state !== 'title' && G.state !== 'over') {
      const left = Math.max(0, Math.ceil(LIMIT - G.playT));
      m = `${(left / 60) | 0}:${String(left % 60).padStart(2, '0')} · ` + m;
    }

    if (last.r !== pct) { last.r = pct; rollBar.style.setProperty('--p', pct); }
  }

  // ---------- Ton ----------

    if (AC && AC.state === 'suspended') AC.resume().catch(() => {});

  }
  function tone(f1, f2, dur, type = 'square', vol = 0.04, delay = 0) {
    const a = AC; if (!a || muted) return;
    const t0 = a.currentTime + delay;
    const o = a.createOscillator(), g = a.createGain();
    o.type = type; o.frequency.setValueAtTime(f1, t0); o.frequency.exponentialRampToValueAtTime(f2, t0 + dur);

  }
  const sfx = {
    start() { [392, 523, 659, 784].forEach((f, i) => tone(f, f, 0.12, 'triangle', 0.05, i * 0.11)); },
    eat() { eatFlip = !eatFlip; tone(eatFlip ? 880 : 740, eatFlip ? 740 : 880, 0.05, 'triangle', 0.035); },
    lantern() { tone(220, 880, 0.35, 'sawtooth', 0.03); },
    catch() { tone(400, 1600, 0.25, 'square', 0.035); },
    fruit() { tone(660, 1320, 0.15, 'triangle', 0.05); tone(990, 1980, 0.15, 'triangle', 0.04, 0.1); },
    die() { tone(700, 90, 1.1, 'sawtooth', 0.04); },
    clear() { [523, 659, 784, 1047].forEach((f, i) => tone(f, f, 0.15, 'triangle', 0.05, i * 0.13)); },
    roll() { tone(300, 120, 0.2, 'triangle', 0.05); },
    life() { [784, 988, 1175].forEach((f, i) => tone(f, f, 0.1, 'square', 0.03, i * 0.08)); }
  };

  // ---------- Eingabe ----------
  const KEYS = { ArrowUp: 0, KeyW: 0, ArrowRight: 1, KeyD: 1, ArrowDown: 2, KeyS: 2, ArrowLeft: 3, KeyA: 3 };
  addEventListener('keydown', e => {
    if (e.code in KEYS) { want = KEYS[e.code]; e.preventDefault(); return; }
    if (e.code === 'Space') { e.preventDefault(); roll(); return; }
    if (e.code === 'KeyP' || e.code === 'Escape') { togglePause(); return; }
    if (e.code === 'Enter' && (G.state === 'title' || (G.state === 'over' && !REWARD)) && document.activeElement !== startBtn) { ac(); newGame(); }
  });
  startBtn.addEventListener('click', () => { ac(); newGame(); cv.focus?.(); });
  pauseBtn.addEventListener('click', togglePause);
  soundBtn.addEventListener('click', () => { muted = !muted; soundBtn.textContent = 'Ton: ' + (muted ? 'aus' : 'an'); if (!muted) ac(); });
  document.addEventListener('visibilitychange', () => { if (document.hidden && (G.state === 'play' || G.state === 'ready')) togglePause(); });

  for (const b of document.querySelectorAll('.pad [data-d]')) {
    b.addEventListener('pointerdown', e => { e.preventDefault(); ac(); want = +b.dataset.d; });
  }
  $('rollBtn').addEventListener('pointerdown', e => { e.preventDefault(); roll(); });
  // Touch-Geräte erkennen, auch ein iPad mit Tastatur oder Trackpad
  const showPad = () => document.documentElement.classList.add('touch');
  if (navigator.maxTouchPoints > 0 || 'ontouchstart' in window) showPad();
  addEventListener('pointerdown', e => { if (e.pointerType === 'touch') showPad(); }, true);

  let sw = null, lastTap = 0;
  cv.addEventListener('pointerdown', e => { sw = { x: e.clientX, y: e.clientY, moved: false }; });
  cv.addEventListener('pointermove', e => {
    if (!sw) return;
    const dx = e.clientX - sw.x, dy = e.clientY - sw.y;
    if (Math.hypot(dx, dy) < 18) return;
    want = Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 1 : 3) : (dy > 0 ? 2 : 0);
    sw = { x: e.clientX, y: e.clientY, moved: true };
  });
  // Doppeltippen zum Rollen (eigene Erkennung, weil dblclick auf iOS unzuverlässig ist)
  cv.addEventListener('pointerup', e => {
    if (!sw || sw.moved) { lastTap = 0; return; }
    const now = performance.now();
    if (now - lastTap < 320) { roll(); lastTap = 0; } else lastTap = now;
  });
  addEventListener('pointerup', () => { sw = null; });

  // ---------- Start ----------
  resetDots(); resetActors();
  resize();
  addEventListener('resize', resize);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => {});
  let lastT = performance.now();
  function loop(now) {
    const dt = Math.min(0.05, (now - lastT) / 1000); lastT = now;
    update(dt); draw();
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();

<script>

const DEF={settings:{name:'Max',level:'R',readF:1,rewardNeed:30},reward:{fuel:0,tickets:0,best:0},progress:{},stats:{},topics:{},rounds:[],points:0,days:{},offerSkip:0,
 cnt:{rounds:0,fix:0,guess:0,sure:0,kw:0,read:0,est:0,calm:0,perfect:0},badges:{},vocab:{lists:[]}};
