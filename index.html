 const m=Object.assign(d,s,{settings:Object.assign(d.settings,s.settings),cnt:Object.assign(d.cnt,s.cnt||{}),vocab:Object.assign(d.vocab,s.vocab||{})});
 if(!hadCnt)m.cnt.rounds=(s.rounds||[]).length;
 if(!s.cnt||s.cnt.read==null)m.cnt.read=m.cnt.kw||0; // alte Antipp-Treffer zählen für „Genau gelesen“ mit
 /* Einmalig: frueherer Standard 50 Denkpunkte pro Spiel wird zu 30. Danach bleibt jede Wahl in der Eltern-Ansicht erhalten. */ if(!m.rew30){if(m.settings.rewardNeed===50){m.settings.rewardNeed=30;const w=m.reward||(m.reward={fuel:0,tickets:0,best:0});while(w.fuel>=30&&w.tickets<3){w.fuel-=30;w.tickets++;}if(w.tickets>=3)w.fuel=Math.min(w.fuel,30);}m.rew30=true;}
 return m;}}catch(e){}return JSON.parse(JSON.stringify(DEF));}

/* ---------- Natur & Technik: Aufgaben ---------- */
// d: 1 = Grundlage, 2 = Standard, 3 = Gymnasium-Tiefe. g = Gruppe (Varianten zum selben Thema)
const NT=[
{id:'n01',g:'leben',topic:'Lebewesen',d:1,info:'Lebewesen erkennt man an bestimmten Kennzeichen: Sie bewegen sich, wachsen, pflanzen sich fort, nehmen Stoffe auf und geben welche ab und reagieren auf Reize. Etwas ist nur dann lebendig, wenn alle Kennzeichen zutreffen.',q:'Ein Auto bewegt sich und verbraucht Benzin. Warum ist es trotzdem [[kein]] Lebewesen?',opts:['Es wächst nicht und kann sich nicht fortpflanzen','Es ist aus Metall gebaut','Es macht laute Geräusche','Es hat keine Augen'],a:0,ex:'Bewegung und Energieverbrauch allein reichen nicht. Ein Auto wächst nicht und bekommt keine „Auto-Kinder“ – es fehlen also Kennzeichen des Lebendigen.'},
{id:'n02',g:'leben',topic:'Lebewesen',d:2,info:'Lebewesen reagieren auf Reize aus ihrer Umgebung – auch Pflanzen. Eine Sonnenblume dreht ihre Blüte zum Licht, und die Blätter mancher Pflanzen klappen bei Berührung zusammen.',q:'Eine Zimmerpflanze am Fenster wächst schräg zur Scheibe hin. Welches Kennzeichen des Lebendigen zeigt sie damit?',opts:['Sie reagiert auf einen Reiz (Licht)','Sie pflanzt sich fort','Sie gibt Stoffe ab','Sie bewegt sich wie ein Tier'],a:0,ex:'Licht ist ein Reiz. Die Pflanze wächst zum Licht hin, weil sie es für die Fotosynthese braucht – das ist Reizbarkeit.'},
{id:'n03',g:'zelle',topic:'Zellen',d:3,info:'Alle Lebewesen bestehen aus Zellen. Pflanzenzellen haben zusätzlich eine feste Zellwand, eine große Vakuole (Zellsaftraum) und oft grüne Chloroplasten. Tierzellen haben nur eine dünne Zellmembran.',q:'Was findet man in einer Pflanzenzelle, aber [[nicht]] in einer Tierzelle?',opts:['Chloroplasten','Zellkern','Zellmembran','Zellplasma'],a:0,ex:'Zellkern, Zellmembran und Zellplasma haben beide Zellarten. Nur Pflanzenzellen haben Chloroplasten – darin findet die Fotosynthese statt.'},
{id:'n04',g:'zelle',topic:'Zellen',d:2,info:'Jede Zelle hat einen Zellkern. Er enthält die Erbinformation und steuert, was in der Zelle passiert – wie eine Schaltzentrale. Umgeben ist jede Zelle von einer dünnen Zellmembran.',q:'Welcher Teil der Zelle steuert alle Vorgänge?',opts:['Der Zellkern','Die Zellmembran','Die Vakuole','Die Zellwand'],a:0,ex:'Der Zellkern ist die Steuerzentrale der Zelle. Die Membran grenzt die Zelle nur nach außen ab.'},
{id:'n05',g:'saeuger',topic:'Wirbeltiere',d:1,info:'Wirbeltiere teilt man in fünf Klassen ein: Fische, Amphibien (Lurche), Reptilien (Kriechtiere), Vögel und Säugetiere. Säugetiere säugen ihre Jungen mit Milch und haben meist ein Fell.',q:'Welches dieser Tiere ist [[kein]] Säugetier?',opts:['Pinguin','Wal','Fledermaus','Delfin'],a:0,ex:'Der Pinguin ist ein Vogel: Er hat Federn und legt Eier – auch wenn er nicht fliegen kann. Wal, Delfin und Fledermaus säugen ihre Jungen.'},
{id:'n06',g:'saeuger',topic:'Wirbeltiere',d:2,info:'Säugetiere atmen mit Lungen, sind gleichwarm und säugen ihre Jungen mit Milch. Manche Säugetiere leben im Wasser, andere können fliegen.',q:'Ein Wal lebt im Meer wie ein Fisch. Woran erkennt man, dass er [[trotzdem]] ein Säugetier ist?',opts:['Er atmet mit Lungen und säugt seine Jungen','Er ist sehr groß','Er hat eine Schwanzflosse','Er frisst kleine Tiere'],a:0,ex:'Wale müssen zum Atmen auftauchen, weil sie Lungen haben, und ihre Jungen trinken Milch. Größe und Flossen sagen nichts über die Tierklasse.'},
{id:'n07',g:'amphib',topic:'Wirbeltiere',d:1,info:'Amphibien wie Frösche leben als Kaulquappe im Wasser und atmen mit Kiemen. Später wachsen ihnen Beine, sie atmen mit Lungen und über die feuchte Haut. Diesen Umbau nennt man Metamorphose.',q:'Wie atmet eine Kaulquappe?',opts:['Mit Kiemen','Mit Lungen','Nur durch die Haut','Durch die Nase'],a:0,ex:'Kaulquappen leben ganz im Wasser und atmen wie Fische mit Kiemen. Erst der erwachsene Frosch hat Lungen.'},
{id:'n08',g:'amphib',topic:'Wirbeltiere',d:2,info:'Aus dem Froschlaich schlüpfen Kaulquappen. Sie bekommen erst Hinterbeine, dann Vorderbeine, der Schwanz bildet sich zurück – am Ende steht ein kleiner Frosch. Diese Verwandlung heißt Metamorphose.',q:'Wie nennt man die Verwandlung von der Kaulquappe zum Frosch?',opts:['Metamorphose','Fotosynthese','Häutung','Mauser'],a:0,ex:'Metamorphose bedeutet Umgestaltung. Häutung gibt es bei Schlangen, Mauser bei Vögeln (Federwechsel).'},
{id:'n09',g:'warm',topic:'Wirbeltiere',d:1,info:'Reptilien wie Eidechsen und Schlangen haben eine trockene, schuppige Haut. Sie sind wechselwarm: Ihre Körpertemperatur hängt von der Umgebung ab.',q:'Warum liegt eine Eidechse morgens gern in der Sonne?',opts:['Sie ist wechselwarm und muss sich erst aufwärmen','Sie will ihre Haut trocknen','Sie sucht dort nach Futter','Sie wartet auf andere Eidechsen'],a:0,ex:'Nach der kühlen Nacht ist die Eidechse kalt und langsam. Erst durch die Sonne wird sie warm genug, um flink zu sein.'},
{id:'n10',g:'warm',topic:'Wirbeltiere',d:2,info:'Gleichwarme Tiere halten ihre Körpertemperatur immer etwa gleich – egal ob es draußen kalt oder warm ist. Das kostet viel Energie, deshalb müssen sie viel fressen. Wechselwarme Tiere werden bei Kälte langsam und starr.',q:'Welche beiden Wirbeltierklassen sind gleichwarm?',opts:['Vögel und Säugetiere','Fische und Amphibien','Reptilien und Vögel','Säugetiere und Reptilien'],a:0,ex:'Nur Vögel und Säugetiere halten ihre Temperatur selbst konstant. Fische, Amphibien und Reptilien sind wechselwarm.'},
{id:'n11',g:'vogel',topic:'Wirbeltiere',d:1,info:'Vögel sind an das Fliegen angepasst: Ihre Knochen sind hohl und leicht, sie haben Federn und einen leichten Schnabel statt schwerer Zähne.',q:'Wozu helfen einem Vogel [[hohle]] Knochen?',opts:['Sie machen ihn leicht zum Fliegen','Darin speichert er Wasser','Sie halten ihn warm','Darin wachsen die Federn'],a:0,ex:'Hohle Knochen sind stabil, aber viel leichter als massive. Je leichter der Vogel, desto weniger Kraft braucht er zum Fliegen.'},
{id:'n12',g:'fisch',topic:'Wirbeltiere',d:1,info:'Fische atmen mit Kiemen. Das Wasser strömt durchs Maul hinein und an den Kiemen vorbei. Dabei nehmen sie den Sauerstoff auf, der im Wasser gelöst ist.',q:'Was nehmen Fische mit den Kiemen aus dem Wasser auf?',opts:['Sauerstoff','Salz','Kohlenstoffdioxid','Nahrung'],a:0,ex:'Auch Fische brauchen Sauerstoff. Er ist im Wasser gelöst, und die Kiemen holen ihn heraus.'},
{id:'n13',g:'gebiss',topic:'Säugetiere',d:1,info:'Am Gebiss erkennt man, was ein Säugetier frisst. Fleischfresser wie Hund und Katze haben lange Eckzähne zum Festhalten und scharfe Reißzähne. Pflanzenfresser wie das Rind haben breite Backenzähne zum Zermahlen.',q:'Ein Tier hat große, spitze Eckzähne und scharfe Reißzähne. Was frisst es [[vermutlich]]?',opts:['Fleisch','Gras','Körner','Nur Früchte'],a:0,ex:'Spitze Eck- und Reißzähne sind typisch für Fleischfresser. Gras und Körner zermahlt man mit breiten Backenzähnen.'},
{id:'n14',g:'gebiss',topic:'Säugetiere',d:3,info:'Rinder sind Wiederkäuer. Sie schlucken Gras zunächst kaum gekaut in den Pansen, einen von vier Magenabschnitten. Später würgen sie es wieder hoch, kauen es gründlich und schlucken es erneut.',q:'Wie viele Magenabschnitte hat ein Rind?',opts:['Vier','Einen','Zwei','Sieben'],a:0,ex:'Pansen, Netzmagen, Blättermagen und Labmagen – vier Abschnitte. So kann das Rind das schwer verdauliche Gras gut nutzen.'},
{id:'n15',g:'winter',topic:'Säugetiere',d:2,info:'Manche Tiere überstehen den Winter im Winterschlaf: Ihre Körpertemperatur sinkt, Herz und Atmung werden sehr langsam – so sparen sie Energie. Der Igel ist ein Beispiel. Wechselwarme Tiere wie Frösche fallen dagegen in Winterstarre.',q:'Warum sinkt beim Igel im Winterschlaf die Körpertemperatur?',opts:['So spart er Energie, weil er im Winter kaum Nahrung findet','Weil er krank ist','Weil er wechselwarm ist','Damit er nicht aufwacht'],a:0,ex:'Der Igel ist gleichwarm – er senkt seine Temperatur aber gezielt ab. So reichen seine Fettreserven bis zum Frühling.'},
{id:'n16',g:'kette',topic:'Lebensräume',d:1,info:'In einer Nahrungskette steht am Anfang immer eine Pflanze. Sie wird von einem Pflanzenfresser gefressen, der wiederum von einem Fleischfresser. Beispiel: Gras → Hase → Fuchs.',q:'Was steht am [[Anfang]] jeder Nahrungskette?',opts:['Eine Pflanze','Ein Raubtier','Der Mensch','Ein Insekt'],a:0,ex:'Nur Pflanzen können mit Sonnenlicht ihre Nahrung selbst herstellen. Alle anderen Lebewesen hängen davon ab.'},
{id:'n17',g:'foto',topic:'Pflanzen',d:1,info:'Grüne Pflanzen stellen ihre Nahrung selbst her. In den Blättern wandeln sie mit Hilfe von Sonnenlicht Wasser und Kohlenstoffdioxid in Traubenzucker um. Dabei entsteht Sauerstoff. Das nennt man Fotosynthese.',q:'Welches Gas geben Pflanzen bei der Fotosynthese ab?',opts:['Sauerstoff','Kohlenstoffdioxid','Stickstoff','Wasserdampf'],a:0,ex:'Pflanzen nehmen Kohlenstoffdioxid auf und geben Sauerstoff ab – den Sauerstoff, den wir atmen.'},
{id:'n18',g:'foto',topic:'Pflanzen',d:3,info:'Für die Fotosynthese braucht eine Pflanze Licht, Wasser und Kohlenstoffdioxid aus der Luft. Daraus stellt sie Traubenzucker her – und gibt dabei Sauerstoff ab.',q:'Was braucht eine Pflanze für die Fotosynthese [[nicht]]?',opts:['Sauerstoff','Licht','Wasser','Kohlenstoffdioxid'],a:0,ex:'Sauerstoff entsteht bei der Fotosynthese – er wird abgegeben, nicht verbraucht.'},
{id:'n19',g:'bluete',topic:'Pflanzen',d:1,info:'Eine Blüte hat außen grüne Kelchblätter und bunte Kronblätter. Innen liegen die Staubblätter mit dem Pollen und in der Mitte der Stempel. Aus dem Fruchtknoten unten im Stempel wird später die Frucht.',q:'Aus welchem Teil der Blüte entsteht die Frucht?',opts:['Aus dem Fruchtknoten','Aus den Kronblättern','Aus den Staubblättern','Aus den Kelchblättern'],a:0,ex:'Der Fruchtknoten wächst nach der Befruchtung zur Frucht heran – zum Beispiel zum Apfel oder zur Kirsche.'},
{id:'n20',g:'bluete',topic:'Pflanzen',d:2,info:'Bei der Bestäubung gelangt Pollen auf die Narbe einer Blüte – oft durch Bienen, manchmal durch den Wind. Erst danach kann eine Frucht mit Samen entstehen.',q:'Was passiert bei der Bestäubung?',opts:['Pollen gelangt auf die Narbe','Die Blüte wird gegossen','Die Kronblätter fallen ab','Die Wurzel nimmt Wasser auf'],a:0,ex:'Bestäubung heißt: Pollen kommt auf die Narbe. Bienen tragen ihn dabei von Blüte zu Blüte.'},
{id:'n21',g:'wurzel',topic:'Pflanzen',d:1,info:'Die Wurzel verankert die Pflanze im Boden und nimmt Wasser mit Mineralstoffen auf. Über den Stängel gelangt das Wasser bis in die Blätter.',q:'Welche zwei Aufgaben hat die Wurzel?',opts:['Halt geben und Wasser aufnehmen','Licht einfangen und Zucker bilden','Pollen bilden und Insekten anlocken','Samen bilden und verteilen'],a:0,ex:'Licht einfangen machen die Blätter, Insekten anlocken die Blüten. Die Wurzel hält die Pflanze und versorgt sie mit Wasser.'},
{id:'n22',g:'skelett',topic:'Mensch',d:1,est:'Knochen',q:'Schätze zuerst: Wie viele Knochen hat ein erwachsener Mensch ungefähr?',opts:['Rund 200','Rund 50','Rund 100','Rund 500'],a:0,ex:'Ein Erwachsener hat etwa 206 Knochen. Babys haben sogar mehr – einige wachsen später zusammen.'},
{id:'n23',g:'skelett',topic:'Mensch',d:1,info:'Das Skelett stützt den Körper, ermöglicht zusammen mit den Muskeln Bewegung und schützt wichtige Organe: Der Schädel schützt das Gehirn, der Brustkorb Herz und Lunge.',q:'Was schützt der Brustkorb?',opts:['Herz und Lunge','Das Gehirn','Magen und Darm','Die Augen'],a:0,ex:'Die Rippen bilden einen Käfig um Herz und Lunge. Das Gehirn liegt geschützt im Schädel.'},
{id:'n24',g:'muskel',topic:'Mensch',d:3,info:'Muskeln können sich nur zusammenziehen, nicht von selbst strecken. Deshalb arbeiten sie paarweise: Beim Beugen des Arms zieht sich der Bizeps zusammen, beim Strecken der Trizeps. Das nennt man Gegenspielerprinzip.',q:'Was passiert, wenn du deinen Arm [[streckst]]?',opts:['Der Trizeps zieht sich zusammen','Der Bizeps zieht sich zusammen','Beide Muskeln entspannen sich','Der Knochen wird länger'],a:0,ex:'Beim Strecken arbeitet der Trizeps auf der Rückseite des Oberarms. Der Bizeps wird dabei passiv gedehnt.'},
{id:'n25',g:'herz',topic:'Mensch',d:2,est:'Schläge',q:'Schätze zuerst: Wie oft schlägt das Herz eines Kindes in Ruhe pro Minute ungefähr?',opts:['Etwa 85-mal','Etwa 10-mal','Etwa 30-mal','Etwa 300-mal'],a:0,ex:'Bei Kindern in deinem Alter sind es in Ruhe etwa 70 bis 110 Schläge pro Minute. Beim Sport deutlich mehr. Fühl mal an deinem Handgelenk nach!'},
{id:'n26',g:'atmung',topic:'Mensch',d:2,info:'Beim Einatmen gelangt Luft über die Luftröhre in die Lunge. In den winzigen Lungenbläschen geht Sauerstoff ins Blut über. Kohlenstoffdioxid wird dort abgegeben und ausgeatmet.',q:'Wo gelangt der Sauerstoff ins Blut?',opts:['In den Lungenbläschen','In der Luftröhre','Im Herzen','Im Magen'],a:0,ex:'Die Lunge hat Millionen kleiner Bläschen mit hauchdünner Wand – dort wechselt der Sauerstoff ins Blut.'},
{id:'n27',g:'verdauung',topic:'Mensch',d:2,info:'Die Verdauung beginnt schon im Mund: Die Zähne zerkleinern die Nahrung, der Speichel beginnt mit der Zerlegung. Im Magen wird weiter zersetzt. Im Dünndarm werden die Nährstoffe ins Blut aufgenommen.',q:'Wo werden die meisten Nährstoffe ins Blut aufgenommen?',opts:['Im Dünndarm','Im Magen','In der Speiseröhre','Im Mund'],a:0,ex:'Der Magen zersetzt die Nahrung, aufgenommen werden die Nährstoffe aber erst im langen Dünndarm.'},
{id:'n28',g:'verdauung',topic:'Mensch',d:2,est:'m',q:'Schätze zuerst: Wie lang ist der Darm eines Erwachsenen insgesamt ungefähr?',opts:['Etwa 7 Meter','Etwa 50 Zentimeter','Etwa 2 Meter','Etwa 50 Meter'],a:0,ex:'Dünndarm und Dickdarm zusammen sind etwa 7 bis 8 Meter lang. Damit das in den Bauch passt, liegt der Darm in vielen Schlingen.'},
{id:'n29',g:'wasser',topic:'Mensch',d:1,est:'%',q:'Schätze zuerst: Wie viel Prozent deines Körpers bestehen ungefähr aus Wasser?',opts:['Etwa 60 %','Etwa 10 %','Etwa 30 %','Etwa 95 %'],a:0,ex:'Etwa 60 % deines Körpers ist Wasser. Deshalb ist es so wichtig, genug zu trinken.'},
{id:'n30',g:'zustand',topic:'Stoffe',d:1,info:'Stoffe können fest, flüssig oder gasförmig sein. Wird ein fester Stoff flüssig, nennt man das Schmelzen. Wird ein flüssiger Stoff fest, heißt das Erstarren. Wasser erstarrt bei 0 °C zu Eis.',q:'Eine Pfütze friert im Winter zu. Wie heißt dieser Vorgang?',opts:['Erstarren','Schmelzen','Verdampfen','Kondensieren'],a:0,ex:'Flüssiges Wasser wird zu festem Eis – das ist Erstarren. Schmelzen ist genau der umgekehrte Weg.'},
{id:'n31',g:'zustand',topic:'Stoffe',d:2,info:'Luft enthält unsichtbaren Wasserdampf. Trifft er auf eine kalte Fläche, kühlt er ab und wird wieder flüssig – es bilden sich kleine Tröpfchen. Das nennt man Kondensieren.',q:'Warum beschlägt eine kalte Brille, wenn du in ein warmes Zimmer kommst?',opts:['Wasserdampf aus der Luft wird auf dem kalten Glas flüssig','Das Glas schwitzt','Die Brille schmilzt ein bisschen','Staub sammelt sich auf dem Glas'],a:0,ex:'Der unsichtbare Wasserdampf in der warmen Luft kühlt am kalten Glas ab und kondensiert zu winzigen Tropfen.'},
{id:'n32',g:'teilchen',topic:'Stoffe',d:3,info:'Alle Stoffe bestehen aus winzigen Teilchen, die sich ständig bewegen. Je wärmer ein Stoff ist, desto schneller bewegen sich seine Teilchen und desto mehr Platz brauchen sie.',q:'Warum dehnt sich eine Metallbrücke im Sommer aus?',opts:['Ihre Teilchen bewegen sich schneller und brauchen mehr Platz','Die Teilchen werden größer','Es kommen neue Teilchen dazu','Die Sonne drückt die Brücke auseinander'],a:0,ex:'Die Teilchen selbst bleiben gleich groß – sie bewegen sich nur stärker und rücken weiter auseinander. Deshalb haben Brücken Dehnungsfugen.'},
{id:'n33',g:'dichte',topic:'Stoffe',d:3,info:'Ob etwas schwimmt, hängt von der Dichte ab: Ist ein Stoff leichter als die gleiche Menge Wasser, schwimmt er. Holz hat eine geringere Dichte als Wasser, Eisen eine größere.',q:'Warum schwimmt ein Eiswürfel auf Wasser?',opts:['Eis hat eine geringere Dichte als flüssiges Wasser','Eis ist kälter als Wasser','Eis ist härter als Wasser','Eis ist kleiner als das Glas'],a:0,ex:'Wasser dehnt sich beim Gefrieren aus. Gleich viel Eis ist deshalb leichter als die gleiche Menge flüssiges Wasser – und schwimmt oben.'},
{id:'n34',g:'magnet',topic:'Magnetismus',d:1,info:'Magnete ziehen Gegenstände aus Eisen, Nickel und Kobalt an. Andere Metalle wie Kupfer oder Aluminium werden nicht angezogen – Holz, Glas und Kunststoff auch nicht.',q:'Welcher Gegenstand wird von einem Magneten angezogen?',opts:['Ein Eisennagel','Ein Stück Alufolie','Ein Kupferdraht','Ein Holzlöffel'],a:0,ex:'Nur Eisen, Nickel und Kobalt sind magnetisch. Nicht jedes Metall wird also angezogen!'},
{id:'n35',g:'magnet',topic:'Magnetismus',d:1,info:'Jeder Magnet hat einen Nordpol und einen Südpol. Ungleiche Pole ziehen sich an, gleiche Pole stoßen sich ab.',q:'Zwei Magnete liegen mit den Nordpolen zueinander. Was passiert?',opts:['Sie stoßen sich ab','Sie ziehen sich an','Nichts','Sie werden warm'],a:0,ex:'Nordpol und Nordpol sind gleiche Pole – sie stoßen sich ab. Nord und Süd würden sich anziehen.'},
{id:'n36',g:'strom',topic:'Elektrizität',d:1,info:'Strom fließt nur in einem geschlossenen Stromkreis: von der Batterie über einen Draht zur Lampe und über einen zweiten Draht zurück zur Batterie. Ist der Kreis irgendwo unterbrochen, leuchtet die Lampe nicht.',q:'Eine Lampe ist nur mit [[einem]] Draht an die Batterie angeschlossen. Was passiert?',opts:['Sie leuchtet nicht, weil der Stromkreis nicht geschlossen ist','Sie leuchtet halb so hell','Sie leuchtet ganz normal','Sie blinkt'],a:0,ex:'Mit nur einem Draht fehlt der Rückweg zur Batterie. Ohne geschlossenen Kreis fließt gar kein Strom.'},
{id:'n37',g:'strom',topic:'Elektrizität',d:2,info:'Stoffe, die Strom gut leiten, heißen Leiter – zum Beispiel Metalle wie Kupfer. Stoffe, die keinen Strom leiten, heißen Isolatoren – zum Beispiel Kunststoff, Glas oder Gummi.',q:'Warum sind Kabel außen mit Kunststoff umhüllt?',opts:['Kunststoff ist ein Isolator und schützt vor Stromschlägen','Damit die Kabel bunt sind','Kunststoff leitet Strom besonders gut','Damit die Kabel schwerer sind'],a:0,ex:'Innen leitet der Kupferdraht den Strom, außen verhindert der Kunststoff, dass er in deine Hand fließt.'},
{id:'n38',g:'licht',topic:'Licht & Schall',d:2,info:'Licht breitet sich geradlinig aus. Trifft es auf einen undurchsichtigen Gegenstand, entsteht dahinter ein Schatten. Je näher der Gegenstand an der Lampe ist, desto größer wird sein Schatten.',q:'Du hältst deine Hand [[näher]] an die Taschenlampe. Was passiert mit dem Schatten an der Wand?',opts:['Er wird größer','Er wird kleiner','Er bleibt gleich','Er verschwindet'],a:0,ex:'Nah an der Lampe verdeckt deine Hand einen größeren Teil des Lichtkegels – der Schatten wächst.'},
{id:'n39',g:'schall',topic:'Licht & Schall',d:2,info:'Schall entsteht, wenn etwas schwingt – zum Beispiel eine Gitarrensaite. Die Schwingungen werden durch die Luft bis zu unserem Ohr übertragen. Ohne Luft kann sich Schall nicht ausbreiten.',q:'Warum könnte man eine Explosion im Weltall [[nicht]] hören?',opts:['Dort gibt es keine Luft, die den Schall überträgt','Dort ist es zu kalt','Dort ist es zu dunkel','Die Entfernung ist immer zu groß'],a:0,ex:'Im Weltall ist fast leerer Raum. Ohne Luft gibt es nichts, was die Schwingungen weitertragen könnte.'},
{id:'n40',g:'insekt',topic:'Wirbellose',d:1,info:'Insekten haben sechs Beine und einen Körper aus drei Teilen: Kopf, Brust und Hinterleib. Spinnen haben acht Beine und gehören deshalb nicht zu den Insekten.',q:'Welches Tier ist [[kein]] Insekt?',opts:['Spinne','Biene','Marienkäfer','Ameise'],a:0,ex:'Die Spinne hat acht Beine – Insekten haben immer sechs. Biene, Marienkäfer und Ameise sind Insekten.'},
{id:'n41',g:'insekt',topic:'Wirbellose',d:2,info:'Viele Insekten verwandeln sich vollständig: Aus dem Ei schlüpft eine Larve, die sich verpuppt. Aus der Puppe schlüpft das fertige Insekt. Beim Schmetterling heißt die Larve Raupe.',q:'In welcher Reihenfolge entwickelt sich ein Schmetterling?',opts:['Ei – Raupe – Puppe – Schmetterling','Ei – Puppe – Raupe – Schmetterling','Raupe – Ei – Puppe – Schmetterling','Ei – Schmetterling – Raupe – Puppe'],a:0,ex:'Aus dem Ei schlüpft die Raupe, sie frisst und wächst, verpuppt sich – und aus der Puppe schlüpft der Schmetterling.'},
{id:'n42',g:'wirbel',topic:'Wirbellose',d:1,info:'Wirbeltiere haben eine Wirbelsäule aus vielen einzelnen Wirbeln. Tiere ohne Wirbelsäule nennt man Wirbellose – zum Beispiel Insekten, Schnecken und Regenwürmer.',q:'Welches Tier hat eine Wirbelsäule?',opts:['Frosch','Regenwurm','Schnecke','Biene'],a:0,ex:'Der Frosch ist ein Amphibium und damit ein Wirbeltier. Regenwurm, Schnecke und Biene sind Wirbellose.'},
{id:'n43',g:'wirbel',topic:'Wirbellose',d:2,info:'Der Regenwurm frisst abgestorbene Blätter und Erde. Sein Kot düngt den Boden, und durch seine Gänge kommen Luft und Wasser tief in die Erde.',q:'Warum sind Regenwürmer für den Garten [[nützlich]]?',opts:['Sie lockern und düngen den Boden','Sie fressen gesunde Wurzeln','Sie vertreiben Vögel','Sie bestäuben Blüten'],a:0,ex:'Regenwürmer sind fleißige Bodenarbeiter: Sie lockern die Erde und machen aus Blättern wertvollen Humus.'},
{id:'n44',g:'nest',topic:'Wirbeltiere',d:2,info:'Nesthocker schlüpfen nackt und hilflos und werden lange im Nest gefüttert, zum Beispiel junge Amseln. Nestflüchter haben beim Schlüpfen schon Daunenfedern und können bald laufen, zum Beispiel Hühner- und Entenküken.',q:'Ein Küken schlüpft mit Daunenfedern und läuft nach wenigen Stunden hinter der Mutter her. Was ist es?',opts:['Ein Nestflüchter','Ein Nesthocker','Ein Zugvogel','Ein Standvogel'],a:0,ex:'Es verlässt das Nest sofort – also ein Nestflüchter, wie Entenküken. Junge Amseln oder Meisen sind Nesthocker.'},
{id:'n45',g:'nest',topic:'Wirbeltiere',d:2,info:'Zugvögel wie Schwalbe und Storch fliegen im Herbst in wärmere Gebiete, oft bis nach Afrika. Im Frühling kommen sie zurück und brüten bei uns. Standvögel wie Amsel und Meise bleiben das ganze Jahr hier.',q:'Warum fliegen Schwalben im Herbst nach Süden?',opts:['Weil sie im Winter bei uns kaum Insekten finden','Weil sie im Süden ihre Eier legen','Weil ihnen ihr Nest zu klein wird','Weil sie dort ihre Federn wechseln'],a:0,ex:'Schwalben fressen fliegende Insekten – im Winter gibt es hier keine. Ihre Jungen ziehen sie aber bei uns groß.'},
{id:'n46',g:'fisch',topic:'Wirbeltiere',d:2,info:'Fische haben eine Schwimmblase, die mit Gas gefüllt ist. Damit können sie im Wasser schweben, ohne zu sinken oder aufzusteigen. Mit den Flossen steuern sie.',q:'Wozu dient die Schwimmblase eines Fisches?',opts:['Zum Schweben in einer bestimmten Wassertiefe','Zum Atmen','Zum Verdauen','Zum Hören'],a:0,ex:'Mit mehr oder weniger Gas in der Schwimmblase hält der Fisch seine Tiefe. Geatmet wird mit den Kiemen.'},
{id:'n47',g:'sinne',topic:'Mensch',d:1,info:'Der Mensch hat fünf Sinne: Sehen (Augen), Hören (Ohren), Riechen (Nase), Schmecken (Zunge) und Tasten (Haut). Die Sinnesorgane nehmen Reize auf und melden sie ans Gehirn.',q:'Mit welchem Sinnesorgan spürst du Wärme und Kälte?',opts:['Mit der Haut','Mit der Zunge','Mit der Nase','Mit dem Ohr'],a:0,ex:'In der Haut sitzen Sinneszellen für Wärme, Kälte, Druck und Schmerz.'},
{id:'n48',g:'sinne',topic:'Mensch',d:2,info:'Licht fällt durch die Pupille ins Auge, die Linse bündelt es, und auf der Netzhaut entsteht ein Bild. Im Dunkeln wird die Pupille groß, bei hellem Licht klein.',q:'Warum wird deine Pupille im Dunkeln [[größer]]?',opts:['Damit mehr Licht ins Auge fällt','Damit weniger Licht ins Auge fällt','Damit das Auge nicht austrocknet','Damit die Linse wächst'],a:0,ex:'Bei wenig Licht öffnet sich die Pupille weit, damit genug Licht auf die Netzhaut kommt. Im Hellen schützt eine kleine Pupille das Auge.'},
{id:'n49',g:'blut',topic:'Mensch',d:2,info:'Das Herz ist ein Hohlmuskel und pumpt das Blut durch den Körper. Arterien führen das Blut vom Herzen weg, Venen führen es zum Herzen zurück.',q:'Welche Blutgefäße führen das Blut [[zum]] Herzen hin?',opts:['Venen','Arterien','Lungenbläschen','Nerven'],a:0,ex:'Venen bringen das Blut zurück zum Herzen. Arterien führen es vom Herzen weg in den Körper.'},
{id:'n50',g:'zahn',topic:'Mensch',d:1,info:'Ein Kind hat 20 Milchzähne. Ab etwa sechs Jahren werden sie nach und nach durch bleibende Zähne ersetzt. Ein Erwachsener hat bis zu 32 Zähne.',q:'Wie viele Milchzähne hat ein Kind?',opts:['20','32','12','28'],a:0,ex:'20 Milchzähne – das bleibende Gebiss hat bis zu 32 Zähne, inklusive der Weisheitszähne.'},
{id:'n51',g:'essen',topic:'Ernährung',d:1,info:'Der Körper braucht verschiedene Nährstoffe: Kohlenhydrate liefern Energie (z. B. in Brot und Nudeln), Eiweiß braucht er zum Aufbau von Muskeln (z. B. in Milch, Fisch, Bohnen), dazu Fette, Vitamine, Mineralstoffe und Wasser.',q:'Welcher Nährstoff ist vor allem für den [[Aufbau]] von Muskeln wichtig?',opts:['Eiweiß','Zucker','Fett','Wasser'],a:0,ex:'Eiweiß ist der Baustoff des Körpers. Zucker liefert schnelle Energie, Fett ist ein Energiespeicher.'},
{id:'n52',g:'essen',topic:'Ernährung',d:2,info:'Die Ernährungspyramide zeigt: Ganz unten stehen Getränke wie Wasser, dann Obst und Gemüse, dann Getreide – davon darf man viel zu sich nehmen. Ganz oben stehen Süßigkeiten und Fettes – davon nur wenig.',q:'Wovon solltest du laut Ernährungspyramide am [[meisten]] zu dir nehmen?',opts:['Wasser und ungesüßte Getränke','Süßigkeiten','Wurst und Fleisch','Butter und Öl'],a:0,ex:'Die breite Basis der Pyramide sind Getränke – am besten Wasser oder ungesüßter Tee.'},
{id:'n53',g:'samen',topic:'Pflanzen',d:2,info:'Pflanzen verbreiten ihre Samen auf verschiedene Weise: Der Löwenzahn hat Schirmchen, die der Wind trägt. Kletten haften im Fell von Tieren. Kirschen werden von Vögeln gefressen, die Kerne werden woanders ausgeschieden.',q:'Wie verbreitet der Löwenzahn seine Samen?',opts:['Mit dem Wind','Durch Tiere, die die Früchte fressen','Indem die Frucht aufplatzt','Mit dem Wasser'],a:0,ex:'Pusteblume! Die Schirmchen fliegen mit dem Wind oft weit weg.'},
{id:'n54',g:'samen',topic:'Pflanzen',d:1,info:'Ein Samen keimt, wenn er Wasser, Wärme und Luft bekommt. Licht braucht er zum Keimen meistens nicht – die Nährstoffe im Samen reichen für den Anfang.',q:'Was braucht ein Bohnensamen zum Keimen [[nicht]] unbedingt?',opts:['Licht','Wasser','Wärme','Luft'],a:0,ex:'Bohnen keimen auch im Dunkeln. Erst die junge Pflanze braucht Licht für die Fotosynthese.'},
{id:'n55',g:'baum',topic:'Lebensräume',d:1,info:'Laubbäume wie Buche und Eiche verlieren im Herbst ihre Blätter. Nadelbäume wie Fichte und Kiefer behalten ihre Nadeln im Winter – mit einer Ausnahme: der Lärche.',q:'Welcher Nadelbaum verliert im Herbst seine Nadeln?',opts:['Die Lärche','Die Fichte','Die Tanne','Die Kiefer'],a:0,ex:'Die Lärche färbt sich im Herbst goldgelb und wirft ihre Nadeln ab. Im Frühling wachsen neue.'},
{id:'n56',g:'wald',topic:'Lebensräume',d:2,info:'Ein Wald hat Stockwerke: die Moosschicht am Boden, die Krautschicht mit Farnen und Blumen, die Strauchschicht und die Baumschicht. Jede Schicht ist Lebensraum für andere Tiere und Pflanzen.',q:'In welcher Schicht des Waldes wachsen Farne und Blumen?',opts:['In der Krautschicht','In der Moosschicht','In der Strauchschicht','In der Baumschicht'],a:0,ex:'Farne, Gräser und Blumen wie das Buschwindröschen bilden die Krautschicht – gleich über dem Moos.'},
{id:'n57',g:'kette',topic:'Lebensräume',d:2,info:'Viele Nahrungsketten sind miteinander verknüpft – das nennt man Nahrungsnetz. Verschwindet ein Glied, hat das Folgen für viele andere Lebewesen.',q:'Wenn in einem Wald alle Mäuse verschwinden würden – wem fehlt dann [[zuerst]] Nahrung?',opts:['Eulen und Füchsen','Den Bäumen','Den Regenwürmern','Den Pilzen'],a:0,ex:'Eulen und Füchse fressen Mäuse. Fehlt die Beute, müssen sie anderes Futter suchen oder abwandern.'},
{id:'n58',g:'zustand',topic:'Stoffe',d:1,info:'Beim Verdampfen wird eine Flüssigkeit zu Gas. Wasser siedet bei 100 °C. Aber auch ohne Kochen verdunstet Wasser langsam, zum Beispiel aus einer Pfütze.',q:'Bei welcher Temperatur siedet Wasser (auf Meereshöhe)?',opts:['100 °C','0 °C','50 °C','212 °C'],a:0,ex:'Bei 100 °C kocht Wasser. 0 °C ist der Gefrierpunkt. (212 ist die Siedetemperatur in Grad Fahrenheit, wie in den USA.)'},
{id:'n59',g:'trennen',topic:'Stoffe',d:2,info:'Gemische kann man trennen: Mit einem Sieb trennt man grobe von feinen Teilen, mit einem Filter Sand von Wasser. Salz bekommt man aus Salzwasser zurück, indem man das Wasser verdampfen lässt.',q:'Wie bekommst du Salz aus Salzwasser zurück?',opts:['Das Wasser verdampfen lassen','Durch einen Kaffeefilter gießen','Mit einem Magneten','Mit einem Sieb'],a:0,ex:'Das Salz ist im Wasser gelöst und geht durch jeden Filter. Verdampft das Wasser, bleibt das Salz zurück.'},
{id:'n60',g:'trennen',topic:'Stoffe',d:3,info:'Sand löst sich nicht in Wasser – er sinkt nach unten oder bleibt im Filter hängen. Zucker und Salz dagegen lösen sich auf: Man sieht sie nicht mehr, aber sie sind noch da.',q:'Du gießt Zuckerwasser durch einen Kaffeefilter. Was passiert mit dem Zucker?',opts:['Er geht mit dem Wasser durch den Filter','Er bleibt im Filter hängen','Er verschwindet für immer','Er wird wieder zu Kristallen'],a:0,ex:'Gelöster Zucker ist in winzige Teilchen zerteilt – sie passen durch den Filter. Das Wasser schmeckt danach immer noch süß.'},
{id:'n61',g:'magnet',topic:'Magnetismus',d:2,info:'Die Erde ist selbst ein riesiger Magnet. Die Kompassnadel ist ein kleiner, drehbarer Magnet und richtet sich nach dem Magnetfeld der Erde aus.',q:'Warum zeigt eine Kompassnadel nach Norden?',opts:['Sie richtet sich nach dem Magnetfeld der Erde aus','Sie wird vom Polarstern angezogen','Sie zeigt immer zur Sonne','Wegen des Windes'],a:0,ex:'Die Nadel ist ein Magnet, und die Erde wirkt wie ein großer Magnet. Deshalb dreht sich die Nadel immer in Nord-Süd-Richtung.'},
{id:'n62',g:'strom',topic:'Elektrizität',d:3,info:'In einer Reihenschaltung sind Lampen hintereinander angeschlossen – fällt eine aus, gehen alle aus. In einer Parallelschaltung hat jede Lampe ihren eigenen Weg – fällt eine aus, leuchten die anderen weiter.',q:'Eine Lampe in deinem Zimmer geht kaputt, alle anderen Lampen im Haus leuchten weiter. Wie sind sie geschaltet?',opts:['Parallel','In Reihe','Gar nicht','Über einen Magneten'],a:0,ex:'Im Haus sind Lampen parallel geschaltet. Sonst würde eine kaputte Birne das ganze Haus dunkel machen.'},
{id:'n63',g:'schall',topic:'Licht & Schall',d:1,est:'m',q:'Schätze zuerst: Wie viele Meter legt Schall in einer Sekunde ungefähr zurück?',opts:['Etwa 340 m','Etwa 3 m','Etwa 30 m','Etwa 3.000 m'],a:0,ex:'Schall ist etwa 340 Meter pro Sekunde schnell. Zählst du zwischen Blitz und Donner drei Sekunden, ist das Gewitter etwa einen Kilometer entfernt.'},
{id:'n64',g:'licht',topic:'Licht & Schall',d:1,info:'Licht ist fast eine Million Mal schneller als Schall. Blitz und Donner entstehen gleichzeitig – aber das Licht ist sofort bei dir, der Donner braucht länger.',q:'Warum siehst du den Blitz [[vor]] dem Donner?',opts:['Licht ist schneller als Schall','Der Donner entsteht später','Die Augen sind schneller als die Ohren','Der Blitz ist näher'],a:0,ex:'Beide entstehen im selben Moment. Der Schall ist nur viel langsamer unterwegs.'},
{id:'n65',g:'forsch',topic:'Wie Forscher arbeiten',d:1,info:'Naturwissenschaftler gehen Schritt für Schritt vor: Sie stellen eine Frage, äußern eine Vermutung, planen einen Versuch, beobachten genau und werten danach aus.',q:'Was macht man [[vor]] einem Versuch?',opts:['Eine Vermutung aufstellen','Das Ergebnis aufschreiben','Den Versuch auswerten','Die Geräte wegräumen'],a:0,ex:'Erst vermuten, dann ausprobieren. So kann man hinterher prüfen, ob die Vermutung gestimmt hat.'},
{id:'n66',g:'forsch',topic:'Wie Forscher arbeiten',d:2,info:'Bei einem fairen Versuch ändert man nur eine einzige Sache und lässt alles andere gleich. Nur so weiß man, was die Wirkung verursacht hat.',q:'Du testest, ob Kresse mit Licht besser wächst. Was muss bei beiden Schälchen [[gleich]] sein?',opts:['Erde, Wasser und Temperatur','Das Licht','Gar nichts','Nur die Farbe der Schale'],a:0,ex:'Nur das Licht darf sich unterscheiden. Bekäme eine Schale mehr Wasser, wüsstest du nicht, woran es lag.'},
{id:'n67',g:'forsch2',topic:'Wie Forscher arbeiten',d:2,info:'Bei einer Beobachtung beschreibt man genau, was man sieht – ohne es schon zu erklären. Die Erklärung kommt erst bei der Auswertung.',q:'Welcher Satz ist eine reine [[Beobachtung]]?',opts:['Das Wasser wird trüb.','Das Wasser wird trüb, weil sich Salz löst.','Ich glaube, es passiert nichts.','Salz ist ungesund.'],a:0,ex:'„Das Wasser wird trüb“ beschreibt nur, was man sieht. Mit „weil“ beginnt schon eine Erklärung.'},
{id:'n68',g:'labor',topic:'Wie Forscher arbeiten',d:1,info:'Beim Experimentieren gelten Regeln: Schutzbrille tragen, nichts probieren oder essen, lange Haare zusammenbinden und nur nach Anweisung arbeiten.',q:'Was gilt beim Experimentieren?',opts:['Man probiert nichts mit dem Mund','Man darf alles kosten','Man arbeitet ohne Anleitung','Lange Haare bleiben offen'],a:0,ex:'Auch Stoffe, die harmlos aussehen, können gefährlich sein. Deshalb wird im Versuch nichts gekostet.'},
{id:'n69',g:'thermo',topic:'Wetter messen',d:1,info:'Ein Thermometer misst die Temperatur in Grad Celsius (°C). Bei 0 °C gefriert Wasser, bei 100 °C siedet es. Die Körpertemperatur eines gesunden Menschen liegt bei etwa 37 °C.',q:'Wie warm ist der Körper eines gesunden Menschen ungefähr?',opts:['37 °C','20 °C','45 °C','10 °C'],a:0,ex:'Etwa 37 °C. Ab 38 °C spricht man von Fieber.'},
{id:'n70',g:'thermo',topic:'Wetter messen',d:2,info:'Im Thermometer steckt eine Flüssigkeit. Wird es wärmer, dehnt sie sich aus und steigt im dünnen Röhrchen nach oben.',q:'Warum steigt die Flüssigkeit im Thermometer bei Wärme?',opts:['Sie dehnt sich aus','Sie wird leichter','Sie verdunstet','Sie wird angesaugt'],a:0,ex:'Wärme lässt die Teilchen sich stärker bewegen – die Flüssigkeit braucht mehr Platz.'},
{id:'n71',g:'mikro',topic:'Zellen',d:1,info:'Zellen sind so klein, dass man sie nur mit einem Mikroskop sehen kann. Ein Mikroskop vergrößert viele hundert Mal.',q:'Womit kann man Zellen sehen?',opts:['Mit einem Mikroskop','Mit einem Fernrohr','Mit bloßem Auge','Mit einem Kompass'],a:0,ex:'Ein Fernrohr holt Fernes heran, ein Mikroskop vergrößert Winziges.'},
{id:'n72',g:'zelle2',topic:'Zellen',d:2,info:'Die feste Zellwand gibt Pflanzenzellen ihre Form. Deshalb können Pflanzen aufrecht stehen, obwohl sie keine Knochen haben.',q:'Was gibt Pflanzenzellen ihre feste Form?',opts:['Die Zellwand','Der Zellkern','Das Zellplasma','Die Zellmembran'],a:0,ex:'Tierzellen haben nur eine dünne Zellmembran. Pflanzenzellen haben zusätzlich die stabile Zellwand.'},
{id:'n73',g:'leben3',topic:'Lebewesen',d:1,q:'Welches Kennzeichen des Lebendigen zeigt eine Hündin, die Welpen bekommt?',opts:['Fortpflanzung','Reizbarkeit','Wachstum','Bewegung'],a:0,ex:'Lebewesen bekommen Nachkommen – das ist Fortpflanzung.'},
{id:'n74',g:'essen2',topic:'Ernährung',d:1,info:'Vitamine braucht der Körper nur in kleinen Mengen, aber sie sind lebenswichtig. Besonders viele stecken in Obst und Gemüse.',q:'Wo stecken besonders viele Vitamine?',opts:['In Obst und Gemüse','In Limonade','In Gummibärchen','In Pommes'],a:0,ex:'Fünf Portionen Obst und Gemüse am Tag – so bekommt der Körper genug Vitamine.'},
{id:'n75',g:'essen2',topic:'Ernährung',d:2,info:'Zucker liefert schnell Energie, macht aber nicht lange satt. Vollkornbrot gibt die Energie langsamer ab – man bleibt länger satt und kann sich besser konzentrieren.',q:'Welches Frühstück macht [[länger]] satt?',opts:['Vollkornbrot mit Käse','Ein Schokoriegel','Ein Glas Limonade','Weißbrot mit Marmelade'],a:0,ex:'Vollkorn und Eiweiß (Käse) halten bis zur Pause vor. Nach Süßem kommt der Hunger schnell zurück.'},
{id:'n76',g:'zahn2',topic:'Mensch',d:2,info:'Bakterien im Mund verwandeln Zucker in Säure. Die Säure greift den Zahnschmelz an – so entsteht Karies.',q:'Wie entsteht Karies?',opts:['Bakterien machen aus Zucker Säure, die die Zähne angreift','Durch zu viel Zähneputzen','Durch kaltes Wasser','Durch Kaugummi ohne Zucker'],a:0,ex:'Weniger Zucker und gründliches Putzen nehmen den Bakterien die Nahrung.'},
{id:'n77',g:'nutztier',topic:'Haus- und Nutztiere',d:1,info:'Nutztiere wie Rind, Schwein, Schaf und Huhn hält der Mensch, weil sie ihm Nahrung oder Rohstoffe liefern – Milch, Fleisch, Wolle oder Eier.',q:'Welches Nutztier liefert Wolle?',opts:['Das Schaf','Das Schwein','Das Huhn','Das Pferd'],a:0,ex:'Schafe werden einmal im Jahr geschoren. Aus der Wolle macht man zum Beispiel Pullover.'},
{id:'n78',g:'hund',topic:'Haus- und Nutztiere',d:2,info:'Der Hund stammt vom Wolf ab. Wie Wölfe leben Hunde gern im Rudel – in ihrer Menschenfamilie sehen sie ihr Rudel.',q:'Von welchem Tier stammt der Hund ab?',opts:['Vom Wolf','Vom Fuchs','Vom Bären','Vom Luchs'],a:0,ex:'Vor vielen tausend Jahren wurden Wölfe zahm. Aus ihnen züchteten die Menschen alle Hunderassen.'},
{id:'n79',g:'hund',topic:'Haus- und Nutztiere',d:2,info:'Katzen sind Schleichjäger: Sie schleichen sich lautlos an. Ihre Krallen können sie einziehen, und mit den Schnurrhaaren tasten sie im Dunkeln.',q:'Warum hört man eine Katze beim Anschleichen kaum?',opts:['Sie zieht die Krallen ein und läuft auf weichen Ballen','Sie hält die Luft an','Sie springt die ganze Zeit','Sie läuft nur auf zwei Beinen'],a:0,ex:'Weiche Pfotenballen und eingezogene Krallen machen kaum Geräusche – ideal zum Mäusefangen.'},
{id:'n80',g:'nutztier',topic:'Haus- und Nutztiere',d:1,q:'Wie heißt ein junges Rind?',opts:['Kalb','Fohlen','Ferkel','Lamm'],a:0,ex:'Kalb (Rind), Fohlen (Pferd), Ferkel (Schwein), Lamm (Schaf).'},
{id:'n81',g:'schilf',topic:'Lebensraum Bodensee',d:1,info:'Im Schilfgürtel am Ufer des Bodensees brüten viele Vögel wie Haubentaucher und Teichrohrsänger. Er ist auch die Kinderstube für junge Fische.',q:'Warum ist der Schilfgürtel am Ufer so wichtig?',opts:['Dort brüten Vögel und junge Fische wachsen auf','Dort parken die Boote','Er hält den See warm','Er macht das Wasser salzig'],a:0,ex:'Zwischen den Halmen sind Nester und Fischbrut gut versteckt. Deshalb darf man viele Schilfzonen nicht betreten.'},
{id:'n82',g:'schilf',topic:'Lebensraum Bodensee',d:2,info:'Im Winter rasten am Bodensee Zehntausende Wasservögel aus dem Norden, weil der See selten zufriert und sie dort Nahrung finden.',q:'Warum überwintern viele Wasservögel am Bodensee?',opts:['Der See friert selten zu, und sie finden Nahrung','Dort werden sie gefüttert','Es ist dort wärmer als in Afrika','Sie können nicht weiterfliegen'],a:0,ex:'Für Enten aus Skandinavien und Russland ist der Bodensee ein wichtiges Winterquartier.'},
{id:'n83',g:'anpass',topic:'Lebensraum Bodensee',d:2,info:'Lebewesen sind an ihren Lebensraum angepasst. Die Ente hat Schwimmhäute zum Paddeln und ein gefettetes Gefieder, das kein Wasser durchlässt.',q:'Wozu hat die Ente Schwimmhäute?',opts:['Zum Paddeln im Wasser','Zum Klettern','Zum Graben','Zum Fliegen'],a:0,ex:'Die Häute zwischen den Zehen wirken wie Paddel.'},
{id:'n84',g:'magnet3',topic:'Magnetismus',d:1,q:'Was passiert, wenn du einen Nordpol und einen Südpol aneinanderhältst?',opts:['Sie ziehen sich an','Sie stoßen sich ab','Nichts','Sie verlieren ihre Kraft'],a:0,ex:'Ungleiche Pole ziehen sich an, gleiche stoßen sich ab.'},
{id:'n85',g:'magnet3',topic:'Magnetismus',d:2,info:'Die Kraft eines Magneten wirkt auch durch Papier, Holz oder Wasser hindurch. Den Bereich, in dem sie wirkt, nennt man Magnetfeld.',q:'Wirkt ein Magnet auch durch ein Blatt Papier?',opts:['Ja, die Magnetkraft wirkt hindurch','Nein, Papier stoppt die Kraft','Nur wenn das Papier nass ist','Nur bei Sonnenlicht'],a:0,ex:'Deshalb halten Magnete Zettel am Kühlschrank fest.'},
{id:'n86',g:'magnet4',topic:'Magnetismus',d:3,info:'Bricht man einen Stabmagneten durch, entstehen zwei neue Magnete – jeder wieder mit einem Nord- und einem Südpol.',q:'Was passiert, wenn man einen Stabmagneten in der Mitte zerbricht?',opts:['Es entstehen zwei Magnete mit je zwei Polen','Ein Stück hat nur einen Nordpol, das andere nur einen Südpol','Beide Stücke verlieren ihren Magnetismus','Nur ein Stück bleibt magnetisch'],a:0,ex:'Einen einzelnen Pol allein gibt es nicht – jedes Stück hat wieder Nord und Süd.'},
{id:'n87',g:'strom3',topic:'Elektrizität',d:1,info:'Strom aus der Steckdose ist lebensgefährlich. Man fasst nie mit Gegenständen hinein und hält elektrische Geräte von Wasser fern. Mit kleinen Batterien kann man dagegen gefahrlos experimentieren.',q:'Was ist [[gefährlich]]?',opts:['Einen Föhn in der Badewanne benutzen','Eine Taschenlampe einschalten','Mit einer 4,5-Volt-Batterie experimentieren','Ein Ladegerät am Stecker herausziehen'],a:0,ex:'Wasser leitet Strom. Fällt ein Föhn ins Badewasser, fließt der Strom durch den Körper.'},
{id:'n88',g:'strom3',topic:'Elektrizität',d:2,info:'Ein Schalter öffnet oder schließt den Stromkreis. Ist er geschlossen, fließt Strom, und die Lampe leuchtet.',q:'Was macht ein Schalter im Stromkreis?',opts:['Er öffnet oder schließt den Stromkreis','Er erzeugt Strom','Er speichert Strom','Er macht die Lampe heller'],a:0,ex:'Schalter aus = Lücke im Stromkreis = kein Strom.'},
{id:'n89',g:'leiter2',topic:'Elektrizität',d:1,q:'Welcher Gegenstand leitet Strom?',opts:['Ein Eisennagel','Ein Radiergummi','Ein Holzstab','Ein Glasstab'],a:0,ex:'Metalle sind Leiter. Gummi, Holz und Glas sind Isolatoren.'},
{id:'n90',g:'licht3',topic:'Licht & Schall',d:1,info:'Lichtquellen erzeugen selbst Licht, zum Beispiel die Sonne, eine Kerze oder eine Lampe. Der Mond ist keine Lichtquelle – er wird nur von der Sonne angestrahlt.',q:'Was ist [[keine]] Lichtquelle?',opts:['Der Mond','Die Sonne','Eine Kerze','Eine Taschenlampe'],a:0,ex:'Der Mond wirft nur das Sonnenlicht zurück.'},
{id:'n91',g:'licht3',topic:'Licht & Schall',d:2,info:'Glatte, glänzende Flächen wie ein Spiegel werfen das Licht zurück. Das nennt man Reflexion.',q:'Warum siehst du dich im Spiegel?',opts:['Der Spiegel wirft das Licht zurück','Der Spiegel leuchtet selbst','Im Spiegel ist ein Bild gespeichert','Das Glas schluckt das Licht'],a:0,ex:'Licht fällt von dir auf den Spiegel und wird zu deinen Augen zurückgeworfen.'},
{id:'n92',g:'ton',topic:'Licht & Schall',d:1,info:'Hohe Töne entstehen durch schnelle Schwingungen, tiefe Töne durch langsame. Eine kurze, straff gespannte Saite klingt höher als eine lange, lockere.',q:'Welche Gitarrensaite klingt [[höher]]?',opts:['Eine kurze, straff gespannte','Eine lange, lockere','Beide gleich','Eine dicke, lockere'],a:0,ex:'Kurz und straff = schnelle Schwingung = hoher Ton.'},
{id:'n93',g:'ton',topic:'Licht & Schall',d:2,info:'Lärm kann das Gehör dauerhaft schädigen. Deshalb sollte man Kopfhörer nicht zu laut stellen und bei sehr lauten Geräuschen einen Gehörschutz tragen.',q:'Was schützt dein Gehör bei einem lauten Konzert [[am besten]]?',opts:['Gehörschutz tragen','Zusätzlich Kopfhörer mit Musik aufsetzen','Ganz vorne an den Lautsprechern stehen','Den Mund zuhalten'],a:0,ex:'Gehörschutz dämpft den Lärm. Ein geschädigtes Gehör heilt nicht wieder.'},
{id:'n94',g:'zustand3',topic:'Stoffe',d:1,q:'Welcher Stoff ist bei Zimmertemperatur gasförmig?',opts:['Luft','Wasser','Eisen','Holz'],a:0,ex:'Luft ist ein Gasgemisch. Wasser ist flüssig, Eisen und Holz sind fest.'},
{id:'n95',g:'zustand3',topic:'Stoffe',d:2,q:'Wie heißt der Übergang von fest zu flüssig?',opts:['Schmelzen','Erstarren','Verdampfen','Kondensieren'],a:0,ex:'Eis schmilzt zu Wasser. Erstarren ist der Weg zurück.'},
{id:'n96',g:'trennen3',topic:'Stoffe',d:1,q:'Womit trennst du Sand von Kieselsteinen am einfachsten?',opts:['Mit einem Sieb','Mit einem Magneten','Durch Verdampfen','Durch Schütteln'],a:0,ex:'Der feine Sand rieselt durch, die Kiesel bleiben im Sieb.'},
{id:'n97',g:'loesen',topic:'Stoffe',d:2,info:'Wasser ist ein gutes Lösungsmittel: Salz und Zucker lösen sich darin auf – in warmem Wasser schneller als in kaltem.',q:'Wo löst sich Zucker [[schneller]]?',opts:['In warmem Tee','In kaltem Tee','In Eiswasser','Überall gleich schnell'],a:0,ex:'In warmem Wasser bewegen sich die Teilchen schneller und lösen den Zucker rascher ab.'},
{id:'n98',g:'schnecke',topic:'Wirbellose',d:1,info:'Schnecken haben einen weichen Körper ohne Knochen und kriechen auf einem Schleimfilm. Viele tragen ein schützendes Haus, Nacktschnecken haben keins.',q:'Worauf kriecht eine Schnecke?',opts:['Auf einem Schleimfilm','Auf sechs Beinen','Auf Flossen','Auf Borsten'],a:0,ex:'Der Schleim schützt den Fuß der Schnecke und hilft beim Gleiten – sogar über scharfe Kanten.'},
{id:'n99',g:'biene',topic:'Wirbellose',d:2,info:'Bienen sammeln Nektar und Pollen. Dabei bestäuben sie die Blüten. Ohne Bienen gäbe es viel weniger Äpfel, Kirschen und Erdbeeren.',q:'Warum sind Bienen für die Obstbauern am Bodensee so wichtig?',opts:['Sie bestäuben die Blüten','Sie fressen Schädlinge','Sie lockern den Boden','Sie vertreiben Vögel'],a:0,ex:'Viele Obstbauern stellen im Frühling sogar Bienenstöcke in ihre Plantagen.'}
];

/* ---------- Mathe: Aufgaben-Generatoren ---------- */
const NAMES=['Lena','Tim','Ali','Mia','Jonas','Emma','Paul','Sofia','Ben','Lea'];
const MATH=[
{id:'m_zahl',topic:'Große Zahlen',d:[1,2],rule:'Große Zahlen liest man in Dreierpäckchen von rechts: Einer, Tausender, Millionen. Fehlt eine Stelle, steht dort eine 0 als Platzhalter.',
 gen(d){const m=r(1,d>1?99:9),t=r(1,99),e=r(1,999);const n=m*1e6+t*1e3+e;return{q:`Schreibe als Zahl: ${m===1?'1 Million':m+' Millionen'}, ${t} Tausend und ${e}`,ans:n,ex:`${m} Millionen = ${fmtA(m*1e6)}, ${t} Tausend = ${fmtA(t*1000)}, dazu ${e}. Zusammen: ${fmtA(n)}. Achte auf die Nullen als Platzhalter.`};}},
{id:'m_runden',topic:'Runden',d:[1,2],rule:'Beim Runden schaust du nur auf die Ziffer rechts neben der Rundungsstelle: Bei 0 bis 4 wird abgerundet, bei 5 bis 9 aufgerundet.',
 gen(d){const P=d===1?[[10,'Zehner'],[100,'Hunderter'],[1000,'Tausender']]:[[1000,'Tausender'],[10000,'Zehntausender'],[100000,'Hunderttausender']];const [p,nm]=pick(P);const n=d===1?r(1001,99999):r(100001,9999999);const dig=Math.floor((n%p)/(p/10));const ans=Math.round(n/p)*p;return{q:`Runde ${fmtA(n)} auf [[${nm}]].`,ans,ex:`Rechts neben der ${nm}stelle steht eine ${dig}. ${dig>=5?'Also aufrunden':'Also abrunden'}: ${fmtA(ans)}.`};}},
{id:'m_plusminus',topic:'Schriftlich rechnen',d:[1,2],rule:'Beim schriftlichen Rechnen stehen Einer unter Einern, Zehner unter Zehnern. Du rechnest von rechts nach links, Spalte für Spalte. Merkzahlen (Übertrag) schreibst du klein in die Übertrag-Zeile.',
 gen(d){const B=d===1?[1000,9999]:[10000,99999];let a=r(...B),b=r(...B);if(Math.random()<.5){if(b>a)[a,b]=[b,a];return{q:`Rechne schriftlich: ${fmtA(a)} − ${fmtA(b)}`,ans:a-b,col:{type:'add',a,b,op:'−'},ex:`${fmtA(a)} − ${fmtA(b)} = ${fmtA(a-b)}. Probe: ${fmtA(a-b)} + ${fmtA(b)} = ${fmtA(a)}.`};}return{q:`Rechne schriftlich: ${fmtA(a)} + ${fmtA(b)}`,ans:a+b,col:{type:'add',a,b,op:'+'},ex:`${fmtA(a)} + ${fmtA(b)} = ${fmtA(a+b)}. Probe: ${fmtA(a+b)} − ${fmtA(b)} = ${fmtA(a)}.`};}},
{id:'m_mal',topic:'Multiplizieren',d:[1,2,3],est:true,rule:'Erst überschlagen, dann schriftlich rechnen. Bei zweistelligen Faktoren rechnest du mit jeder Ziffer einzeln, schreibst die Teilergebnisse versetzt untereinander und addierst sie.',
 gen(d){let a,b;if(d===1){a=r(12,98);b=r(3,9);}else if(d===2){a=r(12,98);b=r(12,49);}else{a=r(102,899);b=r(12,49);}const ra=roundLead(a),rb=roundLead(b);return{q:`Rechne schriftlich: ${a} · ${b}`,ans:a*b,estRef:ra*rb,col:{type:'mul',a,b},ex:`Überschlag: ${ra} · ${rb} = ${fmtA(ra*rb)}. Genau: ${a} · ${b} = ${fmtA(a*b)}.`};}},
{id:'m_geteilt',topic:'Dividieren',d:[1,2,3],rule:'Dividieren ist die Umkehrung vom Multiplizieren. Probe: Ergebnis mal Teiler muss wieder die Ausgangszahl ergeben.',
 gen(d){const b=d===3?r(11,25):r(3,9);const c=d===1?r(12,99):r(102,999);const a=b*c;return{q:`Berechne: ${fmtA(a)} : ${b}`,ans:c,ex:`${fmtA(a)} : ${b} = ${c}. Probe: ${c} · ${b} = ${fmtA(a)}.`};}},
{id:'m_regeln',topic:'Rechenregeln',d:[1,2,3],rule:'Klammern zuerst, dann Punkt vor Strich (· und : vor + und −). Sonst rechnest du von links nach rechts.',
 gen(d){if(d===1){const b=r(2,9),c=r(2,9);if(Math.random()<.5){const a=r(2,30);return{q:`Berechne: ${a} + ${b} · ${c}`,ans:a+b*c,ex:`Punkt vor Strich: zuerst ${b} · ${c} = ${b*c}, dann ${a} + ${b*c} = ${a+b*c}. (Von links gerechnet käme fälschlich ${(a+b)*c} heraus.)`};}const a=b*c+r(1,30);return{q:`Berechne: ${a} − ${b} · ${c}`,ans:a-b*c,ex:`Punkt vor Strich: zuerst ${b} · ${c} = ${b*c}, dann ${a} − ${b*c} = ${a-b*c}.`};}
  if(d===2){const b=r(2,15),a=b+r(2,12),c=r(2,6),e=r(1,20);const v=(a-b)*c+e;return{q:`Berechne: (${a} − ${b}) · ${c} + ${e}`,ans:v,ex:`Klammer zuerst: ${a} − ${b} = ${a-b}. Dann Punkt vor Strich: ${a-b} · ${c} = ${(a-b)*c}. Zum Schluss + ${e} = ${v}.`};}
  const b=r(1,6),c=r(1,6),k=r(6,12),e=r(1,3),f=r(1,Math.floor(k/e));const a=(b+c)*k;const v=k-e*f;return{q:`Berechne: ${a} : (${b} + ${c}) − ${e} · ${f}`,ans:v,ex:`Klammer: ${b} + ${c} = ${b+c}. Punktrechnungen: ${a} : ${b+c} = ${k} und ${e} · ${f} = ${e*f}. Dann ${k} − ${e*f} = ${v}.`};}},
{id:'m_groessen',topic:'Größen umrechnen',d:[1,2,3],rule:[['1 km','1.000 m'],['1 m','100 cm'],['1 kg','1.000 g'],['1 t','1.000 kg'],['1 h','60 min'],['1 min','60 s']],
 gen(d){const T=[
  ()=>{const k=r(1,9),m=r(5,995);return{q:`Wie viele [[Meter]] sind ${k} km ${m} m?`,ans:k*1000+m,unit:'m',ex:`${k} km = ${fmtA(k*1000)} m. Dazu ${m} m ergibt ${fmtA(k*1000+m)} m.`};},
  ()=>{const k=r(1,9),g=r(5,995);return{q:`Wie viele [[Gramm]] sind ${k} kg ${g} g?`,ans:k*1000+g,unit:'g',ex:`${k} kg = ${fmtA(k*1000)} g. Dazu ${g} g ergibt ${fmtA(k*1000+g)} g.`};},
  ()=>{const h=r(1,4),m=r(5,55);return{q:`Wie viele [[Minuten]] sind ${h} h ${m} min?`,ans:h*60+m,unit:'min',ex:`${h} h = ${h*60} min. Dazu ${m} min ergibt ${h*60+m} min.`};},
  ()=>{const m=r(1,9),c=r(1,99);return{q:`Wie viele [[Zentimeter]] sind ${m} m ${c} cm?`,ans:m*100+c,unit:'cm',ex:`${m} m = ${m*100} cm. Dazu ${c} cm ergibt ${m*100+c} cm.${c<10?' Achtung: '+m+' m '+c+' cm sind '+(m*100+c)+' cm, nicht '+m+c+' cm.':''}`};}];
  const T3=[
  ()=>{const m=r(2,15),s=r(5,55);return{q:`Wie viele [[Sekunden]] sind ${m} min ${s} s?`,ans:m*60+s,unit:'s',ex:`${m} min = ${m*60} s. Dazu ${s} s ergibt ${m*60+s} s.`};},
  ()=>{const h=r(1,3),m=r(1,30);return{q:`Wie viele [[Sekunden]] sind ${h} h ${m} min?`,ans:(h*60+m)*60,unit:'s',ex:`${h} h ${m} min = ${h*60+m} min. Mal 60: ${fmtA((h*60+m)*60)} s.`};},
  ()=>{const t=r(2,9);return{q:`Wie viele [[Kilogramm]] sind ${t} t?`,ans:t*1000,unit:'kg',ex:`1 t = 1.000 kg, also ${t} t = ${fmtA(t*1000)} kg.`};}];
  return pick(d===3?T3.concat(T.slice(0,2)):T)();}},
{id:'m_sach',topic:'Sachaufgaben',d:[1,2,3],rule:'Lies Sachaufgaben zweimal. Frag dich: Was ist gegeben? Was ist gesucht? Welches Wort verrät mir, wie ich rechnen muss?',
 gen(d){const n1=pick(NAMES),n2=pick(NAMES.filter(x=>x!==n1));
  const T1=[
  ()=>{const a=r(20,60),b=r(4,15);return{q:`${n1} hat ${a} Sammelkarten. ${n2} hat ${b} [[weniger]] als ${n1}. Wie viele Karten hat ${n2}?`,ans:a-b,ex:`„${b} weniger“ heißt minus: ${a} − ${b} = ${a-b}.`};},
  ()=>{const a=r(6,15),k=pick([2,3,4]);const w={2:'doppelt',3:'dreimal',4:'viermal'}[k];return{q:`Ein Buch kostet ${a} €. Ein Spiel kostet [[${w}]] so viel. Wie viel kostet das Spiel?`,ans:a*k,unit:'€',ex:`„${w} so viel“ heißt mal ${k}: ${a} · ${k} = ${a*k} €.`};},
  ()=>{const q4=r(5,8),n=q4*4;return{q:`In einer Klasse sind ${n} Kinder. Ein Viertel davon fährt mit dem Bus. Wie viele Kinder fahren [[nicht]] mit dem Bus?`,ans:n-q4,ex:`Ein Viertel von ${n} sind ${q4} Kinder. Gefragt ist aber, wie viele NICHT Bus fahren: ${n} − ${q4} = ${n-q4}.`};},
  ()=>{const g=pick([20,30,50]),k=r(2,4),p=r(2,Math.floor((g-1)/k));return{q:`${n1} hat ${g} €. ${n1} kauft ${k} Hefte zu je ${p} €. Wie viel Geld bleibt [[übrig]]?`,ans:g-k*p,unit:'€',ex:`${k} Hefte kosten ${k} · ${p} = ${k*p} €. Übrig bleiben ${g} − ${k*p} = ${g-k*p} €.`};},
  ()=>{const h=r(8,16),m=r(5,40),dur=r(15,55);const e=h*60+m+dur;const t=(x)=>Math.floor(x/60)+':'+String(x%60).padStart(2,'0');return{q:`Der Bus fährt um ${t(h*60+m)} Uhr ab und kommt um ${t(e)} Uhr an. Wie viele [[Minuten]] dauert die Fahrt?`,ans:dur,unit:'min',ex:`Von ${t(h*60+m)} bis ${t(e)} Uhr sind es ${dur} Minuten. Tipp: Erst bis zur vollen Stunde zählen, dann den Rest dazu.`};},
  ()=>{const p=r(3,7),k=r(3,8);return{q:`Eine Fahrt mit der Bodensee-Fähre kostet für ein Kind ${p} €. Wie viel zahlen ${k} Kinder [[zusammen]]?`,ans:p*k,unit:'€',ex:`${k} Kinder · ${p} € = ${p*k} €.`};},
  ()=>{const l=pick([25,50]),k=r(2,8);return{q:`Ein Schwimmbecken ist ${l} m lang. ${n1} schwimmt ${k} Bahnen. Wie viele Meter sind das [[insgesamt]]?`,ans:l*k,unit:'m',ex:`${k} Bahnen · ${l} m = ${l*k} m.`};},
  ()=>{const a=r(12,35),b=r(8,30);return{q:`${n1} radelt am Bodensee vormittags ${a} km und nachmittags ${b} km. Wie viele Kilometer sind das [[insgesamt]]?`,ans:a+b,unit:'km',ex:`${a} km + ${b} km = ${a+b} km.`};}];
  const T2=[
  ()=>{const e=r(8,12),c=r(4,7),k=r(2,4);return{q:`Der Eintritt ins Pfahlbaumuseum kostet ${e} € für Erwachsene und ${c} € für Kinder. Was zahlt eine Familie mit 2 Erwachsenen und ${k} Kindern?`,ans:2*e+k*c,unit:'€',ex:`Erwachsene: 2 · ${e} = ${2*e} €. Kinder: ${k} · ${c} = ${k*c} €. Zusammen: ${2*e+k*c} €.`};},
  ()=>{const w=pick([3,4,5,6]);let g=r(25,60);if(g%w===0)g++;const ans=Math.ceil(g/w);return{q:`${n1} spart jede Woche ${w} €. Nach wie vielen Wochen hat ${n1} [[mindestens]] ${g} €?`,ans,ex:`${g} : ${w} = ${Math.floor(g/w)} Rest ${g%w}. Nach ${Math.floor(g/w)} Wochen fehlt also noch etwas – erst nach ${ans} Wochen reicht es.`};},
  ()=>{const m=r(20,45);return{q:`Ein Schiff fährt von Lindau nach Bregenz und braucht ${m} Minuten. Danach fährt es sofort zurück. Wie viele Minuten ist es [[insgesamt]] unterwegs?`,ans:2*m,unit:'min',ex:`Hin und zurück: 2 · ${m} = ${2*m} Minuten.`};},
  ()=>{const rows=r(12,22),s=r(15,28),f=r(40,rows*s-50);return{q:`Ein Kino hat ${rows} Reihen mit je ${s} Plätzen. ${f} Plätze sind frei. Wie viele Plätze sind [[besetzt]]?`,ans:rows*s-f,ex:`Alle Plätze: ${rows} · ${s} = ${rows*s}. Besetzt: ${rows*s} − ${f} = ${rows*s-f}.`};},
  ()=>{const per=pick([6,8,12]);let need=r(40,120);if(need%per===0)need++;const ans=Math.ceil(need/per);return{q:`Eine Kiste enthält ${per} Flaschen Saft. Für ein Fest braucht ihr ${need} Flaschen. Wie viele Kisten müsst ihr [[mindestens]] kaufen?`,ans,ex:`${need} : ${per} = ${Math.floor(need/per)} Rest ${need%per}. Für den Rest braucht ihr noch eine Kiste – also ${ans} Kisten.`};}];
  const T3=[
  ()=>{const l=r(8,20),b=r(5,12),p=pick([3,4,5]);return{q:`Ein Garten ist ${l} m lang und ${b} m breit. Er bekommt [[ringsum]] einen Zaun. Ein Meter Zaun kostet ${p} €. Wie viel kostet der Zaun?`,ans:2*(l+b)*p,unit:'€',ex:`Umfang: 2 · (${l} + ${b}) = ${2*(l+b)} m. Kosten: ${2*(l+b)} · ${p} = ${2*(l+b)*p} €.`};},
  ()=>{const a=r(8,20),s=r(15,3*a-5);return{q:`${n1} hat ${a} €. ${n2} hat doppelt so viel. Zusammen kaufen sie ein Spiel für ${s} €. Wie viel Geld haben sie danach [[noch]]?`,ans:3*a-s,unit:'€',ex:`${n2} hat 2 · ${a} = ${2*a} €. Zusammen haben sie ${3*a} €. Nach dem Kauf: ${3*a} − ${s} = ${3*a-s} €.`};},
  ()=>{const b=r(3,15),l=b*2;return{q:`Ein Rechteck ist ${l} cm lang und [[halb]] so breit. Wie groß ist sein Umfang?`,ans:2*(l+b),unit:'cm',ex:`Breite: ${l} : 2 = ${b} cm. Umfang = 2 · (${l} + ${b}) = ${2*(l+b)} cm.`};},
  ()=>{const each=r(15,40),k=3,sp=r(4,12);return{q:`Drei Freunde teilen sich ${each*k} € gleichmäßig. ${n1} gibt danach ${sp} € aus. Wie viel Geld hat ${n1} [[noch]]?`,ans:each-sp,unit:'€',ex:`Jeder bekommt ${each*k} : 3 = ${each} €. ${n1} hat noch ${each} − ${sp} = ${each-sp} €.`};}];
  const pool=d===1?T1:d===2?T1.concat(T2,T2):T2.concat(T3,T3);return pick(pool)();}},
{id:'m_rechteck',topic:'Umfang & Fläche',d:[1,2,3],rule:'Umfang = einmal außen herum: 2 · (Länge + Breite). Flächeninhalt = Länge · Breite, gemessen in Quadrat-Einheiten wie cm².',
 gen(d){if(d===3&&Math.random()<.5){const s=r(3,12);return{q:`Ein Quadrat hat einen Flächeninhalt von ${s*s} cm². Wie groß ist sein [[Umfang]]?`,ans:4*s,unit:'cm',ex:`${s} · ${s} = ${s*s}, also ist eine Seite ${s} cm lang. Umfang = 4 · ${s} = ${4*s} cm.`};}
  const l=r(4,d===1?12:25),b=r(2,l-1);if(Math.random()<.5)return{q:`Ein Rechteck ist ${l} cm lang und ${b} cm breit. Berechne den [[Flächeninhalt]].`,ans:l*b,unit:'cm²',ex:`Flächeninhalt = Länge · Breite = ${l} · ${b} = ${l*b} cm². (Der Umfang wäre ${2*(l+b)} cm.)`};
  return{q:`Ein Rechteck ist ${l} cm lang und ${b} cm breit. Berechne den [[Umfang]].`,ans:2*(l+b),unit:'cm',ex:`Umfang = 2 · (${l} + ${b}) = ${2*(l+b)} cm. (Der Flächeninhalt wäre ${l*b} cm².)`};}},
{id:'m_teilbar',topic:'Teilbarkeit',d:[2,3],rule:'Durch 2: letzte Ziffer gerade. Durch 5: endet auf 0 oder 5. Durch 3: Quersumme durch 3 teilbar. Durch 9: Quersumme durch 9 teilbar.',
 gen(d){const t=d===2?pick([3,5]):pick([3,9]);const qs=n=>String(n).split('').reduce((a,c)=>a+ +c,0);let n;do{n=r(100,9999);}while(n%t);const wrong=new Set();let guard=0;while(wrong.size<3&&guard++<500){const x=r(100,9999);if(x%t===0)continue;if(t===9&&wrong.size<2&&x%3)continue;wrong.add(x);}
  const opts=[n,...wrong].map(fmtA);const ex=t===5?`${fmtA(n)} endet auf ${n%10} – deshalb durch 5 teilbar. Die anderen enden nicht auf 0 oder 5.`:`Quersumme von ${fmtA(n)}: ${String(n).split('').join(' + ')} = ${qs(n)}. ${qs(n)} ist durch ${t} teilbar.${t===9?' Vorsicht: Durch 3 teilbar heißt noch nicht durch 9 teilbar!':''}`;
  return{q:`Welche Zahl ist durch ${t} teilbar?`,opts,a:0,ex};}},
{id:'m_negativ',topic:'Negative Zahlen',d:[3],rule:'Auf dem Zahlenstrahl liegen negative Zahlen links von der 0. Plus heißt: nach rechts gehen. Minus heißt: nach links gehen.',
 gen(){if(Math.random()<.5){const t=r(2,9),s=r(3,15);return{q:`Morgens ist es −${t} °C. Bis mittags [[steigt]] die Temperatur um ${s} Grad. Wie warm ist es mittags?`,ans:s-t,unit:'°C',ex:`Von −${t} aus ${s} Schritte nach rechts: −${t} + ${s} = ${fmtN(s-t)} °C.`};}
  const a=r(2,12),b=a+r(1,10);return{q:`Berechne: ${a} − ${b}`,ans:a-b,ex:`Von ${a} aus ${b} Schritte nach links: Nach ${a} Schritten bist du bei 0, dann noch ${b-a} weiter – also ${fmtN(a-b)}.`};}},
{id:'m_potenz',topic:'Potenzen',d:[3],rule:'Eine Potenz ist eine Kurzschreibweise: 2⁴ = 2 · 2 · 2 · 2. Die kleine Zahl oben sagt, wie oft die Grundzahl mit sich selbst malgenommen wird.',
 gen(){const P=[[2,r(3,7)],[3,r(2,4)],[5,r(2,3)],[10,r(2,6)],[4,r(2,3)]];const [b,e]=pick(P);const v=Math.pow(b,e);return{q:`Berechne: ${b}${sup(e)}`,ans:v,ex:`${b}${sup(e)} = ${Array(e).fill(b).join(' · ')} = ${fmtA(v)}. Nicht verwechseln mit ${b} · ${e} = ${b*e}!`};}},
{id:'m_teiler',topic:'Teiler & Vielfache',d:[1,2,3],rule:'Ein Teiler teilt eine Zahl ohne Rest: 4 ist ein Teiler von 12, weil 12 : 4 = 3. Vielfache entstehen durch Malnehmen: Die Vielfachen von 4 sind 4, 8, 12, 16 …',
 gen(d){const divs=n=>{const a=[];for(let i=1;i<=n;i++)if(n%i===0)a.push(i);return a;};
  if(d===1){const n=pick([12,18,20,24,30,36,40,42,45,48]);const D=divs(n);const t=pick(D.filter(x=>x>1&&x<n));const W=shuffle(Array.from({length:n-3},(_,i)=>i+2).filter(x=>n%x)).slice(0,3);return{q:`Welche Zahl ist ein Teiler von ${n}?`,opts:[t,...W].map(String),a:0,ex:`${n} : ${t} = ${n/t} – ohne Rest. Alle Teiler von ${n}: ${D.join(', ')}.`};}
  if(d===2){const n=pick([12,16,18,20,24,28,30,36]);const D=divs(n);const pairs=[];for(let i=0;i<Math.ceil(D.length/2);i++)pairs.push(D[i]+' · '+D[D.length-1-i]);return{q:`Wie viele Teiler hat ${n}? (1 und ${n} zählen mit.)`,ans:D.length,ex:`Such Teiler-Paare: ${pairs.join(', ')}. Das ergibt die Teiler ${D.join(', ')} – also ${D.length} Stück.`};}
  const [a,b]=pick([[4,6],[6,8],[6,9],[4,10],[8,12],[9,12],[10,15],[6,10],[12,18]]);const g=(x,y)=>y?g(y,x%y):x;const l=a*b/g(a,b);const va=[],vb=[];for(let k=1;a*k<=l;k++)va.push(a*k);for(let k=1;b*k<=l;k++)vb.push(b*k);
  return{q:`Was ist das [[kleinste]] gemeinsame Vielfache von ${a} und ${b}?`,ans:l,ex:`Vielfache von ${a}: ${va.join(', ')} … Vielfache von ${b}: ${vb.join(', ')} … Die kleinste Zahl, die in beiden Listen vorkommt, ist ${l}.`};}},
{id:'m_folge',topic:'Zahlenfolgen',d:[1,2,3],rule:'Bei Zahlenfolgen suchst du die Regel: Was passiert von einer Zahl zur nächsten – plus, minus oder mal? Prüf deine Regel an allen Zahlen, bevor du weiterrechnest.',
 gen(d){let s,rule;const F=k=>[0,1,2,3,4].map(k);
  const T1=[()=>{const a=r(2,30),k=r(3,12);s=F(i=>a+i*k);rule=`immer + ${k}`;},()=>{const k=r(3,9),a=k*r(8,15);s=F(i=>a-i*k);rule=`immer − ${k}`;}];
  const T2=[()=>{const a=r(1,6);s=F(i=>a*Math.pow(2,i));rule='immer · 2';},()=>{const a=r(5,40),k=r(11,25);s=F(i=>a+i*k);rule=`immer + ${k}`;}];
  const T3=[()=>{const a=r(2,10),p=r(4,9),m=r(1,p-1);s=[a];for(let i=0;i<4;i++)s.push(s[i]+(i%2?-m:p));rule=`abwechselnd + ${p} und − ${m}`;},()=>{const a=r(1,10);s=[a];for(let i=1;i<5;i++)s.push(s[i-1]+i);rule='+ 1, + 2, + 3, + 4 – der Abstand wird jedes Mal um 1 größer';},()=>{const a=r(1,4);s=F(i=>a*Math.pow(3,i));rule='immer · 3';}];
  pick(d===1?T1:d===2?T1.concat(T2,T2):T2.concat(T3,T3))();
  const sh=s.slice(0,4),ans=s[4];return{q:`Setze die Folge fort: ${sh.map(fmtA).join(', ')}, …`,ans,ex:`Die Regel: ${rule}. Nach ${fmtA(sh[3])} kommt also ${fmtA(ans)}.`};}},
{id:'m_strahl',topic:'Zahlenstrahl',d:[1,2,3],rule:'Auf dem Zahlenstrahl sind alle Abschnitte gleich groß. Rechne zuerst aus, wie viel ein Abschnitt wert ist: Abstand von Anfang bis Ende geteilt durch die Zahl der Abschnitte. Dann zählst du die Striche bis zum Pfeil.',
 gen(d){let a,s;const n=10;
  if(d===1){a=0;s=pick([1,2,5,10]);}else if(d===2){a=pick([0,100,1000,2000,5000]);s=pick([10,20,25,50,100,200,500]);}else{s=pick([1,2,5,10]);a=-5*s;}
  const b=a+n*s;let pos=r(1,n-1);if(d===3&&a+pos*s===0)pos++;const ans=a+pos*s;
  const X=i=>14+272*i/n;let g='';for(let i=0;i<=n;i++)g+=`<line x1="${X(i)}" y1="${i%5?29:26}" x2="${X(i)}" y2="${i%5?39:42}" stroke="currentColor" stroke-width="${i%5?1.5:2}"/>`;
  const lab=(i,v)=>`<text x="${X(i)}" y="58" text-anchor="middle" font-size="13" fill="currentColor">${fmtN(v)}</text>`;
  const svg=`<svg viewBox="0 0 300 62" style="display:block;width:100%;max-width:360px;margin:14px 0 2px;color:var(--text)" role="img" aria-label="Zahlenstrahl von ${fmtN(a)} bis ${fmtN(b)} in ${n} gleichen Abschnitten, ein Pfeil zeigt auf einen Strich"><line x1="14" y1="34" x2="286" y2="34" stroke="currentColor" stroke-width="2"/>${g}${lab(0,a)}${lab(n,b)}<path d="M${X(pos)-6} 8 L${X(pos)+6} 8 L${X(pos)} 21 Z" fill="var(--bad)"/></svg>`;
  return{q:`Welche Zahl zeigt der rote Pfeil?${svg}`,ans,ex:`Von ${fmtN(a)} bis ${fmtN(b)} sind es ${n} Abschnitte, also ist ein Abschnitt ${fmtN(b-a)} : ${n} = ${s} groß. Der Pfeil steht am ${pos}. Strich: ${fmtN(a)} + ${pos} · ${s} = ${fmtN(ans)}.`};}},
{id:'m_diagramm',topic:'Diagramme',d:[1,2,3],rule:'Bei einem Säulendiagramm liest du die Höhe jeder Säule an der Achse links ab: Fahre mit dem Finger von der Spitze der Säule waagrecht nach links bis zur Zahl.',
 gen(d){const T=pick([['Lieblingssport',['Fußball','Schwimmen','Turnen','Tennis']],['Lieblingsfach',['Mathe','Deutsch','Sport','Kunst']],['Lieblingstier',['Hund','Katze','Pferd','Hase']],['Lieblingseis',['Vanille','Schoko','Erdbeere','Zitrone']]]);
  const [thema,cats]=T;const v=cats.map(()=>r(1,12));
  const y=val=>140-val*10;let g='';for(let k=0;k<=12;k++)g+=`<line x1="34" y1="${y(k)}" x2="292" y2="${y(k)}" stroke="currentColor" stroke-opacity="${k%2?.12:.25}"/>`+(k%2?'':`<text x="26" y="${y(k)+4}" text-anchor="end" font-size="11" fill="currentColor">${k}</text>`);
  const bars=cats.map((c,i)=>{const x=46+i*62;return`<rect x="${x}" y="${y(v[i])}" width="40" height="${v[i]*10}" fill="var(--acc)"/><text x="${x+20}" y="156" text-anchor="middle" font-size="11" fill="currentColor">${c}</text>`;}).join('');
  const svg=`<svg viewBox="0 0 300 162" style="display:block;width:100%;max-width:360px;margin:14px 0 2px;color:var(--text)" role="img" aria-label="Säulendiagramm ${thema}: ${cats.map((c,i)=>c+' '+v[i]).join(', ')}">${g}<line x1="34" y1="140" x2="292" y2="140" stroke="currentColor" stroke-width="1.5"/>${bars}</svg>`;
  const intro=`Die Klasse 5b hat über ihr ${thema} abgestimmt.`;const list=cats.map((c,i)=>`${c} ${v[i]}`).join(', ');
  if(d===1){const i=r(0,3);return{q:`${intro} Wie viele Kinder haben „${cats[i]}“ gewählt?${svg}`,ans:v[i],ex:`Die Säule „${cats[i]}“ reicht bis ${v[i]}. Alle Werte: ${list}.`};}
  if(d===2){let i,j,guard=0;do{i=r(0,3);j=r(0,3);}while((i===j||v[i]<=v[j])&&guard++<100);if(v[i]<=v[j]){v[i]=v[j]+r(1,3);return this.gen(1);}
   return{q:`${intro} Wie viele Kinder [[mehr]] haben „${cats[i]}“ als „${cats[j]}“ gewählt?${svg}`,ans:v[i]-v[j],ex:`„${cats[i]}“: ${v[i]}, „${cats[j]}“: ${v[j]}. Unterschied: ${v[i]} − ${v[j]} = ${v[i]-v[j]}.`};}
  const sum=v.reduce((a,b)=>a+b,0);return{q:`${intro} Wie viele Kinder haben [[insgesamt]] abgestimmt?${svg}`,ans:sum,ex:`Alle Säulen zusammenzählen: ${v.join(' + ')} = ${sum}.`};}}
];

/* ---------- Deutsch ---------- */
const DE=[
{id:'d01',g:'wortart',topic:'Wortarten',d:1,info:'Nomen (Namenwörter) bezeichnen Lebewesen, Dinge und Gedachtes – man schreibt sie groß. Verben (Tunwörter) sagen, was jemand tut oder was geschieht. Adjektive (Wiewörter) beschreiben, wie etwas ist.',q:'Welches Wort ist im Satz „Der kleine Hund bellt laut.“ das Verb?',opts:['bellt','Hund','kleine','laut'],a:0,ex:'„bellt“ sagt, was der Hund tut – das ist das Verb. „Hund“ ist ein Nomen, „kleine“ und „laut“ sind Adjektive.'},
{id:'d02',g:'wortart',topic:'Wortarten',d:2,info:'Auch Gefühle und Gedachtes sind Nomen, obwohl man sie nicht anfassen kann – zum Beispiel die Freude, der Mut, die Idee. Ein guter Test: Passt ein Artikel davor (der, die, das)?',q:'Welches dieser Wörter ist ein Nomen?',opts:['Angst','ängstlich','ängstigen','bange'],a:0,ex:'Man kann „die Angst“ sagen – also ist „Angst“ ein Nomen. „ängstlich“ und „bange“ sind Adjektive, „ängstigen“ ist ein Verb.'},
{id:'d03',g:'adjektiv',topic:'Wortarten',d:1,info:'Adjektive kann man steigern: Grundform (schnell), Vergleichsstufe (schneller), Höchststufe (am schnellsten). Manche Adjektive steigert man unregelmäßig.',q:'Wie lautet die Höchststufe von „gut“?',opts:['am besten','am gutesten','besser','am güteren'],a:0,ex:'„gut“ wird unregelmäßig gesteigert: gut – besser – am besten. „besser“ ist nur die Vergleichsstufe.'},
{id:'d04',g:'pronomen',topic:'Wortarten',d:2,info:'Pronomen (Fürwörter) stehen für ein Nomen, damit man es nicht ständig wiederholen muss. Statt „Lisa liest. Lisa lacht.“ sagt man „Lisa liest. Sie lacht.“',q:'Welches Wort ist im Satz „Tom ruft seinen Bruder, weil er Hilfe braucht.“ ein Pronomen?',opts:['er','ruft','Hilfe','weil'],a:0,ex:'„er“ steht für Tom – es ersetzt das Nomen. „weil“ ist eine Konjunktion, sie verbindet zwei Sätze.'},
{id:'d05',g:'satzglied',topic:'Satzglieder',d:2,info:'Das Subjekt ist der Satzteil, der etwas tut oder über den etwas gesagt wird. Du findest es mit der Frage „Wer oder was?“. Beispiel: „Der Zug fährt ab.“ – Wer oder was fährt ab? Der Zug.',q:'Was ist im Satz „Am Morgen bellt der Hund des Nachbarn.“ das Subjekt?',opts:['der Hund des Nachbarn','Am Morgen','bellt','des Nachbarn'],a:0,ex:'Wer oder was bellt? Der Hund des Nachbarn. „Am Morgen“ steht zwar vorne, sagt aber nur, wann etwas passiert.'},
{id:'d06',g:'satzglied',topic:'Satzglieder',d:1,info:'Das Prädikat ist das Verb im Satz. Es sagt, was geschieht. In einem Aussagesatz steht es immer an zweiter Stelle: „Morgen fahren wir an den See.“',q:'Was ist im Satz „Im Sommer schwimmen wir im Bodensee.“ das Prädikat?',opts:['schwimmen','wir','Im Sommer','im Bodensee'],a:0,ex:'„schwimmen“ sagt, was geschieht. Es steht an zweiter Stelle – nach „Im Sommer“.'},
{id:'d07',g:'objekt',topic:'Satzglieder',d:3,info:'Das Akkusativobjekt erfragst du mit „Wen oder was?“, das Dativobjekt mit „Wem?“. Beispiel: „Ich schenke meiner Schwester (Wem?) ein Buch (Wen oder was?).“',q:'Welches Satzglied ist im Satz „Der Lehrer gibt dem Schüler das Heft.“ das [[Dativobjekt]]?',opts:['dem Schüler','das Heft','Der Lehrer','gibt'],a:0,ex:'Wem gibt der Lehrer das Heft? Dem Schüler – das ist das Dativobjekt. „das Heft“ ist das Akkusativobjekt (Wen oder was?).'},
{id:'d08',g:'dass',topic:'Rechtschreibung',d:2,info:'„dass“ mit ss verbindet zwei Sätze. „das“ ist Artikel oder Pronomen. Test: Kannst du „dieses“, „welches“ oder „jenes“ einsetzen, schreibst du „das“ – sonst „dass“.',q:'Was ist richtig? „Ich hoffe, ___ du morgen kommst.“',opts:['dass','das'],a:0,ex:'„Ich hoffe, welches du morgen kommst“ ergibt keinen Sinn. Also schreibst du „dass“.'},
{id:'d09',g:'dass',topic:'Rechtschreibung',d:2,info:'„das“ kann einen Satz einleiten, der ein Nomen genauer beschreibt: „Das Haus, das dort steht, ist alt.“ Test: Passt „welches“, dann schreibst du „das“.',q:'Was ist richtig? „Das Fahrrad, ___ dort steht, gehört mir.“',opts:['das','dass'],a:0,ex:'„Das Fahrrad, welches dort steht …“ passt. Also schreibst du „das“ mit einem s.'},
{id:'d10',g:'gross',topic:'Rechtschreibung',d:2,info:'Auch Verben und Adjektive werden großgeschrieben, wenn sie als Nomen gebraucht werden. Ein Signal ist oft ein Wort davor: das Laufen, beim Essen, etwas Schönes.',q:'In welchem Satz ist alles richtig geschrieben?',opts:['Beim Laufen bekomme ich Durst.','Beim laufen bekomme ich Durst.','beim Laufen bekomme ich durst.','Beim Laufen bekomme ich durst.'],a:0,ex:'„beim“ ist ein Signal: „Laufen“ wird hier als Nomen gebraucht und großgeschrieben. „Durst“ ist ein Nomen und sowieso groß.'},
{id:'d11',g:'ss',topic:'Rechtschreibung',d:2,info:'Nach einem kurzen Selbstlaut schreibt man oft ss: Fluss, essen, Kuss. Nach einem langen Selbstlaut oder nach ei, au, eu schreibt man ß: Fuß, heiß, draußen.',q:'Welches Wort ist richtig geschrieben?',opts:['die Straße','die Strasse','der Fluß','heis'],a:0,ex:'„Straße“ hat ein langes a, also ß. „Fluss“ hat ein kurzes u, also ss. „heiß“ braucht ein ß nach ei.'},
{id:'d12',g:'ie',topic:'Rechtschreibung',d:1,info:'Ein lang gesprochenes i schreibt man meistens als ie: Spiel, Brief, Wiese. Einige Ausnahmen muss man sich merken: Igel, Tiger, Kino, mir, dir.',q:'Welches Wort ist [[falsch]] geschrieben?',opts:['Tieger','Spiel','Brief','Wiese'],a:0,ex:'„Tiger“ ist eine Ausnahme und wird ohne e geschrieben. Die anderen drei sind richtig.'},
{id:'d13',g:'zeit',topic:'Zeitformen',d:2,info:'Das Präteritum benutzt man vor allem beim Erzählen und Schreiben: ich lief, er sang. Das Perfekt benutzt man meist beim Sprechen: ich bin gelaufen, er hat gesungen.',q:'In welcher Zeitform steht „Wir sind ins Kino gegangen.“?',opts:['Perfekt','Präteritum','Präsens','Futur'],a:0,ex:'„sind … gegangen“ besteht aus zwei Teilen (Hilfsverb + Partizip) – das ist das Perfekt. Im Präteritum hieße es „Wir gingen ins Kino.“'},
{id:'d14',g:'zeit',topic:'Zeitformen',d:1,info:'Viele Verben bilden das Präteritum unregelmäßig: sehen – sah, finden – fand, singen – sang. Diese starken Verben muss man sich merken.',q:'Wie heißt das Präteritum von „ich laufe“?',opts:['ich lief','ich laufte','ich bin gelaufen','ich lauf'],a:0,ex:'„laufen“ ist ein starkes Verb: ich laufe – ich lief. „ich bin gelaufen“ ist Perfekt.'},
{id:'d15',g:'futur',topic:'Zeitformen',d:2,info:'Das Futur bildet man mit „werden“ und der Grundform des Verbs: ich werde lesen, sie wird kommen.',q:'Welcher Satz steht im Futur?',opts:['Morgen werden wir einen Ausflug machen.','Morgen machen wir einen Ausflug.','Gestern machten wir einen Ausflug.','Wir haben einen Ausflug gemacht.'],a:0,ex:'Nur der erste Satz hat „werden“ + Grundform. „Morgen machen wir …“ meint zwar die Zukunft, steht aber im Präsens.'},
{id:'d16',g:'komma',topic:'Zeichensetzung',d:1,info:'Bei Aufzählungen trennt man die Wörter mit Komma. Vor „und“ und „oder“ steht dabei kein Komma: Ich kaufe Äpfel, Birnen und Bananen.',q:'Welcher Satz ist richtig?',opts:['Wir brauchen Mehl, Eier und Milch.','Wir brauchen Mehl, Eier, und Milch.','Wir brauchen, Mehl, Eier und Milch.','Wir brauchen Mehl Eier und Milch.'],a:0,ex:'Zwischen „Mehl“ und „Eier“ kommt ein Komma, vor „und“ nicht.'},
{id:'d17',g:'rede',topic:'Zeichensetzung',d:2,info:'Wörtliche Rede steht in Anführungszeichen. Steht der Begleitsatz vorne, folgt ein Doppelpunkt: Mia sagt: „Ich komme mit.“',q:'Welche Zeichensetzung ist richtig?',opts:['Paul ruft: „Warte auf mich!“','Paul ruft „Warte auf mich!“','Paul ruft: Warte auf mich!','Paul ruft, „Warte auf mich!“'],a:0,ex:'Begleitsatz vorne → Doppelpunkt, dann die wörtliche Rede in Anführungszeichen.'},
{id:'d18',g:'komma',topic:'Zeichensetzung',d:3,info:'Nebensätze werden vom Hauptsatz durch ein Komma getrennt. Sie beginnen oft mit Wörtern wie weil, dass, wenn, als oder obwohl – das Verb steht am Ende.',q:'Wo fehlt im Satz „Ich bleibe zu Hause weil es regnet.“ das Komma?',opts:['Vor „weil“','Nach „Ich“','Vor „regnet“','Es fehlt keins'],a:0,ex:'„weil es regnet“ ist ein Nebensatz. Er wird mit einem Komma abgetrennt: „Ich bleibe zu Hause, weil es regnet.“'},
{id:'d19',g:'familie',topic:'Wortschatz',d:1,info:'Zu einer Wortfamilie gehören Wörter mit demselben Wortstamm, zum Beispiel: fahren, Fahrer, Fahrrad, Abfahrt.',q:'Welches Wort gehört [[nicht]] zur Wortfamilie „spielen“?',opts:['spülen','Spieler','Spielplatz','verspielt'],a:0,ex:'„spülen“ sieht ähnlich aus, hat aber einen anderen Stamm (spül-). Alle anderen enthalten „spiel“.'},
{id:'d20',g:'synonym',topic:'Wortschatz',d:2,info:'Wörter mit gleicher oder ähnlicher Bedeutung nennt man Synonyme. Sie machen Texte abwechslungsreicher: statt immer „sagen“ zum Beispiel „antworten“, „flüstern“ oder „rufen“.',q:'Welches Wort ist ein Synonym für „schnell“?',opts:['rasch','langsam','laut','schwer'],a:0,ex:'„rasch“ bedeutet dasselbe wie „schnell“. „langsam“ ist das Gegenteil.'},
{id:'d21',g:'fall',topic:'Grammatik',d:3,info:'Nomen stehen in einem von vier Fällen: Nominativ (Wer oder was?), Genitiv (Wessen?), Dativ (Wem?) und Akkusativ (Wen oder was?).',q:'In welchem Fall steht „des Lehrers“ im Satz „Das ist das Auto des Lehrers.“?',opts:['Genitiv','Nominativ','Dativ','Akkusativ'],a:0,ex:'Wessen Auto? Das Auto des Lehrers – die Frage „Wessen?“ zeigt den Genitiv.'},
{id:'d22',g:'maerchen',topic:'Texte',d:1,info:'Märchen erkennst du an typischen Merkmalen: Sie beginnen oft mit „Es war einmal“, spielen an keinem genauen Ort und zu keiner genauen Zeit, es gibt Zauberei und sprechende Tiere, und das Gute siegt.',q:'Welches Merkmal passt [[nicht]] zu einem Märchen?',opts:['Es spielt an einem genauen Datum in einer echten Stadt','Es beginnt mit „Es war einmal“','Tiere können sprechen','Das Gute siegt am Ende'],a:0,ex:'Märchen spielen „irgendwann, irgendwo“. Ein genaues Datum und ein echter Ort passen eher zu einem Bericht.'},
{id:'d23',g:'wortart',topic:'Wortarten',d:1,q:'Welches Wort ist ein Adjektiv?',opts:['mutig','Mut','ermutigen','Mutprobe'],a:0,ex:'„mutig“ beschreibt, wie jemand ist – ein Adjektiv. „Mut“ und „Mutprobe“ sind Nomen, „ermutigen“ ist ein Verb.'},
{id:'d24',g:'artikel',topic:'Wortarten',d:1,info:'Artikel begleiten Nomen. Bestimmte Artikel sind der, die, das. Unbestimmte Artikel sind ein und eine.',q:'Welcher Artikel ist ein [[unbestimmter]] Artikel?',opts:['eine','die','das','der'],a:0,ex:'„eine“ lässt offen, welche Sache genau gemeint ist: eine Katze – irgendeine. „die Katze“ meint eine bestimmte.'},
{id:'d25',g:'artikel',topic:'Wortarten',d:2,info:'Präpositionen (Verhältniswörter) zeigen, wie Dinge zueinander stehen – räumlich oder zeitlich: auf, unter, neben, vor, nach, während.',q:'Welches Wort ist im Satz „Die Katze schläft unter dem Tisch.“ eine Präposition?',opts:['unter','schläft','Katze','dem'],a:0,ex:'„unter“ zeigt, wo die Katze im Verhältnis zum Tisch ist. „dem“ ist ein Artikel.'},
{id:'d26',g:'adjektiv',topic:'Wortarten',d:2,q:'Welche Steigerung ist richtig?',opts:['viel – mehr – am meisten','viel – vieler – am vielsten','viel – mehr – am mehrsten','viel – meist – am mehrsten'],a:0,ex:'„viel“ wird unregelmäßig gesteigert, genau wie „gut – besser – am besten“.'},
{id:'d27',g:'konj',topic:'Wortarten',d:3,info:'Konjunktionen verbinden Wörter oder Sätze. „und, oder, aber, denn“ verbinden gleichrangige Sätze. „weil, dass, obwohl, wenn“ leiten Nebensätze ein – dann rutscht das Verb ans Ende.',q:'Welcher Satz ist richtig gebaut?',opts:['Ich gehe heim, weil ich müde bin.','Ich gehe heim, weil ich bin müde.','Ich gehe heim, weil bin ich müde.','Ich gehe heim weil, ich müde bin.'],a:0,ex:'Nach „weil“ steht das Verb am Ende: „…, weil ich müde bin.“ Das Komma steht vor „weil“.'},
{id:'d28',g:'satzart',topic:'Satzarten',d:1,info:'Es gibt Aussagesätze, Fragesätze und Aufforderungssätze. Fragesätze enden mit einem Fragezeichen und beginnen oft mit einem Fragewort oder dem Verb.',q:'Welche Satzart ist „Wann beginnt das Training?“',opts:['Fragesatz','Aussagesatz','Aufforderungssatz','Ausrufesatz'],a:0,ex:'Fragewort „Wann“ und Fragezeichen am Ende – ein Fragesatz.'},
{id:'d29',g:'satzglied',topic:'Satzglieder',d:2,info:'Satzglieder findest du mit der Umstellprobe: Wörter, die beim Umstellen immer zusammenbleiben, bilden ein Satzglied. „Mein Opa / liest / jeden Abend / die Zeitung.“ – „Jeden Abend / liest / mein Opa / die Zeitung.“',q:'Wie viele Satzglieder hat der Satz „Meine kleine Schwester malt heute ein Bild.“?',opts:['4','5','6','7'],a:0,ex:'Meine kleine Schwester / malt / heute / ein Bild. Umstellprobe: „Heute malt meine kleine Schwester ein Bild.“ – vier Satzglieder.'},
{id:'d30',g:'objekt',topic:'Satzglieder',d:2,info:'Das Akkusativobjekt erfragst du mit „Wen oder was?“. Beispiel: „Ich lese ein Buch.“ – Wen oder was lese ich? Ein Buch.',q:'Was ist im Satz „Lisa füttert den Hund.“ das Akkusativobjekt?',opts:['den Hund','Lisa','füttert','Es gibt keins'],a:0,ex:'Wen oder was füttert Lisa? Den Hund. „Lisa“ ist das Subjekt (Wer oder was?).'},
{id:'d31',g:'adverb',topic:'Satzglieder',d:3,info:'Adverbiale Bestimmungen geben die Umstände an: der Zeit (Wann?), des Ortes (Wo?), der Art und Weise (Wie?) und des Grundes (Warum?).',q:'Welche Frage passt zu „wegen des Regens“ im Satz „Wegen des Regens fällt das Spiel aus.“?',opts:['Warum?','Wann?','Wo?','Wie?'],a:0,ex:'Warum fällt das Spiel aus? Wegen des Regens – eine adverbiale Bestimmung des Grundes.'},
{id:'d32',g:'ss',topic:'Rechtschreibung',d:1,q:'Welches Wort ist richtig geschrieben?',opts:['der Fuß','der Fuss','der Fus','der Fuhs'],a:0,ex:'Langes u, also ß: der Fuß. Übrigens: In der Schweiz gibt es gar kein ß – dort schreibt man „Fuss“. In Deutschland aber nicht.'},
{id:'d33',g:'dehn',topic:'Rechtschreibung',d:2,info:'Ein langer Selbstlaut wird manchmal durch ein Dehnungs-h markiert – oft vor l, m, n oder r: Zahl, nehmen, Lehrer, Uhr. Viele Wörter haben aber gar kein Dehnungszeichen: Tal, holen, Name.',q:'Welches Wort ist [[falsch]] geschrieben?',opts:['der Nahme','die Zahl','der Lehrer','die Uhr'],a:0,ex:'„Name“ hat kein Dehnungs-h. Am besten lernt man solche Wörter als Merkwörter.'},
