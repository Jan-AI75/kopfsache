const EK=[
{id:'k01',g:'kont',topic:'Erde',d:1,info:'Die Erde hat sieben Kontinente: Asien, Afrika, Nordamerika, Südamerika, Antarktika, Europa und Australien. Australien ist der kleinste.',q:'Welcher ist der [[größte]] Kontinent?',opts:['Asien','Afrika','Nordamerika','Europa'],a:0,ex:'Asien ist mit Abstand der größte Kontinent – dort leben auch die meisten Menschen.'},
{id:'k02',g:'ozean',topic:'Erde',d:1,info:'Die drei großen Ozeane sind der Pazifik, der Atlantik und der Indische Ozean. Der Pazifik ist der größte von ihnen.',q:'Welcher Ozean liegt zwischen Europa und Amerika?',opts:['Atlantik','Pazifik','Indischer Ozean','Mittelmeer'],a:0,ex:'Der Atlantik trennt Europa und Afrika von Amerika. Das Mittelmeer ist kein Ozean, sondern ein Nebenmeer.'},
{id:'k03',g:'himmel',topic:'Orientierung',d:1,info:'Die Sonne geht im Osten auf, steht mittags im Süden und geht im Westen unter. Auf Karten ist Norden fast immer oben.',q:'In welcher Himmelsrichtung geht die Sonne [[unter]]?',opts:['Westen','Osten','Norden','Süden'],a:0,ex:'Aufgang im Osten, Untergang im Westen. Merksatz: „Im Osten geht die Sonne auf, im Süden nimmt sie ihren Lauf, im Westen wird sie untergehn, im Norden ist sie nie zu sehn.“'},
{id:'k04',g:'himmel',topic:'Orientierung',d:1,info:'Auf einer Karte vom Bodensee liegt Konstanz links, also im Westen, und Lindau rechts, also im Osten.',q:'Ein Schiff fährt von Konstanz nach Lindau. In welche Himmelsrichtung fährt es?',opts:['Nach Osten','Nach Westen','Nach Norden','Nach Süden'],a:0,ex:'Konstanz liegt im Westen, Lindau im Osten – das Schiff fährt also nach Osten.'},
{id:'k05',g:'see',topic:'Bodensee',d:1,info:'Der Bodensee grenzt an drei Länder: Deutschland, Österreich und die Schweiz. Der Rhein fließt in den See hinein und am Westende wieder hinaus.',q:'Welches Land grenzt [[nicht]] an den Bodensee?',opts:['Frankreich','Österreich','Schweiz','Deutschland'],a:0,ex:'Frankreich liegt weiter westlich. Am Bodensee treffen sich Deutschland, Österreich und die Schweiz.'},
{id:'k06',g:'see',topic:'Bodensee',d:2,est:'m',q:'Schätze zuerst: Wie tief ist der Bodensee an seiner tiefsten Stelle?',opts:['Etwa 250 m','Etwa 5 m','Etwa 25 m','Etwa 1.000 m'],a:0,ex:'Die tiefste Stelle liegt bei gut 250 Metern – zwischen Fischbach und Uttwil. Ein Kirchturm würde dort mehrfach untergehen.'},
{id:'k07',g:'berg',topic:'Deutschland',d:1,est:'m',q:'Schätze zuerst: Wie hoch ist die Zugspitze, der höchste Berg Deutschlands?',opts:['Etwa 3.000 m','Etwa 900 m','Etwa 1.500 m','Etwa 8.000 m'],a:0,ex:'Die Zugspitze ist 2.962 m hoch. 8.000 m schaffen nur die höchsten Berge der Welt im Himalaya.'},
{id:'k08',g:'land',topic:'Deutschland',d:1,q:'Wie heißt die Landeshauptstadt von Bayern?',opts:['München','Nürnberg','Augsburg','Berlin'],a:0,ex:'München ist die Hauptstadt Bayerns. Berlin ist die Hauptstadt von ganz Deutschland.'},
{id:'k09',g:'land',topic:'Deutschland',d:2,info:'Deutschland ist ein Bundesstaat. Er besteht aus Bundesländern, die jeweils eine eigene Landesregierung haben. Das flächengrößte ist Bayern, das kleinste ist Bremen.',q:'Wie viele Bundesländer hat Deutschland?',opts:['16','12','9','20'],a:0,ex:'Deutschland hat 16 Bundesländer, darunter drei Stadtstaaten: Berlin, Hamburg und Bremen.'},
{id:'k10',g:'fluss',topic:'Deutschland',d:2,info:'Die Donau entspringt im Schwarzwald, fließt durch Bayern und dann quer durch Europa nach Osten. Der Rhein fließt nach Norden und mündet in die Nordsee.',q:'In welches Meer mündet die Donau?',opts:['Ins Schwarze Meer','In die Nordsee','In die Ostsee','Ins Mittelmeer'],a:0,ex:'Die Donau fließt nach Osten bis ins Schwarze Meer – durch zehn Länder.'},
{id:'k11',g:'mass',topic:'Karten',d:2,info:'Der Maßstab sagt, wie stark eine Karte verkleinert ist. 1 : 100.000 bedeutet: 1 cm auf der Karte sind 100.000 cm in Wirklichkeit – das ist 1 km.',q:'Auf einer Karte im Maßstab 1 : 100.000 sind zwei Orte 5 cm voneinander entfernt. Wie weit ist das in Wirklichkeit?',opts:['5 km','50 km','500 m','100 km'],a:0,ex:'1 cm entspricht 1 km. Also sind 5 cm in Wirklichkeit 5 km.'},
{id:'k12',g:'mass',topic:'Karten',d:3,info:'Je kleiner die Zahl hinter dem Doppelpunkt, desto weniger ist die Karte verkleinert – und desto mehr Einzelheiten kann sie zeigen. Wanderkarten haben oft 1 : 25.000.',q:'Welche Karte zeigt [[mehr]] Einzelheiten?',opts:['Maßstab 1 : 25.000','Maßstab 1 : 1.000.000','Beide gleich viel','Das hängt vom Papier ab'],a:0,ex:'Bei 1 : 25.000 ist alles weniger verkleinert, also sieht man mehr Details – zum Beispiel einzelne Wege und Häuser.'},
{id:'k13',g:'grad',topic:'Orientierung',d:2,info:'Das Gradnetz hilft, jeden Ort auf der Erde zu finden. Der Äquator teilt die Erde in Nord- und Südhalbkugel. Der Nullmeridian verläuft durch Greenwich bei London.',q:'Wo verläuft der Nullmeridian?',opts:['Durch Greenwich bei London','Am Äquator entlang','Durch Berlin','Durch Rom'],a:0,ex:'Der Nullmeridian läuft vom Nordpol über Greenwich zum Südpol. Von ihm aus zählt man nach Osten und Westen.'},
{id:'k14',g:'tag',topic:'Erde',d:1,info:'Die Erde dreht sich in 24 Stunden einmal um sich selbst. Für eine Runde um die Sonne braucht sie ein Jahr, etwa 365 Tage.',q:'Wodurch entstehen Tag und Nacht?',opts:['Durch die Drehung der Erde um sich selbst','Durch die Reise der Erde um die Sonne','Weil die Sonne nachts ausgeht','Weil der Mond die Sonne verdeckt'],a:0,ex:'Die Seite der Erde, die zur Sonne zeigt, hat Tag – die andere Nacht. Durch die Drehung wechselt das alle 24 Stunden.'},
{id:'k15',g:'jahr',topic:'Erde',d:3,info:'Die Erdachse ist schräg geneigt. Im Sommer ist die Nordhalbkugel der Sonne zugeneigt: Die Sonnenstrahlen treffen steiler auf, und die Tage sind länger.',q:'Warum gibt es Jahreszeiten?',opts:['Weil die Erdachse geneigt ist','Weil die Erde im Sommer näher an der Sonne ist','Weil die Sonne mal stärker, mal schwächer scheint','Weil sich der Mond vor die Sonne schiebt'],a:0,ex:'Viele denken, die Entfernung zur Sonne sei der Grund – stimmt aber nicht. Es liegt an der geneigten Achse.'},
{id:'k16',g:'jahr',topic:'Erde',d:2,q:'Wenn bei uns Sommer ist – welche Jahreszeit ist dann in Australien?',opts:['Winter','Sommer','Frühling','Herbst'],a:0,ex:'Australien liegt auf der Südhalbkugel. Dort sind die Jahreszeiten umgekehrt – Weihnachten feiert man im Hochsommer.'},
{id:'k17',g:'planet',topic:'Erde',d:1,info:'Die Erde ist der dritte Planet von der Sonne aus. Davor liegen Merkur und Venus, danach Mars, Jupiter, Saturn, Uranus und Neptun.',q:'Welcher Planet ist der [[größte]] in unserem Sonnensystem?',opts:['Jupiter','Saturn','Erde','Mars'],a:0,ex:'Jupiter ist so groß, dass mehr als 1.000 Erden hineinpassen würden. Saturn ist der zweitgrößte.'},
{id:'k18',g:'berg',topic:'Europa',d:2,info:'Die Alpen sind das höchste Gebirge Europas. Sie ziehen sich in einem Bogen von Frankreich bis nach Österreich und Slowenien.',q:'An der Grenze welcher Länder liegt der Mont Blanc, der höchste Berg der Alpen?',opts:['Frankreich und Italien','Deutschland und Österreich','Schweiz und Deutschland','Spanien und Frankreich'],a:0,ex:'Der Mont Blanc (4.806 m) liegt zwischen Frankreich und Italien – fast doppelt so hoch wie die Zugspitze.'},
{id:'k19',g:'meer',topic:'Deutschland',d:2,info:'An der Nordsee gibt es Ebbe und Flut: Etwa alle sechs Stunden wechselt der Wasserstand zwischen Niedrigwasser und Hochwasser.',q:'Was passiert bei Ebbe an der Nordseeküste?',opts:['Das Watt fällt trocken','Eine Sturmflut kommt','Das Wasser wird salziger','Es bilden sich Eisschollen'],a:0,ex:'Bei Ebbe zieht sich das Wasser zurück, und der Meeresboden – das Watt – liegt frei. Dort kann man dann sogar wandern.'},
{id:'k20',g:'europa',topic:'Europa',d:1,q:'Welches Land ist Deutschlands Nachbar im Süden, direkt am Bodensee bei Lindau?',opts:['Österreich','Italien','Frankreich','Polen'],a:0,ex:'Gleich hinter Lindau beginnt Österreich mit Bregenz. Die Schweiz ist ebenfalls Nachbar im Süden.'},
{id:'k21',g:'neben',topic:'Orientierung',d:1,info:'Zwischen den vier Haupthimmelsrichtungen liegen die Nebenhimmelsrichtungen: Nordosten, Südosten, Südwesten und Nordwesten.',q:'Welche Himmelsrichtung liegt genau zwischen Süden und Westen?',opts:['Südwesten','Südosten','Nordwesten','Nordosten'],a:0,ex:'Zwischen Süd und West liegt Südwest. Man nennt immer zuerst Nord oder Süd.'},
{id:'k22',g:'neben',topic:'Orientierung',d:2,q:'Du schaust nach Norden und drehst dich [[halb]] um dich selbst. Wohin schaust du jetzt?',opts:['Nach Süden','Nach Osten','Nach Westen','Nach Norden'],a:0,ex:'Eine halbe Drehung sind 180 Grad – du schaust genau in die Gegenrichtung, also nach Süden.'},
{id:'k23',g:'karte',topic:'Karten',d:1,info:'Auf physischen Karten zeigen Farben die Höhe: Grün sind tiefe Gebiete, Gelb und Hellbraun höhere, Dunkelbraun sind Hochgebirge. Blau ist Wasser.',q:'Welche Farbe hat auf einer physischen Karte ein Hochgebirge?',opts:['Dunkelbraun','Grün','Blau','Rot'],a:0,ex:'Je höher, desto dunkler das Braun. Die Alpen sind deshalb auf Karten dunkelbraun.'},
{id:'k24',g:'karte',topic:'Karten',d:2,info:'Die Legende einer Karte erklärt, was die Zeichen und Farben auf der Karte bedeuten – zum Beispiel ein Kreis für eine Stadt oder eine rote Linie für eine Autobahn.',q:'Wo findest du auf einer Karte, was ein bestimmtes Zeichen bedeutet?',opts:['In der Legende','Im Maßstab','Im Gradnetz','Im Titel'],a:0,ex:'Die Legende ist die „Übersetzung“ der Kartenzeichen.'},
{id:'k25',g:'hoehe',topic:'Karten',d:3,info:'Höhenlinien verbinden Punkte, die gleich hoch liegen. Liegen sie eng beieinander, ist der Hang steil – liegen sie weit auseinander, ist er flach.',q:'An einem Hang liegen die Höhenlinien sehr [[eng]] beieinander. Was bedeutet das?',opts:['Der Hang ist steil','Der Hang ist flach','Dort ist ein See','Dort ist ein Wald'],a:0,ex:'Auf kurzer Strecke geht es viele Höhenmeter hinauf – das ist steil.'},
{id:'k26',g:'insel',topic:'Bodensee',d:1,info:'Im Bodensee liegen mehrere Inseln: Die größte ist die Reichenau mit ihrem Gemüseanbau, berühmt ist die Blumeninsel Mainau. Auch die Altstadt von Lindau liegt auf einer Insel.',q:'Welche Bodensee-Insel ist als „Blumeninsel“ bekannt?',opts:['Mainau','Reichenau','Lindau','Sylt'],a:0,ex:'Auf der Mainau blühen das ganze Jahr Blumen. Sylt liegt in der Nordsee.'},
{id:'k27',g:'insel',topic:'Bodensee',d:2,info:'Der Bodensee ist ein riesiger Trinkwasserspeicher: Über lange Leitungen versorgt er rund vier Millionen Menschen in Baden-Württemberg mit Trinkwasser.',q:'Wofür ist der Bodensee für Millionen Menschen [[besonders]] wichtig?',opts:['Als Trinkwasserquelle','Als Salzlieferant','Als Ölquelle','Als Flughafen'],a:0,ex:'Das Wasser wird aus der Tiefe des Sees gepumpt, gereinigt und bis nach Stuttgart geleitet.'},
{id:'k28',g:'rhein',topic:'Bodensee',d:2,info:'Der Rhein entspringt in den Schweizer Alpen, fließt durch den Bodensee und stürzt bei Schaffhausen über den Rheinfall. Danach fließt er nach Norden bis zur Nordsee.',q:'Wo mündet der Rhein?',opts:['In die Nordsee','In den Bodensee','Ins Schwarze Meer','Ins Mittelmeer'],a:0,ex:'Der Rhein fließt durch den Bodensee hindurch und mündet in den Niederlanden in die Nordsee.'},
{id:'k29',g:'alpen',topic:'Alpen',d:2,info:'Die Alpen sind in Höhenstufen gegliedert: unten Laub- und Mischwald, darüber Nadelwald, dann Almwiesen, ganz oben Fels, Schnee und Eis. Je höher man kommt, desto kälter wird es.',q:'Warum wachsen ganz oben in den Alpen [[keine]] Bäume?',opts:['Es ist zu kalt, und der Sommer ist zu kurz','Dort gibt es kein Licht','Die Kühe fressen sie alle','Dort ist die Luft zu warm'],a:0,ex:'Oberhalb der Baumgrenze ist es für Bäume zu kalt – die warme Zeit reicht nicht zum Wachsen.'},
{id:'k30',g:'alpen',topic:'Alpen',d:1,info:'Auf den Almen weiden im Sommer Kühe. Im Herbst bringt man sie beim Almabtrieb, oft festlich geschmückt, zurück ins Tal.',q:'Was ist eine Alm?',opts:['Eine Bergwiese, auf der im Sommer Vieh weidet','Ein Berggipfel','Ein Gletscher','Ein Bergsee'],a:0,ex:'Almen liegen hoch in den Bergen. Im Allgäu sagt man auch „Alpe“.'},
{id:'k31',g:'gletscher',topic:'Alpen',d:3,info:'Gletscher sind große Eismassen, die langsam talwärts fließen. Weil es durch den Klimawandel wärmer wird, schmelzen die Alpengletscher seit Jahrzehnten stark ab.',q:'Warum werden die Alpengletscher [[kleiner]]?',opts:['Weil es durch den Klimawandel wärmer wird','Weil zu viele Menschen darauf laufen','Weil sie ins Meer rutschen','Weil der Mond sie anzieht'],a:0,ex:'Im Sommer schmilzt mehr Eis, als im Winter durch Schnee nachkommt. Einige Gletscher sind schon ganz verschwunden.'},
{id:'k32',g:'landw',topic:'Deutschland',d:2,info:'Im Allgäu regnet es viel, und auf den Hängen wächst saftiges Grünland. Deshalb halten die Bauern dort vor allem Milchkühe – das Allgäu ist bekannt für Milch und Käse.',q:'Warum gibt es im Allgäu so viele Milchkühe?',opts:['Viel Regen lässt saftiges Gras wachsen','Dort wächst besonders viel Weizen','Es ist dort sehr trocken','Dort gibt es keine Berge'],a:0,ex:'Für Ackerbau ist es oft zu nass und zu hügelig – für Wiesen und Weiden aber ideal.'},
{id:'k33',g:'landw',topic:'Deutschland',d:1,info:'Am Bodensee ist das Klima mild, weil der See im Winter Wärme abgibt. Deshalb wachsen dort viele Obstbäume – vor allem Äpfel – und auch Wein.',q:'Welches Obst wird am Bodensee [[besonders]] viel angebaut?',opts:['Äpfel','Bananen','Orangen','Ananas'],a:0,ex:'Die Bodenseeregion ist eines der größten Apfelanbaugebiete Deutschlands.'},
{id:'k34',g:'land',topic:'Deutschland',d:2,q:'Welches Bundesland grenzt [[außer]] Bayern noch an den Bodensee?',opts:['Baden-Württemberg','Hessen','Sachsen','Thüringen'],a:0,ex:'Der größte Teil des deutschen Ufers gehört zu Baden-Württemberg, zum Beispiel Konstanz und Friedrichshafen. Lindau gehört zu Bayern.'},
{id:'k35',g:'land',topic:'Deutschland',d:2,q:'Welche Stadt ist [[keine]] Landeshauptstadt?',opts:['Köln','Düsseldorf','Stuttgart','Hamburg'],a:0,ex:'Köln ist zwar die größte Stadt in Nordrhein-Westfalen, die Landeshauptstadt ist aber Düsseldorf.'},
{id:'k36',g:'stadt',topic:'Deutschland',d:1,q:'Welche ist die größte Stadt Deutschlands?',opts:['Berlin','Hamburg','München','Köln'],a:0,ex:'Berlin hat fast 4 Millionen Einwohner. Danach folgen Hamburg und München.'},
{id:'k37',g:'europa',topic:'Europa',d:1,q:'Welches Land gehört [[nicht]] zu Europa?',opts:['Ägypten','Spanien','Polen','Norwegen'],a:0,ex:'Ägypten liegt in Afrika, auf der anderen Seite des Mittelmeers.'},
{id:'k38',g:'eu',topic:'Europa',d:2,info:'Die Europäische Union (EU) ist ein Zusammenschluss von 27 Ländern. In vielen davon bezahlt man mit dem Euro. Die Schweiz und Norwegen gehören nicht zur EU.',q:'Welches Nachbarland am Bodensee gehört [[nicht]] zur EU?',opts:['Die Schweiz','Österreich','Deutschland','Alle gehören dazu'],a:0,ex:'Deutschland und Österreich sind in der EU, die Schweiz nicht – dort bezahlt man mit Schweizer Franken.'},
{id:'k39',g:'klima',topic:'Erde',d:2,info:'Wetter ist der Zustand der Luft an einem Ort zu einer bestimmten Zeit – heute Regen, morgen Sonne. Klima ist das durchschnittliche Wetter über viele Jahre.',q:'Welcher Satz beschreibt das [[Klima]]?',opts:['Am Bodensee sind die Winter meist mild.','Heute regnet es in Lindau.','Morgen wird es sonnig.','Gestern hat es gehagelt.'],a:0,ex:'„meist mild“ beschreibt den Durchschnitt über viele Jahre – das ist Klima. Die anderen Sätze beschreiben Wetter.'},
{id:'k40',g:'klima',topic:'Erde',d:2,info:'Am Äquator ist es das ganze Jahr heiß, an den Polen eiskalt. Dazwischen liegen die Klimazonen: Tropen, Subtropen, gemäßigte Zone und Polarzone. Deutschland liegt in der gemäßigten Zone.',q:'In welcher Klimazone liegt Deutschland?',opts:['In der gemäßigten Zone','In den Tropen','In der Polarzone','In den Subtropen'],a:0,ex:'Gemäßigt heißt: vier Jahreszeiten, nicht extrem heiß und nicht extrem kalt.'},
{id:'k41',g:'wasser',topic:'Erde',d:1,est:'%',q:'Schätze zuerst: Wie viel Prozent der Erdoberfläche sind ungefähr von Wasser bedeckt?',opts:['Etwa 70 %','Etwa 30 %','Etwa 50 %','Etwa 95 %'],a:0,ex:'Rund 71 % der Erde sind mit Wasser bedeckt – deshalb nennt man sie auch den „blauen Planeten“.'},
{id:'k42',g:'wasser',topic:'Erde',d:1,q:'Auf welchem Kontinent liegt Ägypten?',opts:['Afrika','Asien','Europa','Australien'],a:0,ex:'Ägypten liegt im Nordosten Afrikas. Nur die Halbinsel Sinai gehört schon zu Asien.'},
{id:'k43',g:'mond',topic:'Erde',d:2,info:'Der Mond umkreist die Erde in etwa einem Monat. Er leuchtet nicht selbst – wir sehen das Sonnenlicht, das er zurückwirft. Je nachdem, wie viel von der beleuchteten Seite wir sehen, ändern sich die Mondphasen.',q:'Warum leuchtet der Mond?',opts:['Er wirft das Licht der Sonne zurück','Er leuchtet selbst wie die Sonne','Er ist sehr heiß','Er spiegelt die Lichter der Städte'],a:0,ex:'Der Mond ist ein kalter Gesteinsbrocken. Er wirkt nur hell, weil die Sonne ihn anstrahlt.'},
{id:'k44',g:'fluss',topic:'Deutschland',d:1,info:'Ein Fluss beginnt an der Quelle und endet an der Mündung. Flüsse, die in einen größeren Fluss münden, heißen Nebenflüsse.',q:'Wie nennt man die Stelle, an der ein Fluss ins Meer fließt?',opts:['Mündung','Quelle','Ufer','Furt'],a:0,ex:'Die Quelle ist der Anfang, die Mündung das Ende eines Flusses.'},
{id:'k45',g:'fluss',topic:'Deutschland',d:2,q:'Iller und Lech fließen in die Donau. Wie nennt man solche Flüsse?',opts:['Nebenflüsse','Hauptflüsse','Quellflüsse','Kanäle'],a:0,ex:'Sie münden in einen größeren Fluss – also sind es Nebenflüsse der Donau.'},
{id:'k46',g:'bayland',topic:'Bayern',d:1,info:'Bayern hat ganz verschiedene Landschaften: im Süden die Alpen, davor das Alpenvorland mit seinen Seen, in der Mitte die Donau und im Norden und Osten Mittelgebirge wie den Bayerischen Wald.',q:'Wie heißt die Landschaft zwischen den Alpen und der Donau?',opts:['Alpenvorland','Nordseeküste','Schwarzwald','Harz'],a:0,ex:'„vor den Alpen“ – das Alpenvorland reicht von den Bergen bis ungefähr zur Donau. Auch Lindau liegt darin.'},
{id:'k47',g:'bayland',topic:'Bayern',d:2,info:'In der Eiszeit schoben sich riesige Gletscher aus den Alpen ins Vorland. Als sie schmolzen, blieben Hügel und Seen zurück – zum Beispiel Chiemsee, Starnberger See und auch der Bodensee.',q:'Was hat die Seen im Alpenvorland geformt?',opts:['Gletscher in der Eiszeit','Vulkane','Menschen mit Baggern','Meteoriten'],a:0,ex:'Die Gletscher schürften Becken aus, die sich später mit Schmelzwasser füllten.'},
{id:'k48',g:'bayland2',topic:'Bayern',d:2,info:'Der Bayerische Wald an der Grenze zu Tschechien ist ein Mittelgebirge mit riesigen Wäldern. Dort wurde 1970 der erste Nationalpark Deutschlands gegründet.',q:'Wo liegt der älteste Nationalpark Deutschlands?',opts:['Im Bayerischen Wald','Auf Sylt','In Berlin','Am Bodensee'],a:0,ex:'Im Nationalpark Bayerischer Wald darf sich die Natur weitgehend selbst überlassen bleiben.'},
{id:'k49',g:'bayfluss',topic:'Bayern',d:1,q:'Durch welche bayerische Stadt fließt die Isar?',opts:['München','Nürnberg','Würzburg','Lindau'],a:0,ex:'Die Isar fließt mitten durch München. Durch Nürnberg fließt die Pegnitz, durch Würzburg der Main.'},
{id:'k50',g:'bayfluss',topic:'Bayern',d:2,q:'Welcher Fluss fließt durch Würzburg?',opts:['Der Main','Die Isar','Der Inn','Der Lech'],a:0,ex:'Der Main fließt durch Unterfranken und mündet bei Mainz in den Rhein.'},
{id:'k51',g:'alpen3',topic:'Alpen',d:1,info:'Die Alpen erstrecken sich in einem großen Bogen über acht Länder: Frankreich, Monaco, Italien, Schweiz, Liechtenstein, Deutschland, Österreich und Slowenien.',q:'An wie vielen Ländern haben die Alpen Anteil?',opts:['8','2','4','12'],a:0,ex:'Acht Länder – Deutschland hat nur einen kleinen Teil ganz im Süden.'},
{id:'k52',g:'alpen3',topic:'Alpen',d:2,info:'Der Tourismus bringt den Alpen Geld und Arbeitsplätze. Er hat aber auch Nachteile: Lärm, viel Verkehr, und für Skipisten und Lifte werden Wälder gerodet.',q:'Welcher ist ein [[Nachteil]] des Tourismus in den Alpen?',opts:['Wälder werden für Skipisten gerodet','Hotels bieten Arbeitsplätze','Bergbahnen bringen Wanderer nach oben','Gäste geben Geld aus'],a:0,ex:'Die anderen drei sind Vorteile. Fehlt der Wald, steigt außerdem die Gefahr von Lawinen und Erdrutschen.'},
{id:'k53',g:'pass',topic:'Alpen',d:2,info:'Pässe sind niedrigere Übergänge zwischen hohen Bergen. Über sie führen Straßen. Wo kein Pass hilft, baut man Tunnel – der Gotthard-Basistunnel in der Schweiz ist der längste Eisenbahntunnel der Welt.',q:'Was ist ein Pass im Gebirge?',opts:['Ein niedriger Übergang zwischen Bergen','Ein Gipfel','Ein Gletscher','Ein Bergsee'],a:0,ex:'Über Pässe wie den Brenner oder den Gotthard reisten schon die Römer über die Alpen.'},
{id:'k54',g:'pass',topic:'Alpen',d:2,est:'km',q:'Schätze zuerst: Wie lang ist der Gotthard-Basistunnel, der längste Eisenbahntunnel der Welt?',opts:['Etwa 57 km','Etwa 5 km','Etwa 15 km','Etwa 150 km'],a:0,ex:'Rund 57 Kilometer – fast so lang wie der ganze Bodensee. Der Zug braucht dafür knapp 20 Minuten.'},
{id:'k55',g:'lawine',topic:'Naturgefahren',d:1,info:'Lawinen sind große Schneemassen, die einen Hang hinunterrutschen. Bergwald schützt die Dörfer darunter, weil die Bäume den Schnee festhalten.',q:'Warum ist Bergwald [[wichtig]] für die Dörfer in den Alpen?',opts:['Er hält den Schnee fest und schützt vor Lawinen','Er macht die Luft wärmer','Er hält Touristen fern','Er bringt mehr Regen'],a:0,ex:'Deshalb ist es in vielen Bergwäldern verboten, Bäume einfach zu fällen.'},
{id:'k56',g:'hochwasser',topic:'Naturgefahren',d:2,info:'Nach starkem Regen oder Schneeschmelze treten Flüsse über die Ufer. Wiesen, Wälder und breite Flussauen nehmen Wasser auf. Zubetonierte Flächen wie Straßen und Parkplätze lassen es dagegen schnell abfließen.',q:'Was [[verstärkt]] Hochwasser?',opts:['Viele zubetonierte Flächen','Breite Flussauen','Wälder','Wiesen am Ufer'],a:0,ex:'Auf Beton kann kein Wasser versickern – es läuft sofort in die Flüsse.'},
{id:'k57',g:'hochwasser',topic:'Naturgefahren',d:2,info:'Auch der Bodensee hat Hochwasser: Im Frühsommer schmilzt in den Alpen der Schnee, und der Rhein bringt viel Wasser. Dann steigt der Wasserspiegel oft um mehr als einen Meter.',q:'Wann ist der Wasserstand im Bodensee meist am [[höchsten]]?',opts:['Im Frühsommer','Im Winter','Im Herbst','Er ist immer gleich'],a:0,ex:'Im Winter ist der Wasserstand am niedrigsten – dann liegen manche Pfahlbau-Reste sogar frei.'},
{id:'k58',g:'wetterel',topic:'Wetter & Klima',d:1,info:'Das Wetter beschreibt man mit Wetterelementen: Temperatur, Niederschlag (Regen, Schnee), Wind, Bewölkung und Luftdruck.',q:'Was ist [[kein]] Wetterelement?',opts:['Die Uhrzeit','Die Temperatur','Der Wind','Der Niederschlag'],a:0,ex:'Die Uhrzeit sagt nichts über das Wetter aus. Temperatur, Wind und Niederschlag dagegen schon.'},
{id:'k59',g:'wetterel',topic:'Wetter & Klima',d:2,info:'Mit einem Thermometer misst man die Temperatur, mit einem Regenmesser den Niederschlag, mit einem Windmesser die Windgeschwindigkeit und mit einem Barometer den Luftdruck.',q:'Womit misst man den Niederschlag?',opts:['Mit einem Regenmesser','Mit einem Thermometer','Mit einem Kompass','Mit einem Barometer'],a:0,ex:'Der Regenmesser fängt Regen auf und zeigt, wie viele Liter pro Quadratmeter gefallen sind.'},
{id:'k60',g:'foehn',topic:'Wetter & Klima',d:3,info:'Der Föhn ist ein warmer, trockener Fallwind, der von den Alpen ins Alpenvorland weht. Bei Föhn ist die Luft so klar, dass die Berge zum Greifen nah wirken.',q:'Woran erkennt man Föhn am Bodensee?',opts:['Sehr klare Sicht – die Alpen wirken ganz nah','Dichter Nebel','Starker Schneefall','Hagel'],a:0,ex:'Föhntage sind oft sonnig, warm und klar. Manche Menschen bekommen davon allerdings Kopfweh.'},
{id:'k61',g:'klimad',topic:'Wetter & Klima',d:2,info:'Ein Klimadiagramm zeigt für einen Ort die Durchschnittstemperatur (als Linie) und den Niederschlag (als Säulen) für jeden Monat des Jahres.',q:'Was zeigen die Säulen in einem Klimadiagramm?',opts:['Den Niederschlag','Die Temperatur','Die Windstärke','Die Sonnenstunden'],a:0,ex:'Säulen = Niederschlag, Linie = Temperatur. So sieht man auf einen Blick, wann es warm und wann es nass ist.'},
{id:'k62',g:'see4',topic:'Bodensee',d:1,info:'Über den Bodensee fahren Fähren, zum Beispiel zwischen Meersburg und Konstanz und zwischen Friedrichshafen und Romanshorn in der Schweiz.',q:'Wohin bringt die Fähre von Friedrichshafen?',opts:['Nach Romanshorn in der Schweiz','Nach München','Nach Zürich','Nach Innsbruck'],a:0,ex:'Romanshorn liegt genau gegenüber am Schweizer Ufer. München, Zürich und Innsbruck liegen nicht am See.'},
{id:'k63',g:'see4',topic:'Bodensee',d:2,est:'km',q:'Schätze zuerst: Wie lang ist der Bodensee ungefähr?',opts:['Etwa 63 km','Etwa 6 km','Etwa 630 km','Etwa 20 km'],a:0,ex:'Von Bodman bis Bregenz sind es rund 63 Kilometer. Mit dem Rad braucht man für die ganze Runde um den See mehrere Tage.'},
{id:'k64',g:'see5',topic:'Bodensee',d:2,info:'Im Bodensee leben Fische wie Felchen, Barsch (am See „Kretzer“ genannt) und Hecht. Felchen sind der wichtigste Speisefisch der Bodenseefischer.',q:'Welcher Fisch ist der wichtigste Speisefisch am Bodensee?',opts:['Felchen','Lachs','Hai','Thunfisch'],a:0,ex:'Felchen stehen in vielen Gasthäusern am See auf der Karte. Haie und Thunfische leben nur im Meer.'},
{id:'k65',g:'see5',topic:'Bodensee',d:3,info:'Vor etwa 50 Jahren war der Bodensee durch Abwässer stark verschmutzt: Es gab zu viele Nährstoffe, Algen wucherten. Mit vielen Kläranlagen rund um den See wurde das Wasser wieder sauber.',q:'Was hat den Bodensee wieder sauber gemacht?',opts:['Der Bau von Kläranlagen','Mehr Fischerboote','Weniger Regen','Mehr Sonne'],a:0,ex:'Die drei Länder am See haben gemeinsam Kläranlagen gebaut. Heute kann man das Seewasser zu Trinkwasser aufbereiten.'},
{id:'k66',g:'europa3',topic:'Europa',d:1,q:'Welches Land liegt [[nördlich]] von Deutschland?',opts:['Dänemark','Italien','Schweiz','Tschechien'],a:0,ex:'Dänemark grenzt im Norden an Schleswig-Holstein. Italien und die Schweiz liegen im Süden, Tschechien im Osten.'},
{id:'k67',g:'europa3',topic:'Europa',d:2,q:'Wie heißt die Hauptstadt von Tschechien?',opts:['Prag','Warschau','Wien','Budapest'],a:0,ex:'Prag liegt an der Moldau. Warschau ist die Hauptstadt Polens, Budapest die Ungarns.'},
{id:'k68',g:'europa4',topic:'Europa',d:2,info:'Der längste Fluss Europas ist die Wolga in Russland. Der zweitlängste ist die Donau, die durch zehn Länder fließt.',q:'Welcher ist der längste Fluss Europas?',opts:['Die Wolga','Die Donau','Der Rhein','Die Themse'],a:0,ex:'Die Wolga ist rund 3.500 km lang, die Donau knapp 2.900 km.'},
{id:'k69',g:'europa4',topic:'Europa',d:2,q:'Welche Länder zählt man zu Skandinavien?',opts:['Norwegen, Schweden, Dänemark','Spanien, Portugal, Italien','Polen, Tschechien, Ungarn','Frankreich, Belgien, Niederlande'],a:0,ex:'Norwegen, Schweden und Dänemark bilden Skandinavien im Norden Europas.'},
{id:'k70',g:'europa5',topic:'Europa',d:1,q:'Welches Meer liegt im Süden Europas?',opts:['Das Mittelmeer','Die Nordsee','Die Ostsee','Das Nordpolarmeer'],a:0,ex:'Das Mittelmeer liegt zwischen Europa und Afrika. Nord- und Ostsee liegen im Norden.'},
{id:'k71',g:'grad2',topic:'Orientierung',d:2,info:'Breitenkreise verlaufen parallel zum Äquator. Sie zeigen, wie weit nördlich oder südlich ein Ort liegt. Längenkreise (Meridiane) laufen von Pol zu Pol.',q:'Welche Linien verlaufen parallel zum Äquator?',opts:['Die Breitenkreise','Die Längenkreise','Die Meridiane','Die Flüsse'],a:0,ex:'Der Äquator ist selbst der längste Breitenkreis. Meridiane ist ein anderes Wort für Längenkreise.'},
{id:'k72',g:'grad2',topic:'Orientierung',d:3,info:'Lindau liegt bei etwa 47,5° nördlicher Breite und 9,7° östlicher Länge. „Nördlich“ bedeutet: nördlich des Äquators. „Östlich“ bedeutet: östlich des Nullmeridians.',q:'Was bedeutet „47° nördliche Breite“?',opts:['47 Grad nördlich des Äquators','47 Grad östlich von Greenwich','47 km bis zum Nordpol','47 Meter über dem Meer'],a:0,ex:'Die Breite misst man vom Äquator (0°) bis zum Pol (90°). Lindau liegt also gut auf halbem Weg zum Nordpol.'},
{id:'k73',g:'karte3',topic:'Karten',d:1,info:'Ein Stadtplan zeigt Straßen und Gebäude einer Stadt sehr genau. Eine Atlaskarte zeigt große Gebiete wie Länder oder Kontinente.',q:'Welche Karte brauchst du, um das Schwimmbad in einer Stadt zu finden?',opts:['Einen Stadtplan','Eine Weltkarte','Eine Europakarte','Eine Sternkarte'],a:0,ex:'Nur der Stadtplan ist so genau, dass einzelne Gebäude und Straßen darauf zu sehen sind.'},
{id:'k74',g:'mass',topic:'Karten',d:2,q:'Auf einer Karte im Maßstab 1 : 50.000 sind zwei Orte 4 cm voneinander entfernt. Wie weit ist das in Wirklichkeit?',opts:['2 km','20 km','200 m','4 km'],a:0,ex:'1 cm entspricht 50.000 cm = 500 m. Also sind 4 cm in Wirklichkeit 4 · 500 m = 2.000 m = 2 km.'},
{id:'k75',g:'kompass2',topic:'Orientierung',d:2,info:'Mittags steht die Sonne bei uns ungefähr im Süden. Wer mittags zur Sonne schaut, blickt also nach Süden.',q:'Du stehst mittags mit dem [[Rücken]] zur Sonne. Wohin schaust du?',opts:['Nach Norden','Nach Süden','Nach Osten','Nach Westen'],a:0,ex:'Die Sonne steht mittags im Süden – mit dem Rücken zu ihr schaust du genau in die Gegenrichtung, nach Norden.'},
{id:'k76',g:'karte3',topic:'Karten',d:2,info:'Physische Karten zeigen Höhen, Flüsse und Gebirge. Thematische Karten zeigen ein bestimmtes Thema, zum Beispiel Bevölkerung, Klima oder Landwirtschaft.',q:'Eine Karte zeigt, wo in Bayern Hopfen angebaut wird. Was für eine Karte ist das?',opts:['Eine thematische Karte','Eine physische Karte','Ein Stadtplan','Eine Sternkarte'],a:0,ex:'Die Karte hat ein bestimmtes Thema – den Hopfenanbau. Also ist es eine thematische Karte.'},
{id:'k77',g:'nachbar',topic:'Deutschland',d:1,info:'Deutschland hat neun Nachbarländer: Dänemark, Polen, Tschechien, Österreich, die Schweiz, Frankreich, Luxemburg, Belgien und die Niederlande.',q:'Wie viele Nachbarländer hat Deutschland?',opts:['9','5','7','12'],a:0,ex:'Neun – mehr als fast jedes andere Land in Europa.'},
{id:'k78',g:'nachbar',topic:'Deutschland',d:2,q:'Welches Land ist [[kein]] Nachbar Deutschlands?',opts:['Italien','Belgien','Luxemburg','Tschechien'],a:0,ex:'Zwischen Deutschland und Italien liegen Österreich und die Schweiz.'},
{id:'k79',g:'kueste',topic:'Deutschland',d:2,info:'An der Nordsee gibt es Ebbe und Flut und das Wattenmeer. Die Ostsee hat dagegen fast keine Gezeiten, weil sie nur durch schmale Meerengen mit dem Ozean verbunden ist.',q:'Wo gibt es das Wattenmeer?',opts:['An der Nordsee','An der Ostsee','Am Bodensee','In den Alpen'],a:0,ex:'Das Wattenmeer an der Nordsee ist Nationalpark und Weltnaturerbe.'},
{id:'k80',g:'mittelgeb',topic:'Deutschland',d:2,info:'Zwischen dem Norddeutschen Tiefland und den Alpen liegen die Mittelgebirge, zum Beispiel Harz, Schwarzwald, Thüringer Wald und Bayerischer Wald. Ihre Berge sind meist unter 1.500 m hoch.',q:'Welches Gebirge ist ein Mittelgebirge?',opts:['Der Schwarzwald','Die Alpen','Der Himalaya','Die Pyrenäen'],a:0,ex:'Der Schwarzwald liegt in Baden-Württemberg und ist ein Mittelgebirge. Die anderen sind Hochgebirge.'},
{id:'k81',g:'mittelgeb',topic:'Deutschland',d:1,q:'Wie ist die Landschaft im Norden Deutschlands meistens?',opts:['Flach','Hochgebirge','Voller Vulkane','Eine Wüste'],a:0,ex:'Im Norden liegt das Norddeutsche Tiefland – flach bis leicht hügelig.'},
{id:'k82',g:'kont3',topic:'Erde',d:1,q:'Auf welchem Kontinent liegt China?',opts:['Asien','Afrika','Europa','Südamerika'],a:0,ex:'China liegt in Asien, dem größten Kontinent.'},
{id:'k83',g:'kont3',topic:'Erde',d:2,q:'Welcher Kontinent ist fast ganz von Eis bedeckt?',opts:['Antarktika','Australien','Europa','Afrika'],a:0,ex:'Antarktika liegt um den Südpol. Das Eis dort ist an manchen Stellen über 4 km dick.'},
{id:'k84',g:'ozean2',topic:'Erde',d:2,q:'Welcher ist der [[größte]] Ozean?',opts:['Der Pazifik','Der Atlantik','Der Indische Ozean','Das Nordpolarmeer'],a:0,ex:'Der Pazifik ist so groß, dass alle Kontinente zusammen hineinpassen würden.'},
{id:'k85',g:'zeitz',topic:'Erde',d:3,info:'Weil sich die Erde dreht, ist nicht überall gleichzeitig Mittag. Deshalb gibt es Zeitzonen. Ist es bei uns 12 Uhr, ist es in New York erst 6 Uhr morgens.',q:'Warum gibt es Zeitzonen?',opts:['Weil sich die Erde dreht und nicht überall gleichzeitig Mittag ist','Weil Uhren ungenau sind','Weil jedes Land es ohne Grund selbst festlegt','Wegen des Mondes'],a:0,ex:'Die Sonne steht nacheinander über verschiedenen Orten im Süden. Die Zeitzonen sorgen dafür, dass es überall ungefähr mittags 12 Uhr ist.'}
];

const AW=[
{id:'a01',g:'hs1',topic:'Hauptstädte',d:1,q:'Wie heißt die Hauptstadt von Frankreich?',opts:['Paris','Lyon','Marseille','Brüssel'],a:0,ex:'Paris ist die Hauptstadt Frankreichs. Brüssel ist die Hauptstadt Belgiens.'},
{id:'a02',g:'hs1',topic:'Hauptstädte',d:1,q:'Wie heißt die Hauptstadt von Österreich?',opts:['Wien','Salzburg','Innsbruck','Bregenz'],a:0,ex:'Wien ist die Hauptstadt Österreichs. Bregenz ist die Hauptstadt des Bundeslandes Vorarlberg am Bodensee.'},
{id:'a03',g:'hs2',topic:'Hauptstädte',d:2,q:'In welcher Stadt sitzen Regierung und Parlament der Schweiz?',opts:['Bern','Zürich','Genf','Basel'],a:0,ex:'Bern ist die „Bundesstadt“ der Schweiz. Zürich ist zwar die größte Stadt, aber nicht der Regierungssitz.'},
{id:'a04',g:'hs2',topic:'Hauptstädte',d:1,q:'Wie heißt die Hauptstadt von Italien?',opts:['Rom','Mailand','Venedig','Neapel'],a:0,ex:'Rom ist die Hauptstadt Italiens – und schon vor über 2.000 Jahren war es das Zentrum des Römischen Reiches.'},
{id:'a05',g:'musik',topic:'Musik',d:1,info:'Musikinstrumente teilt man in Gruppen: Saiteninstrumente (Geige, Gitarre), Blasinstrumente (Flöte, Trompete) und Schlaginstrumente (Trommel, Xylofon).',q:'Zu welcher Gruppe gehört die Trompete?',opts:['Blasinstrumente','Saiteninstrumente','Schlaginstrumente','Tasteninstrumente'],a:0,ex:'Bei der Trompete entsteht der Ton durch Blasen – also ein Blasinstrument (genauer: Blechblasinstrument).'},
{id:'a06',g:'musik',topic:'Musik',d:2,info:'Wolfgang Amadeus Mozart wurde 1756 in Salzburg geboren. Schon als kleines Kind komponierte er und reiste als „Wunderkind“ durch Europa.',q:'Wer komponierte die Oper „Die Zauberflöte“?',opts:['Wolfgang Amadeus Mozart','Ludwig van Beethoven','Johann Sebastian Bach','Joseph Haydn'],a:0,ex:'„Die Zauberflöte“ ist eine der bekanntesten Opern Mozarts, uraufgeführt 1791 in Wien.'},
{id:'a07',g:'erfind',topic:'Erfindungen',d:2,info:'Johannes Gutenberg erfand um 1450 in Mainz den Buchdruck mit beweglichen Buchstaben. Vorher wurden Bücher mühsam mit der Hand abgeschrieben.',q:'Was veränderte Gutenbergs Erfindung [[vor allem]]?',opts:['Bücher wurden billiger, und Wissen verbreitete sich schneller','Man konnte schneller reisen','Häuser konnten höher gebaut werden','Briefe kamen schneller an'],a:0,ex:'Mit dem Buchdruck konnte man viele gleiche Bücher in kurzer Zeit herstellen. Mehr Menschen konnten lesen und lernen.'},
{id:'a08',g:'erfind',topic:'Erfindungen',d:2,q:'Wer baute 1886 das erste Automobil mit Benzinmotor?',opts:['Carl Benz','Henry Ford','Rudolf Diesel','Ferdinand Porsche'],a:0,ex:'Carl Benz meldete 1886 seinen „Motorwagen“ zum Patent an. Seine Frau Bertha machte damit die erste lange Autofahrt.'},
{id:'a09',g:'tier',topic:'Tiere',d:1,est:'km/h',q:'Schätze zuerst: Wie schnell kann ein Gepard höchstens laufen?',opts:['Etwa 100 km/h','Etwa 30 km/h','Etwa 50 km/h','Etwa 250 km/h'],a:0,ex:'Geparden schaffen kurz rund 100 km/h – so schnell wie ein Auto auf der Landstraße. Länger als ein paar Sekunden halten sie das aber nicht durch.'},
{id:'a10',g:'tier',topic:'Tiere',d:1,est:'m',q:'Schätze zuerst: Wie lang kann ein Blauwal werden?',opts:['Etwa 30 m','Etwa 5 m','Etwa 12 m','Etwa 100 m'],a:0,ex:'Blauwale werden bis zu 30 Meter lang – das größte Tier, das je gelebt hat. Das ist so lang wie zwei Linienbusse hintereinander.'},
{id:'a11',g:'verkehr',topic:'Alltag',d:1,info:'Ein Fahrrad muss verkehrssicher sein: Dazu gehören zwei voneinander unabhängige Bremsen, eine Klingel, Licht vorne und hinten sowie Reflektoren.',q:'Was muss ein Fahrrad im Straßenverkehr [[unbedingt]] haben?',opts:['Zwei Bremsen und eine Klingel','Einen Gepäckträger','Einen Ständer','Eine Gangschaltung'],a:0,ex:'Bremsen, Klingel, Licht und Reflektoren sind vorgeschrieben. Gepäckträger, Ständer und Gangschaltung sind praktisch, aber freiwillig.'},
{id:'a12',g:'notruf',topic:'Alltag',d:1,info:'Der Notruf für Feuerwehr und Rettungsdienst ist in ganz Europa die 112. Die Polizei erreichst du in Deutschland unter 110.',q:'Welche Nummer wählst du, wenn jemand verletzt ist und einen Rettungswagen braucht?',opts:['112','110','118','911'],a:0,ex:'112 ist für Rettungsdienst und Feuerwehr. 911 ist die Notrufnummer in den USA.'},
{id:'a13',g:'euro',topic:'Alltag',d:2,q:'Seit welchem Jahr bezahlt man in Deutschland mit Euro-Münzen und -Scheinen?',opts:['2002','1990','1999','2010'],a:0,ex:'Am 1. Januar 2002 kam das Euro-Bargeld. 1999 wurde der Euro zwar eingeführt, aber zunächst nur für Überweisungen.'},
{id:'a14',g:'sport',topic:'Sport',d:1,q:'Wie viele Spieler einer Mannschaft stehen beim Fußball gleichzeitig auf dem Feld?',opts:['11','10','9','12'],a:0,ex:'Elf Spieler pro Mannschaft – zehn Feldspieler und ein Torwart.'},
{id:'a15',g:'farbe',topic:'Kunst',d:1,info:'Die drei Grundfarben im Farbkasten sind Rot, Gelb und Blau. Mischt man zwei davon, entsteht eine Mischfarbe: Blau und Gelb ergeben zum Beispiel Grün.',q:'Welche Farbe entsteht, wenn du Rot und Gelb mischst?',opts:['Orange','Grün','Lila','Braun'],a:0,ex:'Rot + Gelb = Orange. Rot + Blau ergibt Lila.'},
{id:'a16',g:'sprache',topic:'Welt',d:2,q:'In welchem Land Südamerikas spricht man Portugiesisch und nicht Spanisch?',opts:['Brasilien','Argentinien','Chile','Mexiko'],a:0,ex:'Brasilien war früher eine Kolonie Portugals. Fast alle anderen Länder Südamerikas sprechen Spanisch.'},
{id:'a17',g:'religion',topic:'Religionen',d:2,info:'Im Christentum gibt es mehrere große Feste: Weihnachten (Geburt Jesu), Ostern (Auferstehung Jesu) und Pfingsten.',q:'Welches Fest gilt im Christentum als das wichtigste?',opts:['Ostern','Weihnachten','Pfingsten','Sankt Martin'],a:0,ex:'Viele denken an Weihnachten – theologisch ist aber Ostern das wichtigste christliche Fest.'},
{id:'a18',g:'religion',topic:'Religionen',d:2,q:'Wie heißt der Monat, in dem viele Muslime tagsüber fasten?',opts:['Ramadan','Advent','Pessach','Diwali'],a:0,ex:'Im Ramadan fasten Muslime von der Morgendämmerung bis zum Sonnenuntergang. Pessach ist ein jüdisches, Diwali ein hinduistisches Fest.'},
{id:'a19',g:'raum',topic:'Weltraum',d:2,q:'Wer betrat 1969 als erster Mensch den Mond?',opts:['Neil Armstrong','Juri Gagarin','Buzz Aldrin','Alexander Gerst'],a:0,ex:'Neil Armstrong war der erste auf dem Mond, Buzz Aldrin folgte kurz danach. Juri Gagarin war 1961 der erste Mensch im Weltall.'},
{id:'a20',g:'kal',topic:'Alltag',d:1,q:'Wie viele Tage hat ein Schaltjahr?',opts:['366','365','364','360'],a:0,ex:'Alle vier Jahre bekommt der Februar einen 29. Tag – dann hat das Jahr 366 Tage.'},
{id:'a21',g:'europa',topic:'Welt',d:2,q:'Wie viele Sterne sind auf der Europaflagge?',opts:['12','27','15','50'],a:0,ex:'Es sind immer 12 Sterne – sie stehen für Einheit und Vollkommenheit, nicht für die Zahl der Länder. 50 Sterne hat die Flagge der USA.'},
{id:'a22',g:'hs1',topic:'Hauptstädte',d:1,q:'Wie heißt die Hauptstadt von Spanien?',opts:['Madrid','Barcelona','Sevilla','Lissabon'],a:0,ex:'Madrid liegt mitten in Spanien. Lissabon ist die Hauptstadt von Portugal.'},
{id:'a23',g:'hs2',topic:'Hauptstädte',d:2,q:'Wie heißt die Hauptstadt von Polen?',opts:['Warschau','Krakau','Prag','Danzig'],a:0,ex:'Warschau ist die Hauptstadt Polens. Prag ist die Hauptstadt Tschechiens.'},
{id:'a24',g:'hs3',topic:'Hauptstädte',d:3,q:'Wie heißt die Hauptstadt der Niederlande?',opts:['Amsterdam','Rotterdam','Den Haag','Brüssel'],a:0,ex:'Hauptstadt ist Amsterdam – Regierung und Parlament sitzen aber in Den Haag. Brüssel ist die Hauptstadt Belgiens.'},
{id:'a25',g:'hs3',topic:'Hauptstädte',d:2,q:'Wie heißt die Hauptstadt der USA?',opts:['Washington, D.C.','New York','Los Angeles','Chicago'],a:0,ex:'Washington ist Regierungssitz und Hauptstadt. New York ist die größte Stadt der USA.'},
{id:'a26',g:'orchester',topic:'Musik',d:1,info:'Ein Orchester besteht aus Streichern, Holzbläsern, Blechbläsern und Schlagwerk. Geleitet wird es von einer Dirigentin oder einem Dirigenten.',q:'Wer leitet ein Orchester?',opts:['Der Dirigent oder die Dirigentin','Der Komponist','Der Pianist','Der Trompeter'],a:0,ex:'Mit Händen oder Taktstock gibt der Dirigent Tempo und Einsätze vor. Der Komponist hat das Stück geschrieben.'},
{id:'a27',g:'noten',topic:'Musik',d:2,info:'Eine ganze Note dauert vier Schläge, eine halbe Note zwei Schläge und eine Viertelnote einen Schlag.',q:'Wie viele Viertelnoten dauern so lang wie eine halbe Note?',opts:['2','4','1','8'],a:0,ex:'Halbe Note = 2 Schläge, Viertelnote = 1 Schlag. Also passen zwei Viertel in eine Halbe.'},
{id:'a28',g:'maler',topic:'Kunst',d:2,info:'Leonardo da Vinci war ein italienischer Maler, Erfinder und Forscher. Sein berühmtestes Bild ist die „Mona Lisa“. Sie hängt heute im Louvre in Paris.',q:'Wer malte die „Mona Lisa“?',opts:['Leonardo da Vinci','Vincent van Gogh','Pablo Picasso','Albrecht Dürer'],a:0,ex:'Leonardo malte sie vor gut 500 Jahren. Van Gogh malte die „Sonnenblumen“.'},
{id:'a29',g:'farbe',topic:'Kunst',d:1,q:'Welche Farbe entsteht, wenn du Blau und Gelb mischst?',opts:['Grün','Lila','Orange','Braun'],a:0,ex:'Blau + Gelb = Grün. Rot + Blau = Lila, Rot + Gelb = Orange.'},
{id:'a30',g:'drais',topic:'Erfindungen',d:1,info:'1817 erfand Karl Drais in Mannheim die Laufmaschine: ein Zweirad ohne Pedale, das man mit den Füßen anschob. Sie gilt als Urahn des Fahrrads.',q:'Was fehlte der Laufmaschine von Karl Drais noch?',opts:['Pedale','Räder','Ein Lenker','Ein Sitz'],a:0,ex:'Man stieß sich mit den Füßen vom Boden ab – wie bei einem Laufrad für Kinder. Pedale kamen erst Jahrzehnte später.'},
{id:'a31',g:'drais',topic:'Erfindungen',d:2,info:'In Friedrichshafen am Bodensee baute Graf Ferdinand von Zeppelin riesige Luftschiffe. Das erste stieg im Jahr 1900 über dem Bodensee auf. Bis heute heißen solche Luftschiffe „Zeppeline“.',q:'Was baute Graf Zeppelin in Friedrichshafen?',opts:['Luftschiffe','Autos','Dampfschiffe','Eisenbahnen'],a:0,ex:'Zeppeline sind Luftschiffe mit einem festen Gerüst. In Friedrichshafen gibt es ein großes Zeppelin-Museum.'},
{id:'a32',g:'tier',topic:'Tiere',d:2,q:'Welches ist das größte Landtier der Welt?',opts:['Der Afrikanische Elefant','Die Giraffe','Das Nashorn','Der Eisbär'],a:0,ex:'Der Afrikanische Elefant wiegt bis zu 6 Tonnen. Die Giraffe ist zwar höher, aber viel leichter.'},
{id:'a33',g:'tier2',topic:'Tiere',d:1,q:'Wie viele Beine hat eine Spinne?',opts:['8','6','10','4'],a:0,ex:'Spinnen haben acht Beine, Insekten sechs.'},
{id:'a34',g:'tier2',topic:'Tiere',d:2,est:'Jahre',q:'Schätze zuerst: Wie alt kann eine Riesenschildkröte werden?',opts:['Über 150 Jahre','Etwa 10 Jahre','Etwa 30 Jahre','Etwa 1.000 Jahre'],a:0,ex:'Riesenschildkröten können weit über 150 Jahre alt werden – die älteste bekannte ist fast 200.'},
{id:'a35',g:'schild',topic:'Alltag',d:1,info:'Verkehrsschilder haben Formen mit Bedeutung: Dreieckig mit rotem Rand heißt Achtung, Gefahr. Rund mit rotem Rand heißt Verbot. Rund und blau heißt Gebot – das musst du tun.',q:'Was bedeutet ein dreieckiges Verkehrsschild mit rotem Rand?',opts:['Achtung, Gefahr','Verbot','Gebot','Parkplatz'],a:0,ex:'Dreieck mit rotem Rand warnt vor einer Gefahr, zum Beispiel einer Kreuzung oder Kindern.'},
{id:'a36',g:'schild',topic:'Alltag',d:2,q:'Was gilt an einem Zebrastreifen?',opts:['Autos müssen Fußgänger über die Straße lassen','Fußgänger müssen warten, bis kein Auto kommt','Radfahrer dürfen fahrend drüber und haben Vorrang','Nur Kinder dürfen ihn benutzen'],a:0,ex:'Fußgänger haben am Zebrastreifen Vorrang. Radfahrer nur dann, wenn sie absteigen und schieben.'},
{id:'a37',g:'gesund',topic:'Alltag',d:1,info:'Zähne sollte man mindestens zweimal am Tag zwei Minuten lang putzen – morgens und abends. Zucker schadet den Zähnen, weil Bakterien daraus Säure machen.',q:'Wie lange solltest du deine Zähne mindestens putzen?',opts:['Zwei Minuten','Zehn Sekunden','30 Sekunden','Zehn Minuten'],a:0,ex:'Zwei Minuten, zweimal am Tag. Eine Sanduhr oder ein Lied hilft beim Durchhalten.'},
{id:'a38',g:'geld',topic:'Alltag',d:2,q:'Du kaufst für 3,40 € ein und zahlst mit einem 5-€-Schein. Wie viel Wechselgeld bekommst du?',opts:['1,60 €','2,60 €','1,40 €','2,40 €'],a:0,ex:'Von 3,40 € bis 4 € sind es 60 Cent, bis 5 € noch 1 €. Zusammen: 1,60 €.'},
{id:'a39',g:'sport',topic:'Sport',d:2,q:'Wie oft finden die Olympischen Sommerspiele statt?',opts:['Alle vier Jahre','Jedes Jahr','Alle zwei Jahre','Alle zehn Jahre'],a:0,ex:'Alle vier Jahre. Die Winterspiele liegen genau dazwischen, deshalb gibt es alle zwei Jahre Olympia.'},
{id:'a40',g:'sport',topic:'Sport',d:1,q:'Wie viele Ringe hat die olympische Flagge?',opts:['5','4','6','7'],a:0,ex:'Fünf verbundene Ringe – sie stehen für die Kontinente, die sich bei den Spielen treffen.'},
{id:'a41',g:'raum',topic:'Weltraum',d:1,q:'Welcher Planet wird „Roter Planet“ genannt?',opts:['Mars','Venus','Jupiter','Merkur'],a:0,ex:'Der Mars ist mit rostrotem Staub bedeckt – daher seine Farbe.'},
{id:'a42',g:'raum',topic:'Weltraum',d:3,q:'Wie heißt der deutsche Astronaut aus Künzelsau, der zweimal auf der Raumstation ISS war?',opts:['Alexander Gerst','Neil Armstrong','Matthias Maurer','Sigmund Jähn'],a:0,ex:'Alexander Gerst flog 2014 und 2018 zur ISS – beim zweiten Mal war er sogar Kommandant.'},
{id:'a43',g:'sprache',topic:'Welt',d:1,q:'In welchem Land spricht man Niederländisch?',opts:['In den Niederlanden','In Dänemark','In Schweden','In Polen'],a:0,ex:'Niederländisch spricht man in den Niederlanden und im Norden Belgiens.'},
{id:'a44',g:'sprache',topic:'Welt',d:2,q:'Wie viele Landessprachen hat die Schweiz?',opts:['4','1','2','3'],a:0,ex:'Deutsch, Französisch, Italienisch und Rätoromanisch – vier Landessprachen.'},
{id:'a45',g:'religion',topic:'Religionen',d:2,info:'Judentum, Christentum und Islam haben gemeinsame Wurzeln und berufen sich alle auf Abraham. Ihre Gotteshäuser heißen Synagoge, Kirche und Moschee.',q:'Wie heißt das Gotteshaus im Judentum?',opts:['Synagoge','Moschee','Kirche','Pagode'],a:0,ex:'Juden beten in der Synagoge, Muslime in der Moschee, Christen in der Kirche. Pagoden sind buddhistische Tempel.'},
{id:'a46',g:'kal',topic:'Alltag',d:1,q:'Wie viele Monate im Jahr haben 31 Tage?',opts:['7','6','5','8'],a:0,ex:'Januar, März, Mai, Juli, August, Oktober, Dezember – sieben. Trick: Zähl an den Fingerknöcheln ab.'},
{id:'a47',g:'kal',topic:'Alltag',d:2,q:'In welchem Monat beginnt der Frühling laut Kalender?',opts:['Im März','Im April','Im Februar','Im Mai'],a:0,ex:'Frühlingsanfang ist um den 20. März – dann sind Tag und Nacht ungefähr gleich lang.'},
{id:'a48',g:'pw',topic:'Sicher im Internet',d:1,info:'Ein gutes Passwort ist lang, mischt Buchstaben, Zahlen und Zeichen und wird niemandem verraten – auch nicht der besten Freundin oder dem besten Freund.',q:'Welches Passwort ist am [[sichersten]]?',opts:['Seeblick!Lindau27#','12345','max2015','passwort'],a:0,ex:'Lang und gemischt ist schwer zu erraten. Namen, Geburtsjahre und Zahlenreihen probieren Angreifer als Erstes.'},
{id:'a49',g:'pw',topic:'Sicher im Internet',d:1,info:'Persönliche Daten wie Adresse, Telefonnummer, Schule oder Fotos gibt man im Internet nicht an Fremde weiter.',q:'Ein Unbekannter fragt im Spiele-Chat nach deiner Adresse. Was tust du?',opts:['Nichts verraten und es den Eltern erzählen','Die Adresse schicken','Nur die Adresse der Schule schicken','Ein Foto vom Haus schicken'],a:0,ex:'Im Internet weißt du nie sicher, wer schreibt. Erzähl es einem Erwachsenen, dem du vertraust.'},
{id:'a50',g:'fake',topic:'Sicher im Internet',d:2,info:'Nicht alles im Internet stimmt. Falschmeldungen erkennt man oft an reißerischen Überschriften, fehlenden Quellen und daran, dass keine bekannte Nachrichtenseite darüber berichtet.',q:'Woran erkennst du eher eine Falschmeldung?',opts:['Reißerische Überschrift, keine Quelle','Sie steht auf einer bekannten Nachrichtenseite','Mehrere Zeitungen berichten das Gleiche','Datum und Verfasser sind angegeben'],a:0,ex:'„UNGLAUBLICH!!!“ ohne Quelle ist ein Warnzeichen. Prüf, ob seriöse Seiten das auch melden.'},
{id:'a51',g:'fake',topic:'Sicher im Internet',d:2,info:'Fotos von anderen darf man nur weitergeben, wenn die abgebildeten Personen einverstanden sind. Was einmal verschickt ist, lässt sich kaum zurückholen.',q:'Darfst du ein Foto von Mitschülern einfach in eine Gruppe stellen?',opts:['Nein, nur wenn sie einverstanden sind','Ja, immer','Ja, wenn es lustig ist','Ja, wenn die Gruppe klein ist'],a:0,ex:'Jeder hat das Recht am eigenen Bild. Frag also vorher.'},
{id:'a52',g:'muell',topic:'Umwelt',d:1,info:'In Deutschland trennt man Müll: Papier in die Papiertonne, Verpackungen aus Plastik und Metall in den Gelben Sack, Essensreste in die Biotonne, Glas in den Glascontainer.',q:'Wohin gehört ein leerer Joghurtbecher?',opts:['In den Gelben Sack','In die Biotonne','In die Papiertonne','In den Glascontainer'],a:0,ex:'Der Becher ist eine Plastikverpackung – also Gelber Sack. Den Deckel aus Alu am besten abtrennen.'},
{id:'a53',g:'muell',topic:'Umwelt',d:2,q:'Wohin gehören Kartoffelschalen?',opts:['In die Biotonne','In den Gelben Sack','In die Papiertonne','In den Glascontainer'],a:0,ex:'Aus Bioabfall wird Kompost oder Biogas. Kartoffelschalen gehören deshalb in die Biotonne.'},
{id:'a54',g:'energie',topic:'Umwelt',d:1,info:'Strom sparen schont die Umwelt: Licht aus, wenn man den Raum verlässt, und Geräte ganz ausschalten statt auf Standby.',q:'Wie sparst du Strom?',opts:['Licht ausschalten, wenn du rausgehst','Den Fernseher auf Standby lassen','Das Ladegerät stecken lassen','Die Kühlschranktür offen lassen'],a:0,ex:'Auch Standby und eingesteckte Ladegeräte verbrauchen ständig ein bisschen Strom.'},
{id:'a55',g:'energie',topic:'Umwelt',d:2,info:'Erneuerbare Energien gehen nicht aus: Sonne, Wind und Wasser. Kohle, Öl und Gas sind dagegen begrenzt und schaden beim Verbrennen dem Klima.',q:'Welche Energiequelle ist erneuerbar?',opts:['Wind','Kohle','Erdöl','Erdgas'],a:0,ex:'Wind weht immer wieder. Kohle, Öl und Gas sind in Millionen Jahren entstanden und irgendwann verbraucht.'},
{id:'a56',g:'plastik',topic:'Umwelt',d:2,info:'Plastik zerfällt in der Natur nur sehr langsam. Winzige Teilchen, das Mikroplastik, landen in Flüssen, Seen und Meeren – und in Fischen.',q:'Warum ist Plastikmüll in der Natur ein Problem?',opts:['Er zerfällt nur sehr langsam','Er löst sich sofort auf','Er düngt den Boden','Er ist zu schwer zum Wegtragen'],a:0,ex:'Eine Plastikflasche braucht Hunderte Jahre, bis sie zerfallen ist.'},
{id:'a57',g:'bayern',topic:'Bayern',d:1,info:'Die bayerischen Landesfarben sind Weiß und Blau. Das blau-weiße Rautenmuster sieht man auf vielen Fahnen und Wappen.',q:'Welche Farben hat die bayerische Flagge?',opts:['Weiß und Blau','Rot und Weiß','Schwarz, Rot, Gold','Grün und Weiß'],a:0,ex:'Weiß-Blau ist Bayern. Schwarz-Rot-Gold ist die Flagge Deutschlands.'},
{id:'a58',g:'bayern',topic:'Bayern',d:2,info:'Bayern ist in sieben Regierungsbezirke gegliedert, zum Beispiel Oberbayern, Niederbayern, Schwaben und Oberfranken. Lindau gehört zu Schwaben.',q:'Zu welchem Regierungsbezirk gehört Lindau?',opts:['Schwaben','Oberbayern','Niederbayern','Oberpfalz'],a:0,ex:'Lindau liegt im Regierungsbezirk Schwaben, wie auch Augsburg und Kempten.'},
{id:'a59',g:'bayern2',topic:'Bayern',d:2,info:'Schloss Neuschwanstein bei Füssen ließ König Ludwig II. bauen. Es gilt als Vorbild für das Disney-Schloss und wird jedes Jahr von über einer Million Menschen besucht.',q:'Wer ließ Schloss Neuschwanstein bauen?',opts:['König Ludwig II.','Kaiser Augustus','Karl der Große','Graf Zeppelin'],a:0,ex:'Ludwig II. liebte Märchen und Sagen – sein Schloss sieht deshalb aus wie aus einem Märchen.'},
{id:'a60',g:'bayern2',topic:'Bayern',d:1,q:'Wie heißt das große Volksfest im Herbst in München?',opts:['Oktoberfest','Kieler Woche','Bremer Freimarkt','Hamburger Dom'],a:0,ex:'Das Oktoberfest auf der Theresienwiese ist das größte Volksfest der Welt – und beginnt meist schon im September.'},
{id:'a61',g:'sport2',topic:'Sport',d:1,q:'Wie viele Spieler einer Mannschaft stehen beim Basketball gleichzeitig auf dem Feld?',opts:['5','6','7','11'],a:0,ex:'Beim Basketball sind es fünf pro Mannschaft, beim Handball sieben, beim Fußball elf.'},
{id:'a62',g:'sport2',topic:'Sport',d:2,info:'Beim Tennis zählt man die Punkte eines Spiels so: 15, 30, 40 – dann Spiel. Steht es 40 zu 40, heißt das „Einstand“.',q:'Wie heißt der Spielstand 40 : 40 beim Tennis?',opts:['Einstand','Unentschieden','Matchball','Halbzeit'],a:0,ex:'Nach dem Einstand muss ein Spieler zwei Punkte hintereinander machen, um das Spiel zu gewinnen.'},
{id:'a63',g:'sport3',topic:'Sport',d:2,est:'km',q:'Schätze zuerst: Wie lang ist ein Marathonlauf?',opts:['Etwa 42 km','Etwa 10 km','Etwa 21 km','Etwa 100 km'],a:0,ex:'Genau 42,195 km. Ein Halbmarathon ist halb so lang.'},
{id:'a64',g:'kunst2',topic:'Kunst',d:1,info:'Warme Farben sind Rot, Orange und Gelb – sie erinnern an Feuer und Sonne. Kalte Farben sind Blau, Grün und Violett – sie erinnern an Wasser und Eis.',q:'Welche Farbe ist eine [[kalte]] Farbe?',opts:['Blau','Rot','Orange','Gelb'],a:0,ex:'Blau wirkt kühl wie Wasser. Rot, Orange und Gelb wirken warm.'},
{id:'a65',g:'kunst2',topic:'Kunst',d:2,info:'Komplementärfarben stehen sich im Farbkreis gegenüber und lassen sich gegenseitig leuchten: Rot und Grün, Blau und Orange, Gelb und Violett.',q:'Was ist die Komplementärfarbe von Blau?',opts:['Orange','Grün','Rot','Gelb'],a:0,ex:'Blau und Orange liegen sich im Farbkreis genau gegenüber.'},
{id:'a66',g:'kunst3',topic:'Kunst',d:2,info:'Albrecht Dürer aus Nürnberg war einer der berühmtesten deutschen Maler. Bekannt sind sein Selbstbildnis und der „Feldhase“, ein sehr genaues Bild eines Hasen.',q:'Welches Tier hat Albrecht Dürer besonders berühmt gemalt?',opts:['Einen Hasen','Einen Elefanten','Einen Wal','Einen Drachen'],a:0,ex:'Der „Feldhase“ ist über 500 Jahre alt – man sieht darauf fast jedes einzelne Haar.'},
{id:'a67',g:'raum2',topic:'Weltraum',d:1,q:'Um welchen Stern kreist die Erde?',opts:['Um die Sonne','Um den Mond','Um den Mars','Um den Polarstern'],a:0,ex:'Die Sonne ist ein Stern. Der Mond kreist um die Erde, nicht umgekehrt.'},
{id:'a68',g:'raum2',topic:'Weltraum',d:2,q:'Wie lange braucht der Mond ungefähr für eine Runde um die Erde?',opts:['Etwa einen Monat','Einen Tag','Ein Jahr','Eine Woche'],a:0,ex:'Etwa 27 bis 29 Tage. Das Wort „Monat“ kommt sogar von „Mond“.'},
{id:'a69',g:'raum3',topic:'Weltraum',d:2,q:'Welcher Planet hat besonders auffällige Ringe?',opts:['Saturn','Mars','Venus','Merkur'],a:0,ex:'Die Ringe des Saturn bestehen aus Eis- und Gesteinsbrocken. Schon mit einem kleinen Fernrohr kann man sie sehen.'},
{id:'a70',g:'instr',topic:'Musik',d:1,q:'Zu welcher Instrumentengruppe gehört die Geige?',opts:['Saiteninstrumente','Blasinstrumente','Schlaginstrumente','Tasteninstrumente'],a:0,ex:'Bei der Geige streicht ein Bogen über Saiten – sie ist ein Streich- und damit Saiteninstrument.'},
{id:'a71',g:'instr',topic:'Musik',d:2,info:'Ob ein Blasinstrument zu den Holz- oder Blechbläsern gehört, hängt davon ab, wie der Ton entsteht – nicht vom Material. Die Querflöte ist meist aus Metall, zählt aber zu den Holzblasinstrumenten.',q:'Welches Instrument ist ein Holzblasinstrument, obwohl es meist aus Metall ist?',opts:['Die Querflöte','Die Trompete','Die Posaune','Die Tuba'],a:0,ex:'Bei Blechbläsern summen die Lippen ins Mundstück. Bei der Querflöte bläst man über eine Kante – wie bei Holzbläsern.'},
{id:'a72',g:'komp',topic:'Musik',d:2,info:'Ludwig van Beethoven wurde 1770 in Bonn geboren. Obwohl er im Alter taub wurde, komponierte er weiter – zum Beispiel die 9. Sinfonie mit der „Ode an die Freude“, heute die Europahymne.',q:'Welche Melodie von Beethoven ist heute die Europahymne?',opts:['Ode an die Freude','Für Elise','Die Zauberflöte','Stille Nacht'],a:0,ex:'„Für Elise“ ist auch von Beethoven – aber die Europahymne ist die „Ode an die Freude“. Die Zauberflöte ist von Mozart.'},
{id:'a73',g:'erfind3',topic:'Erfindungen',d:2,info:'Rudolf Diesel entwickelte in Augsburg einen sparsamen Motor, der bis heute nach ihm benannt ist.',q:'Wonach ist der Dieselmotor benannt?',opts:['Nach seinem Erfinder Rudolf Diesel','Nach einem Fluss','Nach einer Stadt','Nach einem Treibstoff, den es schon vorher gab'],a:0,ex:'Erst kam der Erfinder, dann der Motor – und der Kraftstoff wurde nach dem Motor „Diesel“ genannt.'},
{id:'a74',g:'erfind3',topic:'Erfindungen',d:1,q:'Was hat Johannes Gutenberg erfunden?',opts:['Den Buchdruck mit beweglichen Buchstaben','Das Telefon','Das Auto','Das Fahrrad'],a:0,ex:'Gutenberg druckte um 1450 in Mainz – das veränderte, wie Wissen sich verbreitet.'},
{id:'a75',g:'tier3',topic:'Tiere',d:1,q:'Welches Tier hält einen echten Winterschlaf?',opts:['Der Igel','Der Fuchs','Das Reh','Das Eichhörnchen'],a:0,ex:'Der Igel schläft den ganzen Winter. Das Eichhörnchen hält nur Winterruhe und wacht immer wieder auf, um an seine Vorräte zu gehen.'},
{id:'a76',g:'tier3',topic:'Tiere',d:2,q:'Welches ist das schnellste Tier der Welt (im Sturzflug)?',opts:['Der Wanderfalke','Der Gepard','Der Adler','Die Schwalbe'],a:0,ex:'Im Sturzflug erreicht der Wanderfalke über 300 km/h. Der Gepard ist nur das schnellste Landtier.'},
{id:'a77',g:'tier4',topic:'Tiere',d:2,est:'kg',q:'Schätze zuerst: Wie schwer kann ein ausgewachsener Afrikanischer Elefant werden?',opts:['Etwa 6.000 kg','Etwa 600 kg','Etwa 60.000 kg','Etwa 60 kg'],a:0,ex:'Bis zu etwa 6 Tonnen – so schwer wie vier Autos.'},
{id:'a78',g:'erstehilfe',topic:'Alltag',d:1,info:'Bei einem Notfall: Ruhe bewahren, 112 wählen und sagen, wo es passiert ist, was passiert ist und wie viele Verletzte es gibt. Dann nicht auflegen, sondern auf Rückfragen warten.',q:'Was tust du am Ende des Notrufs?',opts:['Auf Rückfragen warten','Sofort auflegen','Ein Foto machen','Weglaufen'],a:0,ex:'Die Leitstelle beendet das Gespräch. Vielleicht braucht sie noch wichtige Informationen.'},
{id:'a79',g:'uhr',topic:'Alltag',d:1,q:'Wie viele Minuten hat eine Dreiviertelstunde?',opts:['45','30','15','75'],a:0,ex:'Eine Stunde hat 60 Minuten, drei Viertel davon sind 45 Minuten.'},
{id:'a80',g:'welt2',topic:'Welt',d:1,q:'Wie heißt der höchste Berg der Welt?',opts:['Mount Everest','Zugspitze','Mont Blanc','Kilimandscharo'],a:0,ex:'Der Mount Everest im Himalaya ist fast 8.850 m hoch – dreimal so hoch wie die Zugspitze.'},
{id:'a81',g:'welt2',topic:'Welt',d:2,q:'Welches Land hat die meisten Einwohner?',opts:['Indien','USA','Russland','Brasilien'],a:0,ex:'Indien hat inzwischen mehr als 1,4 Milliarden Einwohner und hat China überholt.'},
{id:'a82',g:'religion2',topic:'Religionen',d:2,info:'Der Buddhismus geht auf Siddhartha Gautama zurück, einen Prinzen, der vor rund 2.500 Jahren in Indien lebte. Man nennt ihn Buddha, „der Erwachte“.',q:'Wo lebte Buddha?',opts:['In Indien','In Ägypten','In Italien','In Mexiko'],a:0,ex:'Buddha lebte im Norden Indiens. Heute ist der Buddhismus vor allem in Asien verbreitet.'}

function lev(a,b){const m=a.length,n=b.length;const D=Array.from({length:m+1},(_,i)=>Array.from({length:n+1},(_,j)=>i?(j?0:i):j));
 for(let i=1;i<=m;i++)for(let j=1;j<=n;j++){D[i][j]=Math.min(D[i-1][j]+1,D[i][j-1]+1,D[i-1][j-1]+(a[i-1]===b[j-1]?0:1));if(i>1&&j>1&&a[i-1]===b[j-2]&&a[i-2]===b[j-1])D[i][j]=Math.min(D[i][j],D[i-2][j-2]+1);}

 for(let i=1;i<=m;i++)for(let j=1;j<=n;j++)D[i][j]=Math.min(D[i-1][j]+1,D[i][j-1]+1,D[i-1][j-1]+(gl[i-1]===r[j-1]?0:1));

function pickTasks(pool,due,fresh,n,now,P){

 const k=Math.ceil(n*.4);const order=[...due.slice(0,k),...fresh,...due.slice(k)];
 const out=[],ids=new Set(),gr=new Set();
 for(const x of order){if(out.length>=n)break;if(ids.has(x.id)||(x.g&&gr.has(x.g)))continue;out.push(x);ids.add(x.id);if(x.g)gr.add(x.g);}

 const key=t.kind==='m'?t.id:t.subj+':'+t.topic;const tp=S.topics[key]||(S.topics[key]={name:SUBJ[t.subj].n+' · '+t.topic,n:0,r:0});tp.n++;if(ok)tp.r++;
 S.days[today()]=(S.days[today()]||0)+1;
 if(t.kind==='nt'){const p=S.progress[t.id]||{box:0,n:0,r:0};p.n++;if(ok){p.r++;p.box=Math.min(5,Math.max(1,p.box+(c==='s'?2:c==='z'?1:0)));}else p.box=1;const days=ok&&c==='g'?1:INT[p.box];p.due=Date.now()+days*864e5-3*36e5;S.progress[t.id]=p;}
 if(ok&&cur.kw)S.cnt.read++;
 if(!ok){R.again.push(t.subj==='vo'?t.item.v.en:t.topic);requeue(t);}save();feedback(ok,c,d,given,right);}
function requeue(t){if(t.requeued||R.extra>=3)return;let n;if(t.subj==='vo'){const x=t.item.v;n={kind:'nt',subj:'vo',item:vocabItem(x,t.item.typed?'type':'mc'),id:x.id,topic:x.topic,requeued:true};}else if(t.kind==='nt'){const ids=new Set(R.tasks.map(x=>x.id));const alt=BANK[t.subj].find(x=>x.g&&x.g===t.item.g&&x.id!==t.id&&!ids.has(x.id)&&levelOK(x)&&!x.est);const it=alt||t.item;n={kind:'nt',subj:t.subj,item:it,id:it.id,topic:it.topic,requeued:true};}else{n=mkMath(t.g,t.d);n.requeued=true;}
 R.tasks.splice(Math.min(R.i+4,R.tasks.length),0,n);R.extra++;}
function feedback(ok,c,d,given,right){const t=cur.t;const ex=t.kind==='nt'?t.item.ex:t.data.ex;let note='';
 if(!ok&&c==='s')note='Du warst dir sicher – genau solche Stellen lohnt es sich zu merken.';
 else if(ok&&c==='g')note='Gut geraten! Diese Aufgabe kommt bald wieder, damit du sie sicher kannst.';
 else if(!ok&&c==='g')note='Ehrlich eingeschätzt – das kostet keine Punkte.';
 const typed=t.item&&t.item.typed;
 if(typed&&!ok&&cur.near)note=(note?note+' ':'')+'Fast! Nur ein kleiner Tippfehler – schau dir die markierten Buchstaben genau an.';
 if(typed&&ok&&cur.capNote)note=cur.capNote+(note?' '+note:'');
 if(!ok&&cur.kw){const w=kwWord(cur.q);note=`Lies noch einmal genau: Das angestrichene Wort „${esc(w)}“ entscheidet, was gefragt ist.`+(note?' '+note:'');}
 const givenH=typed?diffWord(given,t.item.v.en):esc(given);
 let estLine='';if(cur.estVal!=null){if(t.kind==='m'){const ref=t.data.ans,close=Math.abs(cur.estVal-ref)<=Math.max(ref*.35,10);estLine=`<div>Dein Überschlag: <b>${fmtN(cur.estVal)}</b> – ${close?'passt gut.':'war weit weg. Runde beide Zahlen grob und rechne im Kopf.'}</div>`;}else estLine=`<div>Deine Schätzung: <b>${fmtN(cur.estVal)} ${t.item.est}</b></div>`;}
 app.innerHTML=header()+`<div class="card"><div class="small">${label(t)}</div><div class="qt" style="font-size:17px;color:var(--muted)">${plainQ(cur.q,cur.kw)}</div></div>
 <div class="card fb ${ok?'':'bad'} fade" style="margin-top:12px"><div class="fbh">${ok?'✓ Richtig':'Nicht ganz'}</div><div class="rows">${estLine}${ok?'':`<div>Deine Antwort: <b>${givenH}</b></div><div>Richtig ist: <b>${esc(right)}</b></div>`}</div>${!ok&&t.data&&t.data.col?(()=>{const f=cur.res.findIndex(x=>x!=='');return colStatic(t.data.col,cur.res.map((x,i)=>i<f?'':x),cur.n);})():''}<p>${ex}</p>${note?`<div class="note">${note}</div>`:''}${!ok&&R.tasks.slice(R.i+1).some(x=>x.requeued&&x.topic===t.topic)?'<div class="small" style="margin-top:10px">Gleich kommt noch eine ähnliche Aufgabe.</div>':''}</div>
 <div class="delta">${d>0?'+':''}${d} Denkpunkte</div><button class="btn primary" id="nx">Weiter</button>`;bindQuit();
 const go=()=>{R.i++;next();};if(ok)$('#nx').onclick=go;else timedBtn('nx','Verstanden',readMs(ex,2500,6500),go);}

function summary(){clearT();const n=R.n||1;S.rounds.push({t:Date.now(),s:R.s,l:S.settings.level,n:R.n,r:R.right,g:R.good});S.rounds=S.rounds.slice(-40);
 const last=S.rounds.slice(-3);let offer='';S.offerSkip=Math.max(0,(S.offerSkip||0)-1);
 if(!S.offerSkip&&last.length===3){if(S.settings.level==='R'&&last.every(x=>x.l==='R'&&x.n>=8&&x.r/x.n>=.8&&x.g/x.n>=.6))offer='up';if(S.settings.level==='G'&&last.every(x=>x.l==='G'&&x.n>=8&&x.r/x.n<.5))offer='down';}
 if(R.n){S.cnt.rounds++;if(R.n>=8&&!R.fast)S.cnt.calm++;if(R.n>=8&&R.right===R.n)S.cnt.perfect++;}
 const nb=newBadges();const sk=streak();
 save();const ag=[...new Set(R.again)];
 app.innerHTML=`<div class="small">Runde geschafft</div><div class="card fade" style="margin-top:12px"><div class="big">${R.right} <span class="muted" style="font-size:22px">von ${R.n} richtig</span></div>
 <div class="kv"><span>Denkpunkte</span><span>${R.pts>0?'+':''}${R.pts}</span><span>Gut überlegt (richtig und sicher)</span><span>${R.good}</span><span>Zu schnell geklickt</span><span>${R.fast}</span>${sk.n?`<span>Serie</span><span>${sk.n} ${sk.n===1?'Tag':'Tage'} in Folge</span>`:''}</div></div>
 ${nb.length?`<h2>Neues Abzeichen</h2><div class="card fade" style="border-color:var(--acc)">${nb.map(b=>`<div class="newb">${ico(b.ic,b.streak?'fl':'',b.id)}<div><div style="font-weight:700">${b.n}</div><div class="small">${b.d}</div></div></div>`).join('')}</div>`:''}
 ${ag.length?`<h2>Kommt wieder</h2><div class="card"><ul class="list">${ag.map(a=>`<li><span>${a}</span><span class="muted">üben wir nochmal</span></li>`).join('')}</ul></div>`:''}
 ${offer==='up'?`<div class="card offer fade"><b>Das läuft richtig gut.</b><p class="expl" style="color:var(--text)">Drei starke Runden hintereinander. Willst du schwierigere Aufgaben auf Gymnasium-Niveau ausprobieren?</p><button class="btn primary" id="oy">Ja, schwieriger</button><button class="btn ghost" id="on">Noch nicht</button></div>`:''}
 ${offer==='down'?`<div class="card offer fade"><b>Die letzten Runden waren knifflig.</b><p class="expl" style="color:var(--text)">Willst du eine Weile auf Realschul-Niveau üben und dann wieder hochschalten?</p><button class="btn primary" id="oy">Ja, etwas leichter</button><button class="btn ghost" id="on">Nein, dranbleiben</button></div>`:''}
 ${rewardCard(R.won)}
 <button class="btn ${R.won?'ghost':'primary'}" id="again">Noch eine Runde</button><button class="btn ghost" id="home">Zur Übersicht</button>`;
 const s=R.s;$('#again').onclick=()=>startRound(s);$('#home').onclick=home;bindReward();
 if(offer){$('#oy').onclick=()=>{S.settings.level=offer==='up'?'G':'R';S.offerSkip=3;save();home();};$('#on').onclick=()=>{S.offerSkip=3;save();$('.offer').remove();};}}

/* ---------- Eltern ---------- */
function parents(){clearT();const L=S.settings.level,F=S.settings.readF,VL=S.vocab.lists||(S.vocab.lists=[]);
 const sub=k=>{const s=S.stats[k];if(!s||!s.n)return`<div class="card" style="margin-top:10px"><b>${SUBJ[k].n}</b><p class="expl">Noch keine Aufgaben gelöst.</p></div>`;
  const pc=(a,b)=>b?Math.round(a/b*100)+' %':'–';const cs=s.conf.s,cg=s.conf.g;
  return`<div class="card" style="margin-top:10px"><b>${SUBJ[k].n}</b><div class="kv"><span>Aufgaben gelöst</span><span>${s.n}</span><span>Richtig</span><span>${pc(s.r,s.n)}</span><span>Wenn „sicher“: davon richtig</span><span>${pc(cs[1],cs[0])}</span><span>Anteil „geraten“</span><span>${pc(cg[0],s.n)}</span><span>Zu schnell geklickt</span><span>${s.fast||0}</span></div></div>`;};
 const weak=Object.values(S.topics).filter(t=>t.n>=2).sort((a,b)=>a.r/a.n-b.r/b.n).slice(0,6);
 const days=[];for(let i=6;i>=0;i--){const d=new Date(Date.now()-i*864e5);const k=d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();days.push([['So','Mo','Di','Mi','Do','Fr','Sa'][d.getDay()],S.days[k]||0]);}const mx=Math.max(10,...days.map(x=>x[1]));
 app.innerHTML=`<div class="bar"><button class="x" id="back" aria-label="Zurück">←</button><div style="flex:1;font-weight:700">Eltern-Ansicht</div></div>
 <div class="card"><div class="lbl2" style="margin-top:0">Name</div><input class="field" id="nm" value="${esc(S.settings.name)}" maxlength="20">
 <div class="lbl2">Niveau</div><div class="seg" id="lv"><button data-v="R" class="${L==='R'?'on':''}">Realschule</button><button data-v="G" class="${L==='G'?'on':''}">Gymnasium</button></div>
 <div class="lbl2">Lesezeit, bevor Antworten erscheinen</div><div class="seg" id="rf"><button data-v="0.75" class="${F==.75?'on':''}">Kürzer</button><button data-v="1" class="${F==1?'on':''}">Normal</button><button data-v="1.35" class="${F==1.35?'on':''}">Länger</button></div>
 <div class="lbl2">Belohnungsspiele: Denkpunkte pro Spiel</div><div class="seg" id="rw">${[30,50,80,0].map(v=>`<button data-v="${v}" class="${S.settings.rewardNeed===v?'on':''}">${v||'Aus'}</button>`).join('')}</div>
 </div>
 <h2>Letzte 7 Tage</h2><div class="card"><div class="days">${days.map(([l,v])=>`<div><i style="height:${Math.round(v/mx*50)}px"></i>${l}</div>`).join('')}</div></div>
 <h2>Fächer</h2>${ORDER.map(sub).join('')}
 <h2>Schwächste Themen</h2><div class="card">${weak.length?`<ul class="list">${weak.map(t=>`<li><span>${t.name}</span><span class="muted">${t.r}/${t.n} richtig</span></li>`).join('')}</ul>`:'<p class="expl" style="margin:0">Noch zu wenige Daten.</p>'}</div>
 <h2>Eigene Vokabellisten</h2><div class="card">
  ${VL.length?`<ul class="list vl" style="margin:0 0 6px">${VL.map(l=>`<li><span><b>${esc(l.name)}</b> <span class="muted">· ${l.items.length} Wörter${l.on===false?' · pausiert':''}</span></span><span style="white-space:nowrap"><button class="lnk" data-act="tog" data-id="${l.id}">${l.on===false?'Aktivieren':'Pausieren'}</button> <button class="lnk" data-act="edit" data-id="${l.id}">Bearbeiten</button> <button class="lnk dang" data-act="del" data-id="${l.id}">Löschen</button></span></li>`).join('')}</ul>`:'<p class="expl" style="margin:0 0 6px">Noch keine eigene Liste. Trag hier die Vokabeln ein, die gerade in der Schule dran sind – sie kommen im Vokabeltrainer bevorzugt.</p>'}
  <div class="lbl2">${vlEdit?'Liste bearbeiten':'Neue Liste'} – Name</div><input class="field" id="vlname" maxlength="30" placeholder="z. B. Unit 3" value="${vlEdit?esc(vlEdit.name):''}">
  <div class="lbl2">Vokabeln – eine pro Zeile: englisch = deutsch</div><textarea class="field" id="vltext" spellcheck="false" placeholder="brother = Bruder&#10;to swim = schwimmen&#10;grandma = Oma / Großmutter">${vlEdit?esc(vlEdit.items.map(([e,d])=>e+' = '+d).join('\n')):''}</textarea>
  <div class="small" style="margin-top:6px">Mehrere richtige Antworten mit „/“ trennen. Statt „=“ geht auch ein Tabulator, z. B. beim Einfügen aus einer Tabelle.</div>
  <button class="btn primary" id="vlsave">${vlEdit?'Änderungen speichern':'Liste speichern'}</button>${vlEdit?'<button class="btn ghost" id="vlcancel">Abbrechen</button>':''}
  <div class="note" id="vlmsg" style="min-height:0"></div></div>
 <h2>So arbeitet die App</h2><div class="card"><p class="expl" style="margin:0">Antworten erscheinen erst nach einer Lesezeit. Bei manchen Fragen ist das entscheidende Wort mit Textmarker angestrichen – etwa „nicht“ oder „weniger“. Wird so eine Frage falsch beantwortet, weist das Feedback noch einmal darauf hin. Bei Schätzfragen und beim Multiplizieren wird zuerst geschätzt. Vor dem Abschicken gibt es eine Sicherheitsangabe: Sicher und richtig bringt am meisten, sicher und falsch kostet Punkte, ehrliches Raten kostet nichts. Neue Themen beginnen mit einem kurzen Wissenstext. Bei Wiederholungen fehlt er bewusst, damit aus dem Gedächtnis abgerufen wird. Fehler kommen in derselben Runde in abgewandelter Form wieder und am nächsten Tag erneut. Sicher Gewusstes pausiert wochenlang.</p>
 <p class="expl">Im Vokabeltrainer werden neue Wörter zuerst als Auswahl abgefragt, bekannte Wörter häufiger zum Eintippen. Groß- und Kleinschreibung und ein vorangestelltes „to“ spielen dabei keine Rolle. Ein einzelner falscher Buchstabe zählt als Fehler, wird aber im Feedback genau markiert.</p>
 <p class="expl">Der Balken auf jeder Fach-Kachel zeigt, wie viel davon sicher sitzt: Aufgaben, die mehrmals sicher richtig beantwortet wurden. In Mathe zählen Themen, in denen mindestens 80 % von wenigstens fünf Aufgaben richtig waren. Die Tages-Serie zählt Tage mit mindestens einer gelösten Aufgabe. Einen einzelnen verpassten Tag pro Woche überbrückt ein Joker automatisch. Abzeichen gibt es für gutes Lernverhalten: Fehler ausbügeln, ehrlich einschätzen, ruhig lesen.</p>
 <p class="expl">Belohnungsspiel: Die gesammelten Denkpunkte füllen einen Balken. Ist er voll (einstellbar: 30, 50 oder 80 Punkte), darf man ein Spiel wählen: Sternsplitter (Weltraum-Shooter) oder Nachtgarten (Igel im Labyrinth) – jeweils bis zum Spielende, höchstens aber 3 Minuten. Höchstens drei Spiele lassen sich ansparen. Weil sicher-falsche Antworten Punkte kosten, lohnt sich Durchklicken nicht.</p></div>
 <button class="btn ghost" id="reset" style="margin-top:28px;color:var(--bad)">Fortschritt zurücksetzen</button>`;
 $('#back').onclick=home;$('#nm').oninput=e=>{S.settings.name=e.target.value.trim()||'Max';save();};
 app.querySelectorAll('#lv button').forEach(b=>b.onclick=()=>{S.settings.level=b.dataset.v;save();parents();});
 app.querySelectorAll('#rf button').forEach(b=>b.onclick=()=>{S.settings.readF=+b.dataset.v;save();parents();});
 app.querySelectorAll('#rw button').forEach(b=>b.onclick=()=>{S.settings.rewardNeed=+b.dataset.v;save();parents();});
 const rs=$('#reset');rs.onclick=()=>{if(rs.dataset.c){const nm=S.settings.name,vl=S.vocab;S=JSON.parse(JSON.stringify(DEF));S.settings.name=nm;S.vocab=vl;save();parents();}else{rs.dataset.c=1;rs.textContent='Wirklich alles zurücksetzen? Nochmal tippen';}};
 // Vokabellisten
 const msg=t=>{$('#vlmsg').textContent=t;};
 app.querySelectorAll('.vl [data-act]').forEach(b=>b.onclick=()=>{const l=S.vocab.lists.find(x=>x.id===b.dataset.id);if(!l)return;const a=b.dataset.act;
  if(a==='tog'){l.on=l.on===false;save();parents();}
  else if(a==='edit'){vlEdit=l;parents();setTimeout(()=>$('#vlname').scrollIntoView({block:'center'}),30);}
  else if(a==='del'){if(b.dataset.c){S.vocab.lists=S.vocab.lists.filter(x=>x!==l);if(vlEdit===l)vlEdit=null;save();parents();}else{b.dataset.c=1;b.textContent='Wirklich löschen?';}}});
 if($('#vlcancel'))$('#vlcancel').onclick=()=>{vlEdit=null;parents();};
 $('#vlsave').onclick=()=>{const name=$('#vlname').value.trim();const {items,bad}=parseVocab($('#vltext').value);
  if(!name)return msg('Bitte gib der Liste einen Namen.');
  if(!items.length)return msg('Keine Vokabel erkannt. Schreib pro Zeile: englisch = deutsch');
  const seen=new Set();const uniq=items.filter(([e])=>{const k=e.toLowerCase();if(seen.has(k))return false;seen.add(k);return true;});
  if(vlEdit){vlEdit.name=name;vlEdit.items=uniq;}else S.vocab.lists.push({id:'L'+Date.now().toString(36),name,on:true,items:uniq});
  vlEdit=null;save();parents();msg(`${uniq.length} Vokabeln gespeichert.${bad.length?` ${bad.length} Zeile${bad.length>1?'n':''} nicht erkannt: „${bad[0].slice(0,30)}“${bad.length>1?' …':''}`:''}`);};}
let vlEdit=null;

newBadges();save();
home();
</script>
<script>/* Offline-Nutzung als installierte App */if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));</script>
</body>
