{id:'d34',g:'doppel',topic:'Rechtschreibung',d:1,info:'Nach einem kurzen, betonten Selbstlaut folgen meist zwei Mitlaute. Hört man nur einen, wird er verdoppelt: Ball, Kamm, Mutter, Sonne.',q:'Welches Wort ist richtig geschrieben?',opts:['die Sonne','die Sone','die Sohne','die Sonnne'],a:0,ex:'Das o in „Sonne“ ist kurz – deshalb wird das n verdoppelt.'},
{id:'d35',g:'doppel',topic:'Rechtschreibung',d:2,info:'Nach kurzem Selbstlaut schreibt man ck statt kk und tz statt zz: Decke, Glück, Katze, Platz. Nach l, n, r steht nie tz und nie ck: Wolke, Schrank, Herz.',q:'Welches Wort ist [[falsch]] geschrieben?',opts:['der Schranck','die Decke','das Glück','der Platz'],a:0,ex:'Nach n steht kein ck: der Schrank. Merksatz: „Nach l, n, r – das merke ja – steht nie tz und nie ck.“'},
{id:'d36',g:'gross',topic:'Rechtschreibung',d:1,q:'In welchem Satz ist alles richtig geschrieben?',opts:['Am Montag fahren wir nach Lindau.','am Montag fahren wir nach Lindau.','Am montag fahren wir nach Lindau.','Am Montag Fahren wir nach Lindau.'],a:0,ex:'Satzanfang groß, Nomen und Namen groß: Montag, Lindau. „fahren“ ist hier ein Verb – klein.'},
{id:'d37',g:'gross',topic:'Rechtschreibung',d:3,info:'Nach „etwas, nichts, viel, wenig, alles“ werden Adjektive zu Nomen und großgeschrieben: etwas Neues, nichts Gutes, alles Liebe.',q:'Welcher Satz ist richtig geschrieben?',opts:['Ich wünsche dir alles Gute.','Ich wünsche dir alles gute.','Ich wünsche dir Alles Gute.','ich wünsche dir alles Gute.'],a:0,ex:'„alles“ ist das Signalwort: „Gute“ wird hier als Nomen gebraucht und großgeschrieben. „alles“ selbst bleibt klein.'},
{id:'d38',g:'zeit',topic:'Zeitformen',d:1,info:'Das Präsens ist die Gegenwart: Es beschreibt, was jetzt passiert oder immer gilt: Ich lese. Die Sonne scheint.',q:'Welcher Satz steht im Präsens?',opts:['Der Vogel singt im Baum.','Der Vogel sang im Baum.','Der Vogel hat im Baum gesungen.','Der Vogel wird im Baum singen.'],a:0,ex:'„singt“ ist Präsens. „sang“ ist Präteritum, „hat gesungen“ Perfekt, „wird singen“ Futur.'},
{id:'d39',g:'zeit',topic:'Zeitformen',d:3,info:'Das Plusquamperfekt zeigt, dass etwas noch vor einem anderen vergangenen Ereignis passiert war: „Nachdem wir gegessen hatten, gingen wir spazieren.“ Man bildet es mit „hatte“ oder „war“ und dem Partizip.',q:'In welcher Zeitform steht „Er hatte den Bus verpasst.“?',opts:['Plusquamperfekt','Perfekt','Präteritum','Futur'],a:0,ex:'„hatte … verpasst“ – Präteritum von „haben“ plus Partizip: Plusquamperfekt. Im Perfekt hieße es „Er hat den Bus verpasst.“'},
{id:'d40',g:'perfekt',topic:'Zeitformen',d:2,info:'Verben der Bewegung bilden das Perfekt meist mit „sein“: ich bin gelaufen, sie ist gefahren. Die meisten anderen Verben mit „haben“: ich habe gelesen.',q:'Ergänze: „Gestern ___ wir mit dem Rad zum See gefahren.“',opts:['sind','haben','hatten','werden'],a:0,ex:'„fahren“ ist eine Bewegung – also „sind gefahren“.'},
{id:'d41',g:'rede',topic:'Zeichensetzung',d:3,info:'Steht der Begleitsatz hinter der wörtlichen Rede, fällt der Punkt der Rede weg, und nach dem Anführungszeichen folgt ein Komma: „Ich komme mit“, sagt Mia. Frage- und Ausrufezeichen bleiben stehen.',q:'Welche Zeichensetzung ist richtig?',opts:['„Ich habe Hunger“, sagt Tim.','„Ich habe Hunger.“, sagt Tim.','„Ich habe Hunger“ sagt Tim.','„Ich habe Hunger,“ sagt Tim.'],a:0,ex:'Kein Punkt in der Rede, das Komma steht nach dem schließenden Anführungszeichen.'},
{id:'d42',g:'komma2',topic:'Zeichensetzung',d:2,info:'Vor „aber“ und „sondern“ steht immer ein Komma: Ich wollte kommen, aber ich war krank.',q:'Wo gehört das Komma hin? „Ich wollte schwimmen gehen aber das Wasser war zu kalt.“',opts:['Vor „aber“','Nach „aber“','Nach „Ich“','Es braucht keins'],a:0,ex:'„…, aber das Wasser war zu kalt.“ Vor „aber“ steht immer ein Komma.'},
{id:'d43',g:'zusammen',topic:'Wortschatz',d:1,info:'Zusammengesetzte Nomen bestehen aus zwei oder mehr Wörtern. Das letzte Wort (Grundwort) bestimmt den Artikel: das Haus + die Tür = die Haustür.',q:'Welchen Artikel hat „Schulbus“?',opts:['der','die','das'],a:0,ex:'Das Grundwort ist „Bus“ – der Bus. Also: der Schulbus.'},
{id:'d44',g:'synonym',topic:'Wortschatz',d:1,info:'Wörter mit gegenteiliger Bedeutung heißen Gegenwörter (Antonyme): hell – dunkel, laut – leise.',q:'Was ist das Gegenteil von „mutig“?',opts:['ängstlich','stark','fröhlich','schnell'],a:0,ex:'mutig – ängstlich. „stark“ ist das Gegenteil von „schwach“.'},
{id:'d45',g:'redew',topic:'Wortschatz',d:2,info:'Redewendungen meinen etwas anderes, als die Wörter wörtlich sagen. „Tomaten auf den Augen haben“ heißt zum Beispiel: etwas Offensichtliches nicht sehen.',q:'Was bedeutet „Da steppt der Bär“?',opts:['Dort ist viel los','Dort ist es gefährlich','Dort tanzt ein Tier','Dort ist es langweilig'],a:0,ex:'Wenn „der Bär steppt“, ist dort eine tolle Stimmung – zum Beispiel auf einer Party.'},
{id:'d46',g:'redew',topic:'Wortschatz',d:2,q:'Was bedeutet „jemandem einen Bären aufbinden“?',opts:['jemandem eine Lüge erzählen','jemandem ein Geschenk machen','jemandem beim Tragen helfen','jemanden erschrecken'],a:0,ex:'Wer einem anderen einen Bären aufbindet, erzählt ihm eine erfundene Geschichte, die der glauben soll.'},
{id:'d47',g:'fabel',topic:'Texte',d:1,info:'In Fabeln handeln und sprechen Tiere wie Menschen. Sie haben typische Eigenschaften – der Fuchs ist schlau, der Löwe stark – und am Ende steht oft eine Lehre, die Moral.',q:'Was steht am Ende einer Fabel oft?',opts:['Eine Lehre (Moral)','Ein Rezept','Ein Gedicht','Ein genaues Datum'],a:0,ex:'Fabeln wollen etwas lehren, zum Beispiel: „Wer anderen eine Grube gräbt, fällt selbst hinein.“'},
{id:'d48',g:'bericht',topic:'Texte',d:2,info:'Ein Bericht informiert sachlich über ein Ereignis. Er beantwortet die W-Fragen: Wer? Was? Wann? Wo? Wie? Warum? Er steht im Präteritum und enthält keine eigenen Gefühle.',q:'Was gehört [[nicht]] in einen Unfallbericht?',opts:['Wie spannend man den Unfall fand','Wann der Unfall passiert ist','Wo der Unfall passiert ist','Wer beteiligt war'],a:0,ex:'Ein Bericht ist sachlich. Gefühle und Spannung gehören in eine Erzählung, nicht in einen Bericht.'},
{id:'d49',g:'gedicht',topic:'Texte',d:2,info:'Gedichte bestehen aus Strophen, eine Strophe aus Versen (Zeilen). Reimen sich Zeile 1 und 2 sowie 3 und 4, ist das ein Paarreim (aabb). Beim Kreuzreim reimen sich 1 und 3 sowie 2 und 4 (abab).',q:'Die Zeilen eines Gedichts enden auf: Haus – Baum – Maus – Traum. Welches Reimschema ist das?',opts:['Kreuzreim','Paarreim','Umarmender Reim','Es reimt sich nichts'],a:0,ex:'Haus reimt sich auf Maus (Zeile 1 und 3), Baum auf Traum (Zeile 2 und 4) – abab, ein Kreuzreim.'},
{id:'d50',g:'erzaehl',topic:'Texte',d:3,info:'Eine Erzählung hat Einleitung, Hauptteil mit Höhepunkt und Schluss. Spannung entsteht durch Andeutungen, wörtliche Rede, Gefühle und treffende Verben.',q:'Welcher Satz macht eine Erzählung am [[spannendsten]]?',opts:['Plötzlich knackte hinter mir ein Ast.','Dann ging ich weiter.','Es war ein normaler Tag.','Danach ging ich nach Hause.'],a:0,ex:'„Plötzlich“ und das unerwartete Geräusch erzeugen Spannung – man will wissen, was kommt.'},
{id:'d51',g:'fall2',topic:'Fälle',d:1,info:'Den Nominativ erfragst du mit „Wer oder was?“. In ihm steht das Subjekt: „Der Hund bellt.“ – Wer bellt? Der Hund.',q:'In welchem Fall steht „der Hund“ in „Der Hund bellt.“?',opts:['Nominativ','Genitiv','Dativ','Akkusativ'],a:0,ex:'Wer oder was bellt? Der Hund – das ist der Nominativ.'},
{id:'d52',g:'fall2',topic:'Fälle',d:2,info:'Den Akkusativ erfragst du mit „Wen oder was?“: „Mia sieht den Hund.“ – Wen sieht Mia? Den Hund.',q:'In welchem Fall steht „den Ball“ in „Mia wirft den Ball.“?',opts:['Akkusativ','Nominativ','Dativ','Genitiv'],a:0,ex:'Wen oder was wirft Mia? Den Ball – Akkusativ.'},
{id:'d53',g:'fall3',topic:'Fälle',d:2,info:'Den Dativ erfragst du mit „Wem?“: „Ich helfe dem Opa.“ – Wem helfe ich? Dem Opa.',q:'In welchem Fall steht „dem Opa“ in „Ich helfe dem Opa.“?',opts:['Dativ','Akkusativ','Genitiv','Nominativ'],a:0,ex:'Wem helfe ich? Dem Opa – Dativ.'},
{id:'d54',g:'fall3',topic:'Fälle',d:2,q:'Ergänze den richtigen Artikel: „Ich gebe ___ Katze Futter.“',opts:['der','die','den','des'],a:0,ex:'Wem gebe ich Futter? Der Katze – im Dativ wird aus „die Katze“ „der Katze“.'},
{id:'d55',g:'fall4',topic:'Fälle',d:3,info:'Nach manchen Präpositionen steht immer der Dativ: aus, bei, mit, nach, seit, von, zu.',q:'Welcher Satz ist richtig?',opts:['Ich fahre mit dem Bus.','Ich fahre mit den Bus.','Ich fahre mit der Bus.','Ich fahre mit des Busses.'],a:0,ex:'Nach „mit“ steht der Dativ: mit dem Bus.'},
{id:'d56',g:'fall4',topic:'Fälle',d:3,info:'Nach in, an, auf, über, unter, vor, hinter, neben und zwischen fragt man: Wo? → Dativ. Wohin? → Akkusativ.',q:'Welcher Satz ist richtig?',opts:['Ich lege das Buch auf den Tisch.','Ich lege das Buch auf dem Tisch.','Ich lege das Buch auf der Tisch.','Ich lege das Buch auf des Tisches.'],a:0,ex:'Wohin lege ich das Buch? Auf den Tisch – Akkusativ. Aber: Das Buch liegt (wo?) auf dem Tisch.'},
{id:'d57',g:'fall5',topic:'Fälle',d:1,info:'Die vier Fälle heißen Nominativ, Genitiv, Dativ und Akkusativ. Die Fragen dazu: Wer? – Wessen? – Wem? – Wen?',q:'Mit welcher Frage findest du den Genitiv?',opts:['Wessen?','Wem?','Wen?','Wer?'],a:0,ex:'Wessen Fahrrad? Das Fahrrad meines Bruders – Genitiv.'},
{id:'d58',g:'fall5',topic:'Fälle',d:2,q:'Welche Frage gehört zum Dativ?',opts:['Wem?','Wessen?','Wen oder was?','Wer oder was?'],a:0,ex:'Wer = Nominativ, Wessen = Genitiv, Wem = Dativ, Wen = Akkusativ.'},
{id:'d59',g:'satzart',topic:'Satzarten',d:1,q:'Welches Satzzeichen steht am Ende eines Aussagesatzes?',opts:['Ein Punkt','Ein Fragezeichen','Ein Komma','Ein Doppelpunkt'],a:0,ex:'Aussagesätze enden mit einem Punkt: „Heute scheint die Sonne.“'},
{id:'d60',g:'satzart2',topic:'Satzarten',d:2,info:'Es gibt zwei Arten von Fragen: mit Fragewort („Wo wohnst du?“) und ohne Fragewort. Bei der zweiten steht das Verb vorne, und man antwortet mit Ja oder Nein („Kommst du mit?“).',q:'Auf welche Frage antwortet man mit Ja oder Nein?',opts:['Kommst du heute mit?','Wann kommst du heute?','Wer kommt heute mit?','Wohin gehst du heute?'],a:0,ex:'„Kommst du heute mit?“ hat kein Fragewort, das Verb steht vorne – eine Ja-Nein-Frage.'},
{id:'d61',g:'satzart2',topic:'Satzarten',d:2,info:'Aufforderungssätze sagen jemandem, was er tun soll. Das Verb steht dabei ganz vorne: „Komm her!“ – „Hilf mir bitte!“',q:'In welchem Satz steht das Verb an [[erster]] Stelle?',opts:['Hilf mir bitte!','Ich helfe dir.','Morgen helfe ich dir.','Wer hilft mir?'],a:0,ex:'Im Aufforderungssatz „Hilf mir bitte!“ steht das Verb vorne. In den anderen steht es an zweiter Stelle.'},
{id:'d62',g:'anrede',topic:'Zeichensetzung',d:2,info:'Eine Anrede trennt man mit Komma vom Rest des Satzes ab: „Lisa, kommst du?“ – „Komm her, Tom!“',q:'Welcher Satz ist richtig?',opts:['Tom, hilfst du mir?','Tom hilfst du mir?','Tom hilfst, du mir?','Tom, hilfst, du mir?'],a:0,ex:'„Tom“ ist eine Anrede und wird mit Komma abgetrennt.'},
{id:'d63',g:'rede3',topic:'Zeichensetzung',d:1,q:'Welche Zeichen setzt man um die wörtliche Rede?',opts:['Anführungszeichen','Klammern','Kommas','Bindestriche'],a:0,ex:'Wörtliche Rede steht in Anführungszeichen: „Ich komme mit.“'},
{id:'d64',g:'komma3',topic:'Zeichensetzung',d:2,info:'Stehen mehrere Adjektive vor einem Nomen, setzt man ein Komma, wenn man „und“ dazwischen setzen könnte: ein langer, spannender Film.',q:'Welcher Satz ist richtig?',opts:['Es war ein kalter, nasser Tag.','Es war ein kalter nasser, Tag.','Es war, ein kalter nasser Tag.','Es war ein, kalter, nasser Tag.'],a:0,ex:'„ein kalter und nasser Tag“ – weil „und“ passt, steht ein Komma zwischen den Adjektiven.'},
{id:'d65',g:'komma3',topic:'Zeichensetzung',d:3,info:'Vor „dass“ steht immer ein Komma, weil mit „dass“ ein Nebensatz beginnt.',q:'Wo fehlt das Komma? „Ich weiß dass du recht hast.“',opts:['Vor „dass“','Nach „dass“','Nach „du“','Es fehlt keins'],a:0,ex:'Richtig ist: „Ich weiß, dass du recht hast.“'},
{id:'d66',g:'wortfeld',topic:'Wortschatz',d:1,info:'Ein Wortfeld besteht aus Wörtern mit ähnlicher Bedeutung, zum Beispiel das Wortfeld „gehen“: laufen, rennen, schlendern, schleichen.',q:'Welches Wort gehört zum Wortfeld „sprechen“?',opts:['flüstern','schreiben','hören','lesen'],a:0,ex:'Flüstern ist leises Sprechen. Schreiben, hören und lesen sind andere Tätigkeiten.'},
{id:'d67',g:'wortfeld',topic:'Wortschatz',d:2,q:'Welches Verb beschreibt [[langsames]] Gehen am besten?',opts:['schlendern','rennen','sprinten','hüpfen'],a:0,ex:'Wer schlendert, geht gemütlich und langsam. Treffende Verben machen Texte lebendiger.'},
{id:'d68',g:'oberbeg',topic:'Wortschatz',d:1,info:'Ein Oberbegriff fasst mehrere Wörter zusammen: Apfel, Birne und Kirsche sind Obst. Die einzelnen Wörter heißen Unterbegriffe.',q:'Was ist der Oberbegriff zu Hammer, Säge und Zange?',opts:['Werkzeug','Möbel','Spielzeug','Fahrzeug'],a:0,ex:'Hammer, Säge und Zange sind Werkzeuge.'},
{id:'d69',g:'oberbeg',topic:'Wortschatz',d:2,q:'Welches Wort ist ein Unterbegriff von „Fahrzeug“?',opts:['Fahrrad','Straße','Ampel','Garage'],a:0,ex:'Ein Fahrrad ist ein Fahrzeug. Straße, Ampel und Garage gehören zum Verkehr, sind aber keine Fahrzeuge.'},
{id:'d70',g:'fremdw',topic:'Wortschatz',d:2,info:'Fremdwörter kommen aus anderen Sprachen, zum Beispiel aus dem Englischen (Computer), dem Französischen (Restaurant) oder dem Griechischen (Theater).',q:'Welches Wort kommt aus dem Französischen?',opts:['Restaurant','Computer','Wasser','Ball'],a:0,ex:'Restaurant ist französisch – man spricht es auch französisch aus. Computer kommt aus dem Englischen.'},
{id:'d71',g:'silbe',topic:'Rechtschreibung',d:1,info:'Wörter trennt man nach Sprechsilben: Ta-fel, Fens-ter, Was-ser. Ein „ck“ bleibt dabei zusammen: Zu-cker.',q:'Wie trennt man „Fenster“ richtig?',opts:['Fens-ter','Fen-ster','Fenst-er','Fe-nster'],a:0,ex:'Sprich langsam und klatsche: Fens – ter.'},
{id:'d72',g:'silbe',topic:'Rechtschreibung',d:2,q:'Wie trennt man „Zucker“ richtig?',opts:['Zu-cker','Zuc-ker','Zuck-er','Z-ucker'],a:0,ex:'„ck“ wird nie getrennt – es wandert ganz in die nächste Silbe: Zu-cker.'},
{id:'d73',g:'ss3',topic:'Rechtschreibung',d:2,q:'Welches Wort ist richtig geschrieben?',opts:['der Schluss','der Schluß','der Schlus','der Schlusss'],a:0,ex:'Kurzes u, also ss: der Schluss.'},
{id:'d74',g:'ss3',topic:'Rechtschreibung',d:2,q:'Welches Wort ist [[falsch]] geschrieben?',opts:['das Wasßer','groß','die Nuss','draußen'],a:0,ex:'Nach dem kurzen a in „Wasser“ steht ss. Groß und draußen haben langen Vokal bzw. au – deshalb ß.'},
{id:'d75',g:'auslaut',topic:'Rechtschreibung',d:1,info:'Ob ein Wort am Ende mit d oder t, g oder k, b oder p geschrieben wird, hörst du, wenn du es verlängerst: Hund – Hunde, Tag – Tage, Korb – Körbe.',q:'Wie schreibt man es richtig?',opts:['der Hund','der Hunt','der Hundt','der Hunnd'],a:0,ex:'Verlängern: die Hunde – man hört ein d.'},
{id:'d76',g:'auslaut',topic:'Rechtschreibung',d:2,q:'Wie schreibt man es richtig?',opts:['der Berg','der Berk','der Berck','der Bergk'],a:0,ex:'Verlängern: die Berge – man hört ein g.'},
{id:'d77',g:'aeu',topic:'Rechtschreibung',d:2,info:'Wörter mit ä und äu kann man oft von verwandten Wörtern mit a und au ableiten: Hände – Hand, Bäume – Baum. Sonst schreibt man meist e oder eu.',q:'Welches Wort ist richtig geschrieben?',opts:['die Häuser','die Heuser','die Hoiser','die Häußer'],a:0,ex:'Häuser kommt von Haus – deshalb äu.'},
{id:'d78',g:'aeu',topic:'Rechtschreibung',d:1,q:'Wie heißt die Mehrzahl von „Wand“?',opts:['Wände','Wende','Wänte','Wänder'],a:0,ex:'Wand → Wände: Aus a wird ä. „Wende“ ist ein anderes Wort.'},
{id:'d79',g:'pronomen2',topic:'Wortarten',d:1,q:'Welches Wort ist ein Pronomen?',opts:['sie','schnell','Tisch','laufen'],a:0,ex:'„sie“ steht für ein Nomen. „schnell“ ist ein Adjektiv, „Tisch“ ein Nomen, „laufen“ ein Verb.'},
{id:'d80',g:'praep2',topic:'Wortarten',d:1,q:'Welches Wort ist eine Präposition?',opts:['neben','Nachbar','nett','nennen'],a:0,ex:'„neben“ zeigt, wo etwas ist: neben dem Haus.'},
{id:'d81',g:'verb2',topic:'Wortarten',d:2,info:'Die Grundform des Verbs heißt Infinitiv: laufen, lesen, essen. Im Satz wird das Verb gebeugt: ich laufe, du läufst.',q:'Wie heißt der Infinitiv von „du isst“?',opts:['essen','isst','aß','gegessen'],a:0,ex:'Die Grundform ist „essen“. „aß“ ist Präteritum, „gegessen“ das Partizip.'},
{id:'d82',g:'nomen2',topic:'Wortarten',d:2,info:'Nomen erkennt man oft an ihren Endungen: -ung, -heit, -keit, -nis und -schaft. Solche Wörter schreibt man immer groß.',q:'Welches dieser Wörter ist ein Nomen?',opts:['Freundschaft','freundlich','befreundet','freundschaftlich'],a:0,ex:'Die Endung -schaft macht ein Nomen: die Freundschaft.'},
{id:'d83',g:'zeit4',topic:'Zeitformen',d:1,q:'Wie heißt das Präteritum von „ich singe“?',opts:['ich sang','ich singte','ich habe gesungen','ich sung'],a:0,ex:'„singen“ ist ein starkes Verb: ich singe – ich sang. „ich habe gesungen“ ist Perfekt.'},
{id:'d84',g:'zeit4',topic:'Zeitformen',d:2,q:'In welcher Zeitform steht „Sie las ein Buch.“?',opts:['Präteritum','Präsens','Perfekt','Futur'],a:0,ex:'„las“ ist die Präteritum-Form von „lesen“. Im Präsens hieße es „Sie liest“.'},
{id:'d85',g:'perfekt2',topic:'Zeitformen',d:2,q:'Ergänze: „Ich ___ meine Hausaufgaben gemacht.“',opts:['habe','bin','wird','sind'],a:0,ex:'„machen“ ist keine Bewegung – das Perfekt bildet man mit „haben“: Ich habe gemacht.'},
{id:'d86',g:'subj2',topic:'Satzglieder',d:1,q:'Was ist im Satz „Die Kinder spielen im Garten.“ das Subjekt?',opts:['Die Kinder','spielen','im Garten','Garten'],a:0,ex:'Wer oder was spielt? Die Kinder.'},
{id:'d87',g:'adverb2',topic:'Satzglieder',d:2,info:'Adverbiale Bestimmungen geben Umstände an: der Zeit (Wann?), des Ortes (Wo?), der Art und Weise (Wie?) und des Grundes (Warum?).',q:'Welche adverbiale Bestimmung ist „im Garten“ in „Die Kinder spielen im Garten.“?',opts:['Des Ortes','Der Zeit','Des Grundes','Der Art und Weise'],a:0,ex:'Wo spielen die Kinder? Im Garten – eine adverbiale Bestimmung des Ortes.'},
{id:'d88',g:'adverb2',topic:'Satzglieder',d:2,q:'Welche adverbiale Bestimmung ist „am Abend“ in „Am Abend lesen wir.“?',opts:['Der Zeit','Des Ortes','Des Grundes','Der Art und Weise'],a:0,ex:'Wann lesen wir? Am Abend – eine adverbiale Bestimmung der Zeit.'},
{id:'d89',g:'sage',topic:'Texte',d:2,info:'Sagen erzählen von außergewöhnlichen Ereignissen und haben oft einen wahren Kern: einen echten Ort, eine echte Person oder ein echtes Ereignis. Märchen spielen dagegen „irgendwo, irgendwann“.',q:'Was unterscheidet eine Sage von einem Märchen?',opts:['Sie hat oft einen wahren Kern, z. B. einen echten Ort','Sie hat immer ein Happy End','In ihr kommen nie Menschen vor','Sie ist immer gereimt'],a:0,ex:'Viele Sagen spielen an echten Orten – auch am Bodensee gibt es Sagen über Burgen und den See.'},
{id:'d90',g:'beschreib',topic:'Texte',d:2,info:'Bei einer Beschreibung schreibt man sachlich und in sinnvoller Reihenfolge, zum Beispiel vom Großen zum Kleinen oder von oben nach unten. Man schreibt im Präsens.',q:'In welcher Zeitform schreibt man eine Beschreibung?',opts:['Präsens','Präteritum','Perfekt','Futur'],a:0,ex:'Eine Beschreibung zeigt, wie etwas ist – also Präsens. Erzählungen stehen meist im Präteritum.'},
{id:'d91',g:'brief',topic:'Texte',d:1,info:'Ein Brief beginnt mit Ort und Datum oben rechts. Dann folgen Anrede, Text, Grußformel und Unterschrift.',q:'Was steht in einem Brief ganz [[oben]] rechts?',opts:['Ort und Datum','Die Grußformel','Die Unterschrift','Die Anrede'],a:0,ex:'Oben rechts: z. B. „Lindau, 10. November 2026“.'},
{id:'d92',g:'brief',topic:'Texte',d:2,q:'Welche Grußformel passt in einen Brief an die Schulleiterin?',opts:['Mit freundlichen Grüßen','Hdl','Tschüssi','Ciao Kakao'],a:0,ex:'In einem offiziellen Brief schreibt man höflich: „Mit freundlichen Grüßen“. Die anderen passen zu Nachrichten an Freunde.'}
];

const EN=[
{id:'e01',g:'be',topic:'Grammatik',d:1,info:'Das Verb „to be“ (sein) hat im Präsens drei Formen: I am – you/we/they are – he/she/it is.',q:'Ergänze: „My brother ___ eleven years old.“',opts:['is','are','am','be'],a:0,ex:'„my brother“ = he. Bei he, she, it heißt es „is“.'},
{id:'e02',g:'be',topic:'Grammatik',d:1,info:'„to be“: I am – you are – he/she/it is – we are – they are.',q:'Ergänze: „We ___ in the garden.“',opts:['are','is','am','be'],a:0,ex:'Bei „we“ heißt es „are“: We are in the garden.'},
{id:'e03',g:'simple',topic:'Simple Present',d:1,info:'Im Simple Present bekommt das Verb bei he, she, it ein -s: I play – she plays. Merkspruch: „He, she, it – das s muss mit!“',q:'Ergänze: „Tom ___ football every Saturday.“',opts:['plays','play','playing','is play'],a:0,ex:'Tom = he. Also bekommt das Verb ein -s: plays.'},
{id:'e04',g:'simple',topic:'Simple Present',d:2,info:'Das -s im Simple Present gibt es nur bei he, she, it. Bei I, you, we und they bleibt das Verb ohne -s: They play.',q:'Ergänze: „My [[parents]] ___ TV in the evening.“',opts:['watch','watches','watching','is watch'],a:0,ex:'„my parents“ = they – mehrere Personen. Deshalb kein -s: They watch TV.'},
{id:'e05',g:'neg',topic:'Simple Present',d:2,info:'Die Verneinung im Simple Present bildet man mit don’t oder doesn’t. Bei he, she, it heißt es doesn’t – und dann fällt das -s am Verb weg: She doesn’t like fish.',q:'Welcher Satz ist richtig?',opts:['She doesn’t like cats.','She don’t like cats.','She doesn’t likes cats.','She not like cats.'],a:0,ex:'Bei „she“ steht doesn’t. Das -s steckt schon in „does“, deshalb heißt es „like“, nicht „likes“.'},
{id:'e06',g:'neg',topic:'Simple Present',d:2,info:'Fragen im Simple Present bildet man mit Do oder Does: Do you like pizza? – Does he live here?',q:'Ergänze: „___ your sister play the piano?“',opts:['Does','Do','Is','Are'],a:0,ex:'„your sister“ = she. Bei he, she, it fragt man mit „Does“.'},
{id:'e07',g:'prog',topic:'Present Progressive',d:2,info:'Was gerade jetzt passiert, drückt man mit dem Present Progressive aus: am/is/are + Verb mit -ing. Signalwörter sind now, look und listen: „Look! The cat is sleeping.“',q:'Ergänze: „Listen! The baby ___.“',opts:['is crying','cries','cry','crying'],a:0,ex:'„Listen!“ zeigt: Es passiert gerade jetzt. Also: is + crying.'},
{id:'e08',g:'plural',topic:'Wortschatz',d:2,info:'Meist bildet man den Plural mit -s: book – books. Es gibt aber unregelmäßige Formen, die man lernen muss: child – children, man – men, mouse – mice.',q:'Was ist der Plural von „foot“?',opts:['feet','foots','feets','footes'],a:0,ex:'„foot“ ist unregelmäßig: one foot – two feet. Genauso: tooth – teeth.'},
{id:'e09',g:'artikel',topic:'Grammatik',d:1,info:'Vor einem Wort, das mit einem Vokal-Laut beginnt (a, e, i, o, u), steht „an“ statt „a“: an apple, an elephant – aber a banana, a dog.',q:'Ergänze: „I’ve got ___ orange.“',opts:['an','a'],a:0,ex:'„orange“ beginnt mit dem Vokal o. Deshalb: an orange.'},
{id:'e10',g:'tage',topic:'Wortschatz',d:1,q:'Welcher Wochentag kommt nach „Tuesday“?',opts:['Wednesday','Monday','Thursday','Friday'],a:0,ex:'Monday – Tuesday – Wednesday – Thursday – Friday – Saturday – Sunday. Wochentage schreibt man auf Englisch immer groß.'},
{id:'e11',g:'tiere',topic:'Wortschatz',d:1,q:'Was heißt „Schmetterling“ auf Englisch?',opts:['butterfly','bird','bee','beetle'],a:0,ex:'butterfly = Schmetterling. bee = Biene, beetle = Käfer, bird = Vogel.'},
{id:'e12',g:'gegenteil',topic:'Wortschatz',d:2,q:'What is the opposite of „expensive“?',opts:['cheap','small','old','short'],a:0,ex:'expensive = teuer, cheap = billig.'},
{id:'e13',g:'frage',topic:'Grammatik',d:1,info:'Fragewörter: who (wer), what (was), where (wo), when (wann), why (warum), how (wie).',q:'Ergänze: „___ do you live? – In Lindau.“',opts:['Where','Who','When','Why'],a:0,ex:'Die Antwort ist ein Ort – also fragt man mit „Where“ (wo).'},
{id:'e14',g:'possessiv',topic:'Grammatik',d:2,info:'Possessivbegleiter zeigen, wem etwas gehört: my, your, his (sein – bei Jungen und Männern), her (ihr – bei Mädchen und Frauen), its, our, their.',q:'Ergänze: „This is Anna. ___ dog is called Rex.“',opts:['Her','His','Its','Their'],a:0,ex:'Der Hund gehört Anna, einem Mädchen. Deshalb „her dog“.'},
{id:'e15',g:'can',topic:'Grammatik',d:1,info:'Nach „can“ (können) steht das Verb in der Grundform – ohne „to“ und ohne -s: She can swim.',q:'Welcher Satz ist richtig?',opts:['He can ride a bike.','He cans ride a bike.','He can rides a bike.','He can to ride a bike.'],a:0,ex:'„can“ bekommt nie ein -s, und das Verb danach bleibt in der Grundform.'},
{id:'e16',g:'there',topic:'Grammatik',d:2,info:'„There is“ benutzt man für eine Sache (Einzahl), „there are“ für mehrere: There is a cat. There are two dogs.',q:'Ergänze: „There ___ [[three]] apples on the table.“',opts:['are','is','am','be'],a:0,ex:'Drei Äpfel sind mehrere – also „there are“.'},
{id:'e17',g:'zahl',topic:'Wortschatz',d:1,q:'Wie schreibt man 13 auf Englisch?',opts:['thirteen','thirty','threeteen','three-teen'],a:0,ex:'13 = thirteen, 30 = thirty. Achtung bei der Aussprache: thirTEEN wird hinten betont.'},
{id:'e18',g:'zeit',topic:'Uhrzeit',d:2,info:'Bei englischen Uhrzeiten heißt „half past seven“ 7:30 – also eine halbe Stunde nach sieben. Achtung: Im Deutschen sagt man dazu „halb acht“.',q:'Wie spät ist es bei „half past four“?',opts:['4:30','3:30','4:15','4:45'],a:0,ex:'„half past four“ = halb nach vier = 4:30. Auf Deutsch: „halb fünf“.'},
{id:'e19',g:'past',topic:'Simple Past',d:3,info:'Im Simple Past bekommen regelmäßige Verben -ed: play – played. Unregelmäßige muss man lernen, zum Beispiel: see – saw, have – had, be – was/were.',q:'Ergänze: „Yesterday we ___ to the zoo.“',opts:['went','go','goes','goed'],a:0,ex:'„yesterday“ zeigt die Vergangenheit. „go“ ist unregelmäßig: go – went.'},
{id:'e20',g:'family',topic:'Wortschatz',d:1,q:'Who is your mother’s brother?',opts:['your uncle','your cousin','your aunt','your grandfather'],a:0,ex:'Der Bruder deiner Mutter ist dein Onkel = uncle. aunt = Tante, cousin = Cousin/Cousine.'},
{id:'e21',g:'praep',topic:'Wortschatz',d:2,info:'Ortsangaben: in (in), on (auf), under (unter), next to (neben), behind (hinter), in front of (vor).',q:'„The ball is [[under]] the table.“ Wo ist der Ball?',opts:['Unter dem Tisch','Auf dem Tisch','Neben dem Tisch','Hinter dem Tisch'],a:0,ex:'under = unter. Auf dem Tisch wäre „on the table“.'},
{id:'e22',g:'be',topic:'Grammatik',d:2,info:'Kurzformen von „to be“: I’m, you’re, he’s, she’s, we’re, they’re. Verneint: isn’t, aren’t – aber bei „I“ heißt es „I’m not“.',q:'Welcher Satz ist richtig?',opts:['I’m not hungry.','I amn’t hungry.','I isn’t hungry.','I aren’t hungry.'],a:0,ex:'„I am not“ kürzt man zu „I’m not“. Eine Form „amn’t“ gibt es nicht.'},
{id:'e23',g:'have',topic:'Grammatik',d:1,info:'„have got“ bedeutet haben oder besitzen: I/you/we/they have got – he/she/it has got.',q:'Ergänze: „She ___ got a new bike.“',opts:['has','have','is','are'],a:0,ex:'Bei he, she, it heißt es „has got“: She has got a new bike.'},
{id:'e24',g:'have',topic:'Grammatik',d:2,info:'Fragen mit „have got“ bildet man, indem have oder has an den Anfang rückt: Have you got a pet? – Has he got a sister?',q:'Ergänze: „___ you got a pet?“',opts:['Have','Has','Do','Are'],a:0,ex:'Bei „you“ steht „Have“ am Anfang: Have you got a pet?'},
{id:'e25',g:'simple',topic:'Simple Present',d:2,info:'Bei Verben auf -s, -sh, -ch, -x und -o hängt man bei he/she/it -es an: she watches, he goes, it fixes. Aus Mitlaut + y wird -ies: fly – flies.',q:'Ergänze: „My dad ___ to work by bus.“',opts:['goes','go','gos','going'],a:0,ex:'„my dad“ = he. „go“ endet auf -o, also: goes.'},
{id:'e26',g:'signal',topic:'Simple Present',d:2,info:'Signalwörter für das Simple Present sind always, often, usually, sometimes, never und every day. Sie zeigen: Das passiert regelmäßig.',q:'Ergänze: „We ___ breakfast at seven every day.“',opts:['have','are having','has','having'],a:0,ex:'„every day“ zeigt eine Gewohnheit – also Simple Present: We have breakfast.'},
{id:'e27',g:'prog',topic:'Present Progressive',d:2,q:'Ergänze: „Look! The children ___ in the lake.“',opts:['are swimming','swim','is swimming','swims'],a:0,ex:'„Look!“ – es passiert gerade. „the children“ = they, also: are swimming.'},
{id:'e28',g:'prog',topic:'Present Progressive',d:3,info:'Bei der -ing-Form wird nach einem kurzen, betonten Vokal der letzte Mitlaut verdoppelt: swim – swimming, run – running, sit – sitting. Ein stummes -e fällt weg: make – making.',q:'Wie schreibt man die -ing-Form von „run“?',opts:['running','runing','runeing','runnning'],a:0,ex:'Kurzes u, dann ein Mitlaut – das n wird verdoppelt: running.'},
{id:'e29',g:'plural',topic:'Wortschatz',d:1,q:'Was ist der Plural von „child“?',opts:['children','childs','childen','childrens'],a:0,ex:'child – children ist unregelmäßig. „childrens“ ist doppelt gemoppelt.'},
{id:'e30',g:'plural',topic:'Wortschatz',d:3,info:'Endet ein Nomen auf Mitlaut + y, wird der Plural zu -ies: baby – babies, city – cities. Nach Vokal + y bleibt das y: boy – boys, day – days.',q:'Was ist der Plural von „city“?',opts:['cities','citys','cityes','cites'],a:0,ex:'Vor dem y steht der Mitlaut t – also wird aus y ein -ies: cities.'},
{id:'e31',g:'genitiv',topic:'Grammatik',d:2,info:'Mit ’s zeigt man, wem etwas gehört: Tom’s bike = Toms Fahrrad. Bei Plural auf -s steht nur der Apostroph: my parents’ car.',q:'Wie sagt man „das Zimmer meiner Schwester“?',opts:['my sister’s room','my sisters room','the room my sister','my sister room'],a:0,ex:'Besitzer + ’s + Sache: my sister’s room.'},
{id:'e32',g:'pron',topic:'Grammatik',d:2,info:'Objektpronomen stehen nach dem Verb oder nach Präpositionen: me, you, him, her, it, us, them. „Can you help me?“',q:'Ergänze: „Where are Tom and Lisa? I can’t see ___.“',opts:['them','they','their','there'],a:0,ex:'Nach dem Verb „see“ steht das Objektpronomen: them. „they“ steht als Subjekt vor dem Verb.'},
{id:'e33',g:'imperativ',topic:'Grammatik',d:1,info:'Aufforderungen bildet man mit der Grundform des Verbs: Open the window! Verneint mit „Don’t“: Don’t run!',q:'Wie sagt man „Lauf nicht!“?',opts:['Don’t run!','Not run!','No run!','Doesn’t run!'],a:0,ex:'Verneinte Aufforderungen beginnen immer mit „Don’t“.'},
{id:'e34',g:'some',topic:'Grammatik',d:3,info:'„some“ benutzt man meist in bejahten Sätzen, „any“ in Fragen und verneinten Sätzen: I’ve got some apples. – Have you got any apples? – I haven’t got any apples.',q:'Ergänze: „Have you got ___ brothers or sisters?“',opts:['any','some','a','an'],a:0,ex:'Es ist eine Frage – deshalb „any“.'},
{id:'e35',g:'zeit',topic:'Uhrzeit',d:1,info:'„quarter past“ heißt Viertel nach, „quarter to“ heißt Viertel vor: quarter past three = 3:15.',q:'Wie spät ist es bei „quarter past three“?',opts:['3:15','2:45','3:45','3:30'],a:0,ex:'quarter past three = Viertel nach drei = 3:15.'},
{id:'e36',g:'zeit',topic:'Uhrzeit',d:2,q:'Wie sagt man 8:45 auf Englisch?',opts:['quarter to nine','quarter past eight','quarter to eight','half past eight'],a:0,ex:'8:45 ist Viertel vor neun: quarter to nine.'},
{id:'e37',g:'monat',topic:'Wortschatz',d:1,q:'Wie schreibt man „Oktober“ auf Englisch?',opts:['October','Oktober','Octobre','Octomber'],a:0,ex:'Im Englischen mit c: October. Monatsnamen schreibt man auf Englisch immer groß.'},
{id:'e38',g:'farbe',topic:'Wortschatz',d:1,q:'What colour is grass?',opts:['green','red','blue','yellow'],a:0,ex:'Grass is green – Gras ist grün.'},
{id:'e39',g:'schule',topic:'Wortschatz',d:1,q:'Was heißt „Radiergummi“ auf Englisch (britisch)?',opts:['rubber','ruler','pencil case','sharpener'],a:0,ex:'rubber = Radiergummi (amerikanisch: eraser). ruler = Lineal, pencil case = Federmäppchen, sharpener = Spitzer.'},
{id:'e40',g:'koerper',topic:'Wortschatz',d:1,q:'Was heißt „Knie“ auf Englisch?',opts:['knee','kne','nose','neck'],a:0,ex:'knee – das k am Anfang wird nicht gesprochen, genau wie bei „knife“ (Messer).'},
{id:'e41',g:'essen',topic:'Wortschatz',d:2,q:'What do you call the meal in the evening?',opts:['dinner','breakfast','lunch','snack'],a:0,ex:'breakfast = Frühstück, lunch = Mittagessen, dinner = Abendessen.'},
{id:'e42',g:'gegenteil',topic:'Wortschatz',d:1,q:'What is the opposite of „big“?',opts:['small','tall','long','heavy'],a:0,ex:'big = groß, small = klein. tall = groß gewachsen, heavy = schwer.'},
{id:'e43',g:'frage',topic:'Grammatik',d:2,q:'Ergänze: „___ is your birthday? – In May.“',opts:['When','Where','Who','What colour'],a:0,ex:'Die Antwort ist eine Zeit – also fragt man mit „When“ (wann).'},
{id:'e44',g:'frage',topic:'Grammatik',d:2,info:'„How many“ fragt nach einer Anzahl, die man zählen kann. „How much“ fragt nach dem Preis oder nach einer Menge, die man nicht zählen kann.',q:'Ergänze: „___ is this T-shirt? – It’s 12 pounds.“',opts:['How much','How many','How old','How long'],a:0,ex:'Gefragt ist der Preis: How much is this T-shirt?'},
{id:'e45',g:'past',topic:'Simple Past',d:3,q:'Ergänze: „Last summer I ___ my grandma in London.“',opts:['visited','visit','visits','visitted'],a:0,ex:'„last summer“ zeigt die Vergangenheit. „visit“ ist regelmäßig: visited.'},
{id:'e46',g:'past',topic:'Simple Past',d:3,info:'Das Simple Past von „to be“: I/he/she/it was – you/we/they were.',q:'Ergänze: „Where ___ you yesterday?“',opts:['were','was','are','did'],a:0,ex:'„yesterday“ = Vergangenheit, und bei „you“ heißt es „were“.'},
{id:'e47',g:'land',topic:'Landeskunde',d:2,info:'Großbritannien besteht aus England, Schottland und Wales. Zusammen mit Nordirland bildet es das Vereinigte Königreich (United Kingdom). Die Hauptstadt ist London.',q:'Was ist die Hauptstadt des Vereinigten Königreichs?',opts:['London','Edinburgh','Dublin','Manchester'],a:0,ex:'London. Edinburgh ist die Hauptstadt Schottlands, Dublin die Hauptstadt Irlands.'},
{id:'e48',g:'land',topic:'Landeskunde',d:2,info:'In Großbritannien bezahlt man mit dem Pfund (pound). In London fahren rote Doppeldeckerbusse – und man fährt auf der linken Straßenseite.',q:'Auf welcher Straßenseite fährt man in Großbritannien?',opts:['Links','Rechts','In der Mitte','Das ist egal'],a:0,ex:'In Großbritannien herrscht Linksverkehr. Deshalb sitzt der Fahrer im Auto rechts.'},
{id:'e49',g:'london',topic:'Landeskunde',d:1,info:'London ist die Hauptstadt des Vereinigten Königreichs. Durch die Stadt fließt die Themse (Thames). Bekannte Sehenswürdigkeiten sind Big Ben, der Tower of London und das Riesenrad London Eye.',q:'Welcher Fluss fließt durch London?',opts:['Die Themse','Der Rhein','Die Seine','Die Donau'],a:0,ex:'Die Themse (englisch: the Thames) fließt mitten durch London. Die Seine fließt durch Paris.'},
{id:'e50',g:'london',topic:'Landeskunde',d:2,info:'„Big Ben“ ist eigentlich der Name der großen Glocke im Uhrturm am Parlament in London. Der Turm selbst heißt Elizabeth Tower.',q:'Was ist „Big Ben“ eigentlich?',opts:['Eine große Glocke','Ein Riesenrad','Ein Fluss','Ein König'],a:0,ex:'Viele nennen den ganzen Turm „Big Ben“ – genau genommen ist es aber die Glocke darin.'},
{id:'e51',g:'schoolUK',topic:'Landeskunde',d:1,info:'In vielen Schulen in Großbritannien tragen die Kinder eine Schuluniform (school uniform) – oft mit Pullover, Hemd und Krawatte in den Farben der Schule.',q:'Was tragen viele Kinder in Großbritannien in der Schule?',opts:['Eine Schuluniform','Immer Sportkleidung','Eine Tracht','Nur Jeans'],a:0,ex:'Die school uniform ist in Großbritannien ganz normal. Jede Schule hat ihre eigenen Farben.'},
{id:'e52',g:'schoolUK',topic:'Landeskunde',d:2,info:'Mittags essen viele britische Kinder in der Schulkantine oder bringen eine „packed lunch“ mit: ein Pausenbrot, Obst und etwas zu trinken.',q:'Was ist eine „packed lunch“?',opts:['Ein mitgebrachtes Mittagessen','Ein Pausenhof','Ein Schulbus','Ein Sportfest'],a:0,ex:'„packed“ heißt eingepackt – eine packed lunch ist ein Essen, das man von zu Hause mitbringt.'},
{id:'e53',g:'foodUK',topic:'Landeskunde',d:2,info:'Ein bekanntes britisches Gericht ist „fish and chips“: frittierter Fisch mit Pommes. Zum „full English breakfast“ gehören Eier, Speck, Würstchen, Bohnen und Toast.',q:'Was bekommt man bei „fish and chips“?',opts:['Fisch mit Pommes','Fisch mit Kartoffelchips','Fischsuppe','Fischbrötchen'],a:0,ex:'Achtung, Falle: Im britischen Englisch heißen Pommes „chips“. Kartoffelchips heißen dort „crisps“.'},
{id:'e54',g:'prog3',topic:'Present Progressive',d:1,info:'Was gerade jetzt passiert, sagt man mit am/is/are + -ing: I am reading. – She is reading. – They are reading.',q:'Ergänze: „I ___ reading a book now.“',opts:['am','is','are','be'],a:0,ex:'Bei „I“ heißt es immer „am“: I am reading.'},
{id:'e55',g:'prog2',topic:'Present Progressive',d:2,info:'Fragen im Present Progressive: Am, is oder are rückt an den Anfang: „Are you listening?“ – „Is he sleeping?“',q:'Wie fragt man „Schläft das Baby gerade?“',opts:['Is the baby sleeping?','Does the baby sleeping?','The baby is sleeping?','Is the baby sleep?'],a:0,ex:'„is“ kommt nach vorne, das Verb behält seine -ing-Form: Is the baby sleeping?'},
{id:'e56',g:'prog2',topic:'Present Progressive',d:2,info:'Die Verneinung im Present Progressive bildet man mit isn’t oder aren’t + -ing: „She isn’t watching TV.“',q:'Welcher Satz ist richtig?',opts:['We aren’t playing football now.','We don’t playing football now.','We not playing football now.','We aren’t play football now.'],a:0,ex:'aren’t + playing. „don’t“ gehört zum Simple Present, nicht zum Present Progressive.'},
{id:'e57',g:'progvs',topic:'Present Progressive',d:3,info:'Simple Present für Gewohnheiten (every day, often), Present Progressive für das, was gerade passiert (now, look, today).',q:'Ergänze: „Every Sunday my dad ___ pancakes, but today he ___ a cake.“',opts:['makes … is making','is making … makes','make … making','makes … makes'],a:0,ex:'„Every Sunday“ ist eine Gewohnheit → makes. „today“ passiert gerade → is making.'},
{id:'e58',g:'simple2',topic:'Simple Present',d:1,q:'Ergänze: „She ___ in Lindau.“',opts:['lives','live','living','is live'],a:0,ex:'she = he/she/it, also bekommt das Verb ein -s: She lives in Lindau.'},
{id:'e59',g:'neg2',topic:'Simple Present',d:1,info:'Verneinen im Simple Present: I/you/we/they don’t – he/she/it doesn’t.',q:'Ergänze: „I ___ like spinach.“',opts:['don’t','doesn’t','not','am not'],a:0,ex:'Bei „I“ heißt es „don’t“: I don’t like spinach.'},
{id:'e60',g:'ies',topic:'Simple Present',d:2,info:'Endet ein Verb auf Mitlaut + y, wird bei he/she/it daraus -ies: fly – flies, cry – cries. Nach einem Selbstlaut + y bleibt das y: play – plays.',q:'Ergänze: „The bird ___ over the lake.“',opts:['flies','flys','flyes','fly'],a:0,ex:'Vor dem y steht der Mitlaut l – also wird aus fly bei „it“ flies.'},
{id:'e61',g:'adverb',topic:'Simple Present',d:2,info:'Häufigkeitswörter wie always, usually, often, sometimes und never stehen vor dem Verb – aber nach am/is/are: „I often read.“ – „She is always late.“',q:'Welcher Satz ist richtig?',opts:['Tom always walks to school.','Tom walks always to school.','Always Tom walks to school.','Tom always walk to school.'],a:0,ex:'„always“ steht vor dem Verb, und bei Tom (he) braucht walk ein -s.'},
{id:'e62',g:'zeit3',topic:'Uhrzeit',d:1,q:'Wie spät ist es bei „It’s seven o’clock“?',opts:['7:00','7:30','6:00','11:00'],a:0,ex:'„o’clock“ steht nur bei vollen Stunden: seven o’clock = 7:00.'},
{id:'e63',g:'zeit2',topic:'Uhrzeit',d:2,info:'Minuten nach der vollen Stunde sagt man mit „past“, Minuten vor der nächsten Stunde mit „to“: 4:10 = ten past four, 4:50 = ten to five.',q:'Wie spät ist es bei „twenty to six“?',opts:['5:40','6:20','5:20','6:40'],a:0,ex:'Zwanzig Minuten VOR sechs – das ist 5:40.'},
{id:'e64',g:'zeit2',topic:'Uhrzeit',d:2,q:'Wie sagt man 9:05 auf Englisch?',opts:['five past nine','five to nine','nine past five','five to ten'],a:0,ex:'Fünf Minuten NACH neun: five past nine.'},
{id:'e65',g:'inonat',topic:'Grammatik',d:2,info:'Zeitangaben: at bei Uhrzeiten (at 8 o’clock), on bei Tagen (on Monday), in bei Monaten, Jahreszeiten und Jahren (in May, in summer).',q:'Ergänze: „My birthday is ___ June.“',opts:['in','on','at','to'],a:0,ex:'Bei Monaten steht „in“: in June.'},
{id:'e66',g:'inonat',topic:'Grammatik',d:2,q:'Ergänze: „The match starts ___ three o’clock.“',opts:['at','on','in','of'],a:0,ex:'Bei Uhrzeiten steht „at“: at three o’clock.'},
{id:'e67',g:'inonat',topic:'Grammatik',d:3,q:'Ergänze: „We go swimming ___ Saturday.“',opts:['on','in','at','by'],a:0,ex:'Bei Wochentagen steht „on“: on Saturday.'},
{id:'e68',g:'frage2',topic:'Grammatik',d:1,q:'Ergänze: „___ is your favourite colour? – Blue.“',opts:['What','Who','Where','When'],a:0,ex:'Gefragt ist nach einer Sache (der Farbe) – also „What“.'},
{id:'e69',g:'frage2',topic:'Grammatik',d:2,q:'Ergänze: „___ old are you? – I’m eleven.“',opts:['How','What','Who','Which'],a:0,ex:'Nach dem Alter fragt man mit „How old“ – wörtlich „Wie alt“.'},
{id:'e70',g:'whose',topic:'Grammatik',d:2,info:'„Whose“ fragt nach dem Besitzer: „Whose bag is this?“ – „It’s Mia’s.“',q:'Ergänze: „___ pen is this? – It’s Ben’s.“',opts:['Whose','Who','Where','What'],a:0,ex:'Die Antwort nennt den Besitzer (Ben’s) – also fragt man mit „Whose“.'},
{id:'e71',g:'pastbe',topic:'Simple Past',d:2,info:'Das Simple Past von „be“: I/he/she/it was – you/we/they were. Ein Signalwort ist „yesterday“.',q:'Ergänze: „Yesterday I ___ at home.“',opts:['was','were','am','is'],a:0,ex:'„yesterday“ zeigt die Vergangenheit, und bei „I“ heißt es „was“.'},
{id:'e72',g:'pastreg',topic:'Simple Past',d:2,info:'Regelmäßige Verben bekommen im Simple Past -ed: play – played, watch – watched, live – lived.',q:'Ergänze: „Last week we ___ football.“',opts:['played','play','plays','playing'],a:0,ex:'„last week“ zeigt die Vergangenheit: play + ed = played.'},
{id:'e73',g:'pastirr',topic:'Simple Past',d:3,q:'Was ist das Simple Past von „see“?',opts:['saw','seed','seen','sees'],a:0,ex:'„see“ ist unregelmäßig: see – saw. „seen“ ist die dritte Form (have seen).'},
{id:'e74',g:'plural2',topic:'Wortschatz',d:1,q:'Was ist der Plural von „mouse“?',opts:['mice','mouses','mices','meese'],a:0,ex:'one mouse – two mice. Unregelmäßig, wie foot – feet.'},
{id:'e75',g:'plural2',topic:'Wortschatz',d:2,info:'Nomen auf -s, -sh, -ch und -x bekommen im Plural -es: bus – buses, dish – dishes, box – boxes.',q:'Was ist der Plural von „box“?',opts:['boxes','boxs','boxies','box'],a:0,ex:'Nach x hängt man -es an: boxes.'},
{id:'e76',g:'this',topic:'Grammatik',d:2,info:'this/these zeigen auf etwas in der Nähe: this book – these books. that/those zeigen auf etwas weiter weg: that car – those cars.',q:'Ergänze: „___ shoes over there are mine.“',opts:['Those','This','These','That'],a:0,ex:'„over there“ = weiter weg, und shoes = Plural → those.'},
{id:'e77',g:'can2',topic:'Grammatik',d:1,q:'Ergänze: „___ you swim? – Yes, I can.“',opts:['Can','Do','Are','Is'],a:0,ex:'Die Antwort „Yes, I can“ verrät es: Die Frage beginnt mit „Can“.'},
{id:'e78',g:'pron2',topic:'Grammatik',d:1,info:'Personalpronomen: I, you, he, she, it, we, they. „we“ steht für mich und andere zusammen.',q:'Ergänze für „Lisa and I“: „___ are friends.“',opts:['We','They','Us','You'],a:0,ex:'Lisa und ich = wir = we.'},
{id:'e79',g:'possessiv',topic:'Grammatik',d:1,q:'Ergänze: „Tom and Ben love ___ dog.“',opts:['their','there','they','his'],a:0,ex:'Der Hund gehört beiden – „ihr Hund“ = their dog. „there“ heißt dort.'},
{id:'e80',g:'artikel',topic:'Grammatik',d:2,q:'Ergänze: „She is ___ honest girl.“',opts:['an','a'],a:0,ex:'Bei „honest“ spricht man das h nicht – das Wort beginnt also mit einem Vokal-Laut: an honest girl.'},
{id:'e81',g:'tiere2',topic:'Wortschatz',d:1,q:'Was heißt „Eichhörnchen“ auf Englisch?',opts:['squirrel','rabbit','hedgehog','owl'],a:0,ex:'squirrel = Eichhörnchen, hedgehog = Igel, owl = Eule.'},
{id:'e82',g:'tiere2',topic:'Wortschatz',d:2,q:'Was heißt „Igel“ auf Englisch?',opts:['hedgehog','squirrel','hamster','mole'],a:0,ex:'hedgehog = Igel, mole = Maulwurf.'},
{id:'e83',g:'wetter',topic:'Wortschatz',d:1,q:'Wie sagt man „Es regnet.“ auf Englisch?',opts:['It’s raining.','It’s snowing.','It’s sunny.','It’s windy.'],a:0,ex:'rain = Regen, raining = es regnet gerade. snowing = es schneit.'},
{id:'e84',g:'wetter',topic:'Wortschatz',d:1,q:'What’s the weather like when the sun is shining?',opts:['It’s sunny.','It’s foggy.','It’s cloudy.','It’s rainy.'],a:0,ex:'sun = Sonne, sunny = sonnig. foggy = neblig, cloudy = bewölkt.'},
{id:'e85',g:'schule2',topic:'Wortschatz',d:1,q:'Was heißt „Stundenplan“ auf Englisch?',opts:['timetable','homework','classroom','break'],a:0,ex:'timetable = Stundenplan (auch Fahrplan). break = Pause.'},
{id:'e86',g:'gegenteil2',topic:'Wortschatz',d:1,q:'Ergänze das Gegenteil: „an old bike – a ___ bike“',opts:['new','young','big','short'],a:0,ex:'Bei Sachen ist das Gegenteil von old „new“. Bei Menschen und Tieren sagt man „young“.'},
{id:'e87',g:'gegenteil2',topic:'Wortschatz',d:2,q:'What is the opposite of „early“?',opts:['late','soon','fast','slow'],a:0,ex:'early = früh, late = spät.'},
{id:'e88',g:'zahl2',topic:'Wortschatz',d:1,q:'Wie schreibt man 40 auf Englisch?',opts:['forty','fourty','fourteen','forteen'],a:0,ex:'Achtung: four hat ein u, forty aber nicht! 14 = fourteen.'},
{id:'e89',g:'ordinal',topic:'Wortschatz',d:2,info:'Ordnungszahlen: first, second, third – danach meist mit -th: fourth, fifth, sixth. Beim Datum sagt man: the first of May.',q:'Wie heißt „der dritte“ auf Englisch?',opts:['third','threeth','thirdth','three'],a:0,ex:'first, second, third sind unregelmäßig – erst ab fourth kommt -th.'},
{id:'e90',g:'family2',topic:'Wortschatz',d:2,q:'Who is your father’s mother?',opts:['your grandmother','your aunt','your sister','your cousin'],a:0,ex:'Die Mutter deines Vaters ist deine Oma: grandmother (oder grandma).'}
];

/* ---------- Geschichte ---------- */
const GE=[
{id:'h01',g:'zeit',topic:'Zeitrechnung',d:1,info:'Unsere Zeitrechnung beginnt mit Christi Geburt. Alles davor zählt man rückwärts: „vor Christus“ (v. Chr.). Je größer die Zahl bei v. Chr., desto länger ist es her.',q:'Was liegt [[länger]] zurück?',opts:['500 v. Chr.','200 v. Chr.','100 n. Chr.','1000 n. Chr.'],a:0,ex:'Vor Christus zählt man rückwärts: 500 v. Chr. war 300 Jahre vor 200 v. Chr. – und noch viel früher als alles nach Christus.'},
{id:'h02',g:'zeit',topic:'Zeitrechnung',d:2,info:'Bei Jahreszahlen vor Christus läuft die Zählung rückwärts: Auf 300 v. Chr. folgt 299 v. Chr. und so weiter bis zum Jahr 1 v. Chr. Danach kommt das Jahr 1 n. Chr.',q:'Ein Ereignis war 300 v. Chr., ein anderes 200 v. Chr. Welches war [[früher]]?',opts:['300 v. Chr.','200 v. Chr.','Beide gleichzeitig','Das kann man nicht sagen'],a:0,ex:'Vor Christus ist die größere Zahl die frühere: 300 v. Chr. war 100 Jahre vor 200 v. Chr.'},
{id:'h03',g:'quelle',topic:'Quellen',d:2,info:'Historiker erfahren aus Quellen etwas über die Vergangenheit. Sachquellen sind Gegenstände (Werkzeuge, Münzen, Gebäude), Textquellen sind Geschriebenes (Briefe, Inschriften), Bildquellen sind Bilder (Höhlenmalereien, Fotos).',q:'Eine Münze aus der Römerzeit ist eine …',opts:['Sachquelle','Textquelle','Bildquelle','Sage'],a:0,ex:'Eine Münze ist ein Gegenstand – also eine Sachquelle.'},
{id:'h04',g:'stein',topic:'Steinzeit',d:1,info:'In der Altsteinzeit lebten die Menschen als Jäger und Sammler. Sie zogen den Tierherden hinterher und hatten keine festen Häuser. Werkzeuge stellten sie aus Stein, Knochen und Holz her.',q:'Warum hatten die Menschen der Altsteinzeit [[keine]] festen Häuser?',opts:['Sie zogen als Jäger und Sammler umher','Es war immer warm','Häuser waren verboten','Sie lebten auf Bäumen'],a:0,ex:'Wer den Tieren folgt, muss oft weiterziehen. Deshalb nutzten sie Zelte, Hütten oder Höhlen.'},
{id:'h05',g:'stein',topic:'Steinzeit',d:2,info:'In der Jungsteinzeit wurden die Menschen sesshaft: Sie bauten Getreide an, hielten Haustiere und lebten in Dörfern. Diesen großen Wandel nennt man Neolithische Revolution.',q:'Was war die wichtigste Veränderung in der Jungsteinzeit?',opts:['Die Menschen wurden sesshaft und betrieben Ackerbau','Die Menschen begannen zu jagen','Die Menschen bauten große Städte mit Mauern aus Eisen','Die Menschen erfanden die Schrift'],a:0,ex:'Mit Ackerbau und Viehzucht konnten die Menschen an einem Ort bleiben. Gejagt wurde schon viel früher, die Schrift kam erst später.'},
{id:'h06',g:'pfahl',topic:'Steinzeit',d:1,info:'Am Bodensee bauten Menschen schon vor über 5.000 Jahren Häuser auf Pfählen am Seeufer. Reste davon liegen bis heute im Wasser; in Unteruhldingen kann man nachgebaute Pfahlbauten besuchen.',q:'Wo standen die Pfahlbauten am Bodensee?',opts:['Auf Pfählen am Seeufer','Auf hohen Bergen','In Höhlen','Auf Inseln mitten im See'],a:0,ex:'Die Häuser standen auf Holzpfählen am Ufer – so waren sie bei Hochwasser geschützt.'},
{id:'h07',g:'oetzi',topic:'Steinzeit',d:2,info:'1991 fanden Wanderer in den Ötztaler Alpen eine Gletschermumie: „Ötzi“. Er lebte am Ende der Jungsteinzeit. Bei ihm lagen ein Kupferbeil, Pfeil und Bogen sowie Kleidung aus Fell und Gras.',q:'Warum ist Ötzi für Forscher so wertvoll?',opts:['Weil er mit Kleidung und Ausrüstung erhalten blieb','Weil er ein König war','Weil er ein Tagebuch hinterließ','Weil er der erste Mensch war'],a:0,ex:'Das Eis hat Ötzi samt Ausrüstung konserviert. So weiß man genau, wie ein Mensch damals gekleidet und ausgerüstet war.'},
{id:'h08',g:'oetzi',topic:'Steinzeit',d:1,est:'Jahren',q:'Schätze zuerst: Vor wie vielen Jahren lebte Ötzi ungefähr?',opts:['Vor etwa 5.300 Jahren','Vor etwa 500 Jahren','Vor etwa 1.000 Jahren','Vor etwa 50.000 Jahren'],a:0,ex:'Ötzi lebte vor rund 5.300 Jahren – lange bevor es in Mitteleuropa eine Schrift gab.'},
{id:'h09',g:'nil',topic:'Ägypten',d:1,info:'Das alte Ägypten entstand am Nil. Jedes Jahr trat der Fluss über die Ufer und hinterließ fruchtbaren Schlamm. So konnten die Bauern mitten in der Wüste reiche Ernten einbringen.',q:'Warum war die Nilüberschwemmung für die Ägypter [[gut]]?',opts:['Sie brachte fruchtbaren Schlamm auf die Felder','Sie spülte die Städte sauber','Sie vertrieb Feinde','Sie brachte Fische in die Häuser'],a:0,ex:'Der Schlamm war ein natürlicher Dünger. Ohne Nil gäbe es dort nur Wüste.'},
{id:'h10',g:'pyramide',topic:'Ägypten',d:1,info:'Die Ägypter glaubten an ein Leben nach dem Tod. Deshalb balsamierten sie Verstorbene ein (Mumien) und gaben ihnen Grabbeigaben mit. Für ihre Herrscher, die Pharaonen, bauten sie gewaltige Bauwerke.',q:'Wozu dienten die großen Pyramiden?',opts:['Als Gräber für Pharaonen','Als Wohnhäuser','Als Getreidespeicher','Als Sternwarten'],a:0,ex:'Die Pyramiden waren Grabmäler der Pharaonen – für ihr Leben nach dem Tod.'},
{id:'h11',g:'schrift',topic:'Ägypten',d:2,info:'Die Ägypter schrieben mit Bildzeichen, den Hieroglyphen. Lange konnte niemand sie lesen. Erst 1822 entzifferte der Franzose Champollion sie – mit Hilfe des Steins von Rosette, auf dem derselbe Text in drei Schriften stand.',q:'Was half Champollion beim Entziffern der Hieroglyphen?',opts:['Ein Stein mit demselben Text in drei Schriften','Ein ägyptisches Wörterbuch','Ein Pharao, der noch lebte','Eine Mumie'],a:0,ex:'Weil eine der drei Schriften Griechisch war, konnte er die Texte vergleichen.'},
{id:'h12',g:'olymp',topic:'Griechen',d:1,info:'Die ersten bekannten Olympischen Spiele fanden 776 v. Chr. in Olympia in Griechenland statt – zu Ehren des höchsten Gottes. Teilnehmen durften nur freie griechische Männer.',q:'Zu Ehren welches Gottes fanden die Olympischen Spiele statt?',opts:['Zeus','Poseidon','Jupiter','Thor'],a:0,ex:'Zeus war der höchste griechische Gott. Jupiter ist sein römischer „Kollege“, Thor ein germanischer Gott.'},
{id:'h13',g:'athen',topic:'Griechen',d:3,info:'In Athen entstand im 5. Jahrhundert v. Chr. die Demokratie (Volksherrschaft): Die Bürger stimmten in der Volksversammlung selbst ab. Frauen, Sklaven und Fremde durften allerdings nicht mitbestimmen.',q:'Wer durfte in der Volksversammlung Athens [[nicht]] abstimmen?',opts:['Frauen','Männliche Bürger Athens','Bauern mit Bürgerrecht','Handwerker mit Bürgerrecht'],a:0,ex:'Nur erwachsene männliche Bürger durften abstimmen. Die Demokratie in Athen schloss also einen großen Teil der Menschen aus.'},
{id:'h14',g:'rom',topic:'Römer',d:1,info:'Der Sage nach wurde Rom 753 v. Chr. von den Zwillingen Romulus und Remus gegründet. Eine Wölfin soll die beiden als Babys gesäugt haben.',q:'Wer gründete der Sage nach die Stadt Rom?',opts:['Romulus und Remus','Caesar und Augustus','Zeus und Hera','Kastor und Pollux'],a:0,ex:'Romulus gab der Stadt ihren Namen. Caesar und Augustus lebten erst rund 700 Jahre später.'},
{id:'h15',g:'raetien',topic:'Römer',d:2,info:'Die Römer eroberten um 15 v. Chr. das Alpenvorland. Am Bodensee entstand Brigantium, das heutige Bregenz. Die Provinz hieß Raetien, ihre Hauptstadt war Augusta Vindelicum.',q:'Welche heutige Stadt hieß bei den Römern Augusta Vindelicum?',opts:['Augsburg','Bregenz','Lindau','München'],a:0,ex:'Augusta Vindelicum ist Augsburg – der Name „Augs-burg“ steckt noch darin. Bregenz hieß Brigantium.'},
{id:'h16',g:'limes',topic:'Römer',d:2,info:'Der Limes war die befestigte Grenze des Römischen Reiches in Germanien – mit Wall, Graben, Palisaden und Wachtürmen. Er sollte den Verkehr über die Grenze kontrollieren.',q:'Was war der Limes?',opts:['Eine befestigte Grenze der Römer','Ein römischer Kaiser','Eine Straße nach Rom','Ein römisches Bad'],a:0,ex:'„limes“ ist Latein und bedeutet Grenzweg. Teile davon kann man in Bayern noch heute sehen.'},
{id:'h17',g:'latein',topic:'Römer',d:1,q:'Welche Sprache sprachen die alten Römer?',opts:['Latein','Griechisch','Italienisch','Römisch'],a:0,ex:'Die Römer sprachen Latein. Aus dem Latein entstanden später Sprachen wie Italienisch, Französisch und Spanisch.'},
{id:'h18',g:'kaiser',topic:'Römer',d:3,info:'Gaius Julius Caesar war ein berühmter römischer Feldherr und Politiker. Er eroberte Gallien und wurde 44 v. Chr. ermordet. Erst sein Großneffe Augustus regierte dann als Kaiser.',q:'Wer war der [[erste]] römische Kaiser?',opts:['Augustus','Caesar','Nero','Romulus'],a:0,ex:'Caesar war mächtig, aber nie Kaiser. Augustus war der erste. Unser Monat August ist nach ihm benannt.'},
{id:'h19',g:'zahlen',topic:'Römer',d:2,info:'Römische Zahlen: I = 1, V = 5, X = 10, L = 50, C = 100. Steht ein kleineres Zeichen vor einem größeren, wird es abgezogen: IV = 4, IX = 9.',q:'Welche Zahl ist XIV?',opts:['14','16','9','41'],a:0,ex:'X = 10, dann IV = 4. Zusammen: 14.'},
{id:'h20',g:'zahlen',topic:'Römer',d:3,info:'Abziehen darf man bei römischen Zahlen nur I vor V und X, X vor L und C. Größere Zahlen setzt man Stück für Stück zusammen: 90 = XC, 40 = XL, 9 = IX.',q:'Wie schreibt man 49 in römischen Zahlen?',opts:['XLIX','IL','XLVIIII','LXI'],a:0,ex:'49 = 40 + 9 = XL + IX = XLIX. „IL“ ist nicht erlaubt, weil man I nur vor V und X setzen darf.'},
{id:'h21',g:'werkzeug',topic:'Steinzeit',d:1,info:'Das wichtigste Werkzeug der Altsteinzeit war der Faustkeil: ein Stein, der durch gezieltes Abschlagen scharfe Kanten bekam. Damit konnte man schneiden, schaben und hacken.',q:'Wofür benutzten Steinzeitmenschen einen Faustkeil?',opts:['Zum Schneiden, Schaben und Hacken','Zum Schreiben','Als Schmuck','Als Geld'],a:0,ex:'Der Faustkeil war ein Allzweckwerkzeug – eine Art Steinzeit-Taschenmesser.'},
{id:'h22',g:'werkzeug',topic:'Steinzeit',d:1,info:'Das Feuer war für die Steinzeitmenschen eine der wichtigsten Entdeckungen: Es spendete Wärme und Licht, hielt wilde Tiere fern und machte Fleisch durch Braten besser verdaulich.',q:'Was ermöglichte das Feuer den Menschen [[nicht]]?',opts:['Schneller zu laufen','Fleisch zu braten','Sich zu wärmen','Wilde Tiere fernzuhalten'],a:0,ex:'Feuer brachte Wärme, Licht, Schutz und gekochtes Essen – aber schneller laufen konnte damit niemand.'},
{id:'h23',g:'hoehle',topic:'Steinzeit',d:2,info:'In Höhlen wie Lascaux in Frankreich gibt es über 15.000 Jahre alte Malereien – vor allem von Tieren wie Pferden, Wisenten und Hirschen. Die Farben stellten die Menschen aus Erde, Holzkohle und Pflanzen her.',q:'Was zeigen die meisten Höhlenmalereien?',opts:['Tiere','Städte','Schiffe','Könige'],a:0,ex:'Meist sind Tiere zu sehen, die gejagt wurden. Städte, Schiffe und Könige gab es damals noch nicht.'},
{id:'h24',g:'metall',topic:'Metallzeit',d:2,info:'Nach der Steinzeit lernten die Menschen, Metalle zu verarbeiten. Bronze ist eine Mischung aus Kupfer und Zinn – härter als reines Kupfer. Später folgte die Eisenzeit.',q:'Aus welchen Metallen besteht Bronze?',opts:['Kupfer und Zinn','Eisen und Gold','Silber und Blei','Nur aus Eisen'],a:0,ex:'Kupfer und Zinn zusammengeschmolzen ergeben Bronze.'},
{id:'h25',g:'metall',topic:'Metallzeit',d:1,q:'In welcher Reihenfolge folgen die Zeitalter aufeinander?',opts:['Steinzeit – Bronzezeit – Eisenzeit','Bronzezeit – Steinzeit – Eisenzeit','Eisenzeit – Bronzezeit – Steinzeit','Steinzeit – Eisenzeit – Bronzezeit'],a:0,ex:'Erst Stein, dann Bronze, dann Eisen. Eisen ist schwerer zu schmelzen – deshalb kam es zuletzt.'},
{id:'h26',g:'nil',topic:'Ägypten',d:2,info:'Um die Nilflut zu nutzen, legten die Ägypter Kanäle und Deiche an. Mit einem Schaduf – einem Hebel mit Eimer – schöpften sie Wasser auf höher gelegene Felder.',q:'Wozu diente ein Schaduf?',opts:['Zum Wasserschöpfen für die Felder','Zum Bau der Pyramiden','Zum Fischen','Zum Schreiben'],a:0,ex:'Der Schaduf hob Wasser aus dem Nil oder einem Kanal auf die Felder.'},
{id:'h27',g:'gesell',topic:'Ägypten',d:2,info:'Die Gesellschaft Ägyptens war wie eine Pyramide aufgebaut: Ganz oben stand der Pharao, darunter Priester und Beamte, dann Handwerker und Händler. Die meisten Menschen waren Bauern, ganz unten standen die Sklaven.',q:'Wer stand an der [[Spitze]] der ägyptischen Gesellschaft?',opts:['Der Pharao','Die Priester','Die Schreiber','Die Bauern'],a:0,ex:'Der Pharao galt als Gott auf Erden und stand ganz oben. Die Bauern waren die größte Gruppe.'},
{id:'h28',g:'schrift',topic:'Ägypten',d:1,info:'Die Ägypter schrieben auf Papyrus. Dafür schnitten sie das Mark der Papyrus-Pflanze in Streifen, legten sie kreuzweise übereinander und pressten sie. Unser Wort „Papier“ kommt davon.',q:'Woraus stellten die Ägypter ihr Schreibmaterial her?',opts:['Aus der Papyrus-Pflanze','Aus Tierhaut','Aus Baumrinde','Aus Ton'],a:0,ex:'Papyrus wuchs am Nil. Aus Tierhaut machte man erst später Pergament.'},
{id:'h29',g:'pyramide',topic:'Ägypten',d:2,est:'m',q:'Schätze zuerst: Wie hoch war die Cheops-Pyramide ursprünglich?',opts:['Etwa 146 m','Etwa 20 m','Etwa 50 m','Etwa 500 m'],a:0,ex:'Rund 146 Meter – heute sind es noch etwa 139. Fast 4.000 Jahre lang war sie das höchste Bauwerk der Welt.'},
{id:'h30',g:'mumie',topic:'Ägypten',d:3,info:'Für eine Mumie entfernten die Ägypter die inneren Organe, trockneten den Körper etwa 40 Tage mit Natronsalz und wickelten ihn in Leinenbinden. Das Herz ließen sie meist im Körper: Sie glaubten, es werde beim Totengericht im Jenseits gewogen.',q:'Warum ließen die Ägypter das Herz meist im Körper?',opts:['Es sollte beim Totengericht im Jenseits gewogen werden','Es war zu schwer zum Entfernen','Es verweste nicht','Die Priester wollten es nicht anfassen'],a:0,ex:'Beim Totengericht wurde das Herz gegen eine Feder aufgewogen. War es leicht genug, durfte der Tote ins Jenseits.'},
{id:'h31',g:'polis',topic:'Griechen',d:1,info:'Griechenland bestand aus vielen unabhängigen Stadtstaaten (Poleis), zum Beispiel Athen und Sparta. Trotzdem fühlten sich alle Griechen verbunden – durch Sprache, Götter und die Olympischen Spiele.',q:'Wie nennt man die griechischen Stadtstaaten?',opts:['Poleis','Provinzen','Pharaonen','Legionen'],a:0,ex:'Eine Polis (Mehrzahl: Poleis) war ein Stadtstaat. Unser Wort „Politik“ kommt davon.'},
{id:'h32',g:'goetter',topic:'Griechen',d:2,info:'Die Griechen glaubten an viele Götter, die auf dem Berg Olymp wohnten. Zeus war der Göttervater, Poseidon der Gott des Meeres, Athene die Göttin der Weisheit.',q:'Wer war bei den Griechen der Gott des Meeres?',opts:['Poseidon','Zeus','Apollon','Hermes'],a:0,ex:'Poseidon herrschte über das Meer – man erkennt ihn am Dreizack.'},
{id:'h33',g:'polis',topic:'Griechen',d:3,info:'In Sparta wurden Jungen ab dem 7. Lebensjahr in Gemeinschaften streng zu Kriegern erzogen. Athen legte mehr Wert auf Bildung, Kunst und Philosophie.',q:'Wofür war Sparta [[vor allem]] bekannt?',opts:['Für seine harte Erziehung zu Kriegern','Für seine Demokratie','Für seine Pyramiden','Für seine Philosophen'],a:0,ex:'„Spartanisch“ sagt man heute noch für „sehr einfach und hart“. Demokratie und Philosophie verbindet man mit Athen.'},
{id:'h34',g:'olymp',topic:'Griechen',d:2,q:'Welche Sportart gab es bei den antiken Olympischen Spielen [[noch nicht]]?',opts:['Fußball','Wagenrennen','Ringen','Laufen'],a:0,ex:'Laufen, Ringen, Wagenrennen und Weitsprung gab es schon. Fußball entstand erst viel später in England.'},
{id:'h35',g:'republik',topic:'Römer',d:2,info:'Rom war zuerst ein Königreich, dann ab etwa 500 v. Chr. eine Republik: Zwei Konsuln regierten jeweils für ein Jahr, der Senat beriet sie. Später wurde Rom ein Kaiserreich.',q:'Wie viele Konsuln regierten in der römischen Republik gleichzeitig?',opts:['2','1','3','12'],a:0,ex:'Immer zwei Konsuln für ein Jahr – so sollte keiner zu mächtig werden.'},
{id:'h36',g:'alltag',topic:'Römer',d:1,info:'In römischen Städten gab es öffentliche Bäder (Thermen), Theater und Arenen. Im Kolosseum in Rom sahen Zehntausende Zuschauer Gladiatorenkämpfe.',q:'Wie hießen die öffentlichen Bäder der Römer?',opts:['Thermen','Arenen','Foren','Villen'],a:0,ex:'In den Thermen badete man, traf Freunde und trieb Sport. Ein Forum war ein Marktplatz.'},
{id:'h37',g:'alltag',topic:'Römer',d:2,info:'Die Römer bauten Aquädukte – Wasserleitungen, die Frischwasser oft über viele Kilometer und auf hohen Brücken in die Städte leiteten.',q:'Was transportierte ein Aquädukt?',opts:['Wasser','Getreide','Soldaten','Steine'],a:0,ex:'„aqua“ ist Latein für Wasser. Manche Aquädukte stehen bis heute, zum Beispiel in Frankreich und Spanien.'},
{id:'h38',g:'legion',topic:'Römer',d:2,info:'Das römische Heer war in Legionen gegliedert, jede mit mehreren tausend Soldaten. Die Legionäre kämpften nicht nur, sie bauten auch Straßen, Brücken und Lager – aus manchen Lagern wurden Städte.',q:'Was bauten römische Legionäre [[außer]] Lagern noch?',opts:['Straßen und Brücken','Pyramiden','Ritterburgen','Kirchtürme'],a:0,ex:'Römerstraßen verbanden das ganze Reich. Burgen und Kirchen kamen erst im Mittelalter.'},
{id:'h39',g:'raetien',topic:'Römer',d:1,info:'Am Ostufer des Bodensees gründeten die Römer Brigantium, das heutige Bregenz. Kempten im Allgäu hieß Cambodunum und zählt zu den ältesten Städten Deutschlands.',q:'Wie hieß Bregenz bei den Römern?',opts:['Brigantium','Cambodunum','Augusta Vindelicum','Colonia'],a:0,ex:'Brigantium = Bregenz. Cambodunum = Kempten, Augusta Vindelicum = Augsburg, Colonia = Köln.'},
{id:'h40',g:'limes',topic:'Römer',d:3,info:'Römer und Germanen standen sich nicht nur feindlich gegenüber: Am Limes trieben sie Handel. Die Germanen boten Felle, Bernstein und sogar blondes Haar für Perücken an und bekamen dafür römischen Wein, Schmuck und Geschirr.',q:'Was kauften die Germanen [[von]] den Römern?',opts:['Wein und Geschirr','Bernstein','Felle','Blondes Haar'],a:0,ex:'Bernstein, Felle und Haar verkauften die Germanen an die Römer. Im Gegenzug bekamen sie Wein, Schmuck und Geschirr.'},
{id:'h41',g:'jh',topic:'Zeitrechnung',d:3,info:'Ein Jahrhundert umfasst 100 Jahre. Das 1. Jahrhundert n. Chr. sind die Jahre 1 bis 100, das 15. Jahrhundert die Jahre 1401 bis 1500, das 21. Jahrhundert die Jahre 2001 bis 2100.',q:'In welchem Jahrhundert liegt das Jahr 1450?',opts:['Im 15. Jahrhundert','Im 14. Jahrhundert','Im 16. Jahrhundert','Im 45. Jahrhundert'],a:0,ex:'Die Jahre 1401 bis 1500 sind das 15. Jahrhundert. Faustregel: die ersten zwei Ziffern plus eins.'},
{id:'h42',g:'jh',topic:'Zeitrechnung',d:1,q:'Wie viele Jahre sind ein Jahrtausend?',opts:['1.000','100','10','10.000'],a:0,ex:'Jahrzehnt = 10 Jahre, Jahrhundert = 100 Jahre, Jahrtausend = 1.000 Jahre.'},
{id:'h43',g:'quelle',topic:'Quellen',d:1,q:'Ein Brief, den ein römischer Soldat geschrieben hat, ist eine …',opts:['Textquelle','Sachquelle','Bildquelle','Sage'],a:0,ex:'Ein Brief ist etwas Geschriebenes – also eine Textquelle.'},
{id:'h44',g:'quelle',topic:'Quellen',d:3,info:'Quellen muss man kritisch prüfen: Wer hat sie geschaffen, wann und warum? Ein römischer Geschichtsschreiber berichtet über die Germanen vielleicht nicht neutral.',q:'Warum muss man einen römischen Bericht über die Germanen [[kritisch]] lesen?',opts:['Der Verfasser sah die Germanen aus römischer Sicht','Weil er auf Latein geschrieben ist','Weil er sehr alt ist','Weil Römer nie ehrlich waren'],a:0,ex:'Wer über Fremde oder Gegner schreibt, sieht sie mit eigenen Augen und Vorurteilen. Das muss man beim Lesen bedenken.'},
{id:'h45',g:'metall2',topic:'Metallzeit',d:1,info:'Mit Metall konnten die Menschen haltbarere Werkzeuge, Waffen und Schmuck herstellen. Wie man Erz schmilzt, verbreitete sich über Händler in ganz Europa.',q:'Wofür nutzten die Menschen Bronze [[nicht]]?',opts:['Für Fensterglas','Für Werkzeuge','Für Waffen','Für Schmuck'],a:0,ex:'Aus Bronze machte man Beile, Schwerter, Nadeln und Schmuck. Fensterglas gab es erst viel später bei den Römern.'},
{id:'h46',g:'metall2',topic:'Metallzeit',d:2,info:'Für Bronze braucht man Kupfer und Zinn. Beide Metalle kamen nur selten am selben Ort vor. Deshalb entstanden in der Bronzezeit weite Handelswege durch Europa.',q:'Warum wurde in der Bronzezeit der Handel so wichtig?',opts:['Kupfer und Zinn kamen an verschiedenen Orten vor','Es gab erstmals Papiergeld','Alle wollten Pyramiden bauen','Es gab keine Bauern mehr'],a:0,ex:'Wer Bronze wollte, musste ein Metall von weit her eintauschen. So wurden Händler und Handelswege wichtig.'},
{id:'h47',g:'eisen',topic:'Metallzeit',d:2,info:'Eisenerz gibt es fast überall, aber zum Schmelzen braucht man sehr hohe Temperaturen. Eisenwerkzeuge waren härter und billiger als solche aus Bronze.',q:'Warum setzte sich Eisen gegenüber Bronze durch?',opts:['Eisenerz gab es fast überall, und Eisen ist hart','Eisen glänzt schöner','Eisen ist leichter zu schmelzen','Bronze wurde verboten'],a:0,ex:'Eisen war schwerer herzustellen, aber das Erz war leicht zu finden – so konnten sich viel mehr Menschen Eisenwerkzeuge leisten.'},
{id:'h48',g:'kelten',topic:'Kelten',d:1,info:'Vor den Römern lebten in Süddeutschland die Kelten. Sie waren geschickte Handwerker, vor allem in der Metallverarbeitung, und lebten in Dörfern und großen befestigten Siedlungen.',q:'Welches Volk lebte in Süddeutschland, [[bevor]] die Römer kamen?',opts:['Die Kelten','Die Wikinger','Die Ägypter','Die Griechen'],a:0,ex:'Die Kelten waren vor den Römern da. Viele Fluss- und Ortsnamen in Bayern stammen noch von ihnen.'},
{id:'h49',g:'kelten',topic:'Kelten',d:2,info:'Bei Manching in Bayern lag eine der größten keltischen Städte. Solche befestigten Keltenstädte heißen Oppidum (Mehrzahl: Oppida). In Manching fand man einen großen Schatz aus keltischen Goldmünzen.',q:'Wie nennt man eine große, befestigte Keltenstadt?',opts:['Oppidum','Pyramide','Limes','Polis'],a:0,ex:'Oppidum ist das lateinische Wort der Römer für eine befestigte Stadt. Eine Polis war ein griechischer Stadtstaat.'},
{id:'h50',g:'kelten2',topic:'Kelten',d:3,info:'Die Kelten hinterließen kaum eigene Texte. Vieles weiß man aus Funden im Boden und aus Berichten griechischer und römischer Schriftsteller.',q:'Warum ist unser Wissen über die Kelten lückenhaft?',opts:['Sie hinterließen kaum eigene schriftliche Quellen','Sie lebten nur ganz kurz','Sie wohnten unter der Erde','Alle Funde sind verloren gegangen'],a:0,ex:'Ohne eigene Texte sind wir auf Funde und auf fremde Berichte angewiesen – und die Römer sahen die Kelten oft als Feinde.'},
{id:'h51',g:'quelle2',topic:'Quellen',d:1,q:'Eine Höhlenmalerei ist eine …',opts:['Bildquelle','Textquelle','Sachquelle','Sage'],a:0,ex:'Ein Bild aus der Vergangenheit ist eine Bildquelle.'},
{id:'h52',g:'quelle2',topic:'Quellen',d:2,info:'Forscher, die Überreste aus der Vergangenheit ausgraben und untersuchen, heißen Archäologen. Sie arbeiten sehr vorsichtig, oft mit Pinsel und kleiner Kelle.',q:'Wie heißen Forscher, die nach Überresten der Vergangenheit graben?',opts:['Archäologen','Biologen','Astronauten','Meteorologen'],a:0,ex:'Archäologen graben aus, Historiker werten vor allem Texte aus. Meteorologen erforschen das Wetter.'},
{id:'h53',g:'jahresring',topic:'Quellen',d:3,info:'Bäume bilden jedes Jahr einen Jahresring – mal dicker, mal dünner, je nach Wetter. Aus dem Muster der Ringe kann man genau ablesen, in welchem Jahr ein Baum gefällt wurde. So weiß man, wann die Pfahlbauten am Bodensee gebaut wurden.',q:'Woran erkennt man, wann ein Baum für einen Pfahlbau gefällt wurde?',opts:['An den Jahresringen','An der Farbe der Rinde','Am Geruch des Holzes','An der Länge des Pfahls'],a:0,ex:'Das Muster aus dicken und dünnen Ringen ist wie ein Fingerabdruck der Jahre. Man vergleicht es mit einem bekannten Kalender aus Ringmustern.'},
{id:'h54',g:'zleiste',topic:'Zeitrechnung',d:1,info:'Auf einer Zeitleiste stehen Ereignisse in der richtigen Reihenfolge: links das Älteste, rechts das Neueste.',q:'Was kam [[zuerst]]?',opts:['Die Pyramiden in Ägypten','Die Gründung Roms','Die ersten Olympischen Spiele','Kaiser Augustus'],a:0,ex:'Die großen Pyramiden entstanden um 2600 v. Chr. Dann kamen die Olympischen Spiele (776 v. Chr.), die Gründung Roms (753 v. Chr.) und Augustus (ab 27 v. Chr.).'},
{id:'h55',g:'zleiste',topic:'Zeitrechnung',d:2,q:'Was geschah [[zuletzt]]?',opts:['Kaiser Augustus regiert Rom','Die ersten Olympischen Spiele','Ötzi lebt in den Alpen','Rom wird gegründet'],a:0,ex:'Ötzi lebte vor über 5.000 Jahren, dann kamen die Olympischen Spiele, die Gründung Roms – und zuletzt Augustus.'},
{id:'h56',g:'zrech2',topic:'Zeitrechnung',d:2,info:'Liegen zwei Jahre beide vor Christus, rechnet man den Abstand, indem man die kleinere von der größeren Zahl abzieht: Von 500 v. Chr. bis 200 v. Chr. sind es 300 Jahre.',q:'Wie viele Jahre liegen zwischen der Gründung Roms (753 v. Chr.) und dem Tod Caesars (44 v. Chr.)?',opts:['709','797','753','44'],a:0,ex:'753 − 44 = 709 Jahre.'},
{id:'h57',g:'zrech2',topic:'Zeitrechnung',d:3,info:'Von einem Jahr v. Chr. bis zu einem Jahr n. Chr. zählt man beide Zahlen zusammen – und zieht eins ab, weil es kein Jahr 0 gibt. Von 15 v. Chr. bis 10 n. Chr. sind es also 24 Jahre.',q:'Wie viele Jahre liegen zwischen 30 v. Chr. und 20 n. Chr.?',opts:['49','50','10','51'],a:0,ex:'30 + 20 = 50, minus 1 für das fehlende Jahr 0 = 49 Jahre.'},
{id:'h58',g:'jaeger',topic:'Steinzeit',d:1,info:'Jäger und Sammler aßen, was die Natur bot: Fleisch von Wildtieren, Fisch, Beeren, Nüsse, Wurzeln und Pilze. Ackerbau kannten sie noch nicht.',q:'Was aßen Jäger und Sammler [[nicht]]?',opts:['Brot aus angebautem Getreide','Beeren','Fisch','Nüsse'],a:0,ex:'Getreide anzubauen lernten die Menschen erst in der Jungsteinzeit, als sie sesshaft wurden.'},
{id:'h59',g:'jung2',topic:'Steinzeit',d:2,info:'In der Jungsteinzeit begannen die Menschen zu töpfern. In Tongefäßen konnten sie Vorräte lagern und Essen kochen.',q:'Wozu dienten die ersten Tongefäße?',opts:['Zum Lagern von Vorräten und zum Kochen','Als Musikinstrumente','Als Geld','Als Waffen'],a:0,ex:'Wer Getreide erntet, muss es aufbewahren – dafür waren Töpfe ideal.'},
{id:'h60',g:'jung2',topic:'Steinzeit',d:2,info:'Sesshafte Bauern hielten Haustiere wie Rinder, Schafe, Ziegen und Schweine. Der Hund war schon viel früher, bei den Jägern und Sammlern, zum Begleiter des Menschen geworden.',q:'Welches Tier begleitete die Menschen [[schon]] in der Altsteinzeit?',opts:['Der Hund','Das Schwein','Das Rind','Das Huhn'],a:0,ex:'Der Hund ist das älteste Haustier. Er half schon bei der Jagd, lange bevor es Bauern gab.'},
{id:'h61',g:'pfahl',topic:'Steinzeit',d:2,q:'Warum bauten die Menschen am Bodensee ihre Häuser auf Pfählen?',opts:['Zum Schutz vor Hochwasser und nassem Boden','Damit die Häuser schwimmen konnten','Weil Holz im Wasser wächst','Damit sie im Winter Schlittschuh laufen konnten'],a:0,ex:'Der Wasserstand des Bodensees schwankt stark. Auf Pfählen blieben die Häuser trocken.'},
{id:'h62',g:'pharao',topic:'Ägypten',d:1,info:'Der Pharao war König und galt den Ägyptern als Gott auf Erden. Das Grab des jungen Pharaos Tutanchamun wurde 1922 fast unberührt gefunden – mit einer goldenen Totenmaske.',q:'Wessen Grab wurde 1922 mit einem riesigen Goldschatz gefunden?',opts:['Tutanchamun','Caesar','Zeus','Ötzi'],a:0,ex:'Das Grab von Tutanchamun war eines der wenigen, das Grabräuber nicht ausgeplündert hatten.'},
{id:'h63',g:'nil2',topic:'Ägypten',d:2,info:'Das ägyptische Jahr richtete sich nach dem Nil: Überschwemmung, Aussaat, Ernte. Um die Flut vorherzusagen, beobachteten Priester die Sterne. So entstand ein Kalender mit 365 Tagen.',q:'Warum entwickelten die Ägypter einen genauen Kalender?',opts:['Um die Nilflut vorherzusagen','Um Geburtstage zu feiern','Für die Olympischen Spiele','Für den Schulunterricht'],a:0,ex:'Wer weiß, wann die Flut kommt, kann rechtzeitig Felder vorbereiten und Vorräte anlegen.'},
{id:'h64',g:'schreiber',topic:'Ägypten',d:2,info:'Nur wenige Ägypter konnten lesen und schreiben. Schreiber waren deshalb sehr angesehen: Sie zählten die Ernte, berechneten Abgaben und schrieben Briefe.',q:'Warum waren Schreiber in Ägypten so angesehen?',opts:['Nur wenige konnten lesen und schreiben','Sie waren alle Söhne des Pharaos','Sie bauten die Pyramiden allein','Sie waren besonders stark'],a:0,ex:'Ohne Schreiber hätte der Pharao nicht gewusst, wie viel Getreide es gab und wer wie viel abgeben musste.'},
{id:'h65',g:'goetterAeg',topic:'Ägypten',d:2,info:'Die Ägypter verehrten viele Götter, oft mit Tierköpfen: Re war der Sonnengott, Anubis mit dem Schakalkopf war der Gott der Totenwelt.',q:'Wer war Re?',opts:['Der Sonnengott','Ein Pharao','Ein Fluss','Ein Schreiber'],a:0,ex:'Re (auch Ra) war der wichtigste Gott: Die Sonne war für das Leben am Nil entscheidend.'},
{id:'h66',g:'mythos',topic:'Griechen',d:1,info:'Die Griechen erzählten Sagen, auch Mythen genannt, über Götter und Helden. Ein berühmter Held ist Herakles, der zwölf schwere Aufgaben lösen musste.',q:'Wie nennt man die Geschichten der Griechen über Götter und Helden?',opts:['Mythen','Fabeln','Märchen','Berichte'],a:0,ex:'Mythen erklärten den Griechen die Welt – und waren spannende Geschichten.'},
{id:'h67',g:'mythos',topic:'Griechen',d:2,info:'In der Sage vom Trojanischen Pferd versteckten sich griechische Krieger in einem großen Holzpferd. Die Trojaner holten es in ihre Stadt – nachts kamen die Krieger heraus und öffneten die Tore.',q:'Was war im Trojanischen Pferd versteckt?',opts:['Griechische Krieger','Gold','Getreide','Pferdefutter'],a:0,ex:'Mit dieser List eroberten die Griechen der Sage nach Troja. Heute heißt eine versteckte Schadsoftware am Computer deshalb „Trojaner“.'},
{id:'h68',g:'kolonie',topic:'Griechen',d:3,info:'Viele Griechen verließen ihre Heimat und gründeten Kolonien rund ums Mittelmeer – zum Beispiel Massalia, das heutige Marseille. Gründe waren Landmangel und Handel.',q:'Welche heutige Stadt wurde von Griechen gegründet?',opts:['Marseille','Berlin','London','Wien'],a:0,ex:'Marseille in Südfrankreich hieß bei den Griechen Massalia.'},
{id:'h69',g:'athen2',topic:'Griechen',d:2,info:'Auf dem Felsen der Akropolis in Athen steht der Parthenon, ein Tempel für die Göttin Athene, die Schutzgöttin der Stadt.',q:'Wem war der Parthenon in Athen geweiht?',opts:['Athene','Zeus','Poseidon','Apollon'],a:0,ex:'Die Stadt Athen trägt sogar den Namen ihrer Schutzgöttin Athene.'},
{id:'h70',g:'olymp2',topic:'Griechen',d:1,info:'Bei den antiken Olympischen Spielen bekamen Sieger keine Medaille, sondern einen Kranz aus Olivenzweigen – und in ihrer Heimatstadt viel Ruhm.',q:'Was bekam ein Sieger bei den antiken Olympischen Spielen?',opts:['Einen Olivenkranz','Eine Goldmedaille','Einen Pokal','Ein Pferd'],a:0,ex:'Medaillen gibt es erst bei den modernen Olympischen Spielen seit 1896.'},
{id:'h71',g:'sprachgr',topic:'Griechen',d:2,info:'Viele unserer Wörter kommen aus dem Griechischen: Demokratie, Theater, Olympiade – und Alphabet, nach Alpha und Beta, den ersten beiden griechischen Buchstaben.',q:'Woher hat das Wort „Alphabet“ seinen Namen?',opts:['Von den ersten zwei griechischen Buchstaben','Von einem Pharao','Von einer römischen Stadt','Von einem Gott'],a:0,ex:'Alpha + Beta = Alphabet. Bei uns sagt man ähnlich „das ABC“.'},
{id:'h72',g:'alltag2',topic:'Römer',d:1,info:'Reiche Römer aßen bei Gastmählern im Liegen auf Speisesofas. Ärmere Römer aßen oft einfachen Brei aus Getreide.',q:'Wie aßen reiche Römer bei einem Gastmahl?',opts:['Im Liegen','Im Stehen','Auf dem Boden kniend','Im Gehen'],a:0,ex:'Man lag auf der linken Seite und aß mit der rechten Hand – oft stundenlang.'},
{id:'h73',g:'alltag2',topic:'Römer',d:2,info:'Viele Menschen in Rom wohnten in mehrstöckigen Mietshäusern, den Insulae. Reiche Familien hatten eigene Stadthäuser oder große Landhäuser, die Villen.',q:'Wie hießen die Mietshäuser im alten Rom?',opts:['Insulae','Villen','Thermen','Foren'],a:0,ex:'„insula“ heißt Insel – die Mietshäuser standen wie Inseln zwischen den Straßen.'},
{id:'h74',g:'strasse',topic:'Römer',d:2,info:'Die Römer bauten Straßen durch ihr ganzes Reich. Die Via Claudia Augusta führte von Italien über die Alpen bis nach Augsburg.',q:'Wohin führte die Via Claudia Augusta über die Alpen?',opts:['Nach Augsburg','Nach Berlin','Nach London','Nach Paris'],a:0,ex:'Die Straße verband Norditalien mit Augusta Vindelicum, dem heutigen Augsburg. Heute ist sie ein beliebter Radweg.'},
{id:'h75',g:'gladiator',topic:'Römer',d:1,info:'Gladiatoren kämpften in Arenen zur Unterhaltung der Zuschauer. Die meisten waren Sklaven oder Kriegsgefangene.',q:'Wer waren die meisten Gladiatoren?',opts:['Sklaven oder Kriegsgefangene','Senatoren','Kaiser','Priester'],a:0,ex:'Erfolgreiche Gladiatoren wurden wie Stars gefeiert – frei waren die meisten aber nicht.'},
{id:'h76',g:'roemspur',topic:'Römer',d:2,info:'Viele Wörter kamen mit den Römern ins Deutsche, weil sie neue Dinge mitbrachten: Mauer (murus), Fenster (fenestra), Wein (vinum), Straße (strata).',q:'Welches deutsche Wort stammt aus dem Lateinischen der Römer?',opts:['Fenster','Haus','Brot','Hand'],a:0,ex:'Steinhäuser mit Glasfenstern brachten die Römer mit – und das Wort gleich dazu. Haus, Brot und Hand sind alte germanische Wörter.'},
{id:'h77',g:'christ',topic:'Römer',d:3,info:'Im Römischen Reich wurden Christen lange verfolgt. Kaiser Konstantin erlaubte im Jahr 313 das Christentum. Später wurde es sogar Staatsreligion.',q:'Was änderte sich unter Kaiser Konstantin für die Christen?',opts:['Sie durften ihren Glauben frei ausüben','Sie mussten Rom verlassen','Sie wurden alle Gladiatoren','Nichts'],a:0,ex:'Ab 313 waren Christen nicht mehr verboten – ein großer Wendepunkt für die Religion in Europa.'},
{id:'h78',g:'germanen',topic:'Römer',d:2,info:'Im Jahr 9 n. Chr. besiegten germanische Stämme unter Arminius drei römische Legionen in der Varusschlacht. Danach gaben die Römer den Plan auf, Germanien bis zur Elbe zu erobern.',q:'Wer führte die Germanen in der Varusschlacht?',opts:['Arminius','Augustus','Caesar','Romulus'],a:0,ex:'Arminius war selbst in Rom ausgebildet worden – deshalb kannte er die Kampfweise der Römer genau.'},
{id:'h79',g:'zahlen2',topic:'Römer',d:1,q:'Welche Zahl ist XX?',opts:['20','11','30','15'],a:0,ex:'X = 10, zweimal X = 20.'},
{id:'h80',g:'zahlen2',topic:'Römer',d:2,info:'Weitere römische Zahlzeichen: D = 500 und M = 1.000. Große Zahlen setzt man von links nach rechts zusammen: MC = 1.100.',q:'Welche Zahl ist MDC?',opts:['1600','1400','1060','2100'],a:0,ex:'M = 1.000, D = 500, C = 100. Zusammen: 1.600.'}
];
